<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bug Ranch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#bde5a0; --bg2:#a9db88; --panel:#fbfff6; --panel2:#eef8e4; --ink:#16351f; --muted:#56785f;
  --line:#cfe6bf; --leaf:#2b9a55; --leafd:#1d7a40; --pink:#ff5c93; --pinkd:#d93a72; --sun:#ffc53a; --sund:#d99a12;
  --sky:#46b4ff; --soil:#6b4428; --bad:#e5484d;
  --hunger:#ff8a3d; --joy:#ff5c93; --grow:#2bb673; --xp:#7b6cff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#10261a; --bg2:#163322; --panel:#1b3627; --panel2:#21422f; --ink:#ebf8e6; --muted:#9cc3a8; --line:#2b4f38;
}}
:root[data-theme="dark"]{ --bg:#10261a; --bg2:#163322; --panel:#1b3627; --panel2:#21422f; --ink:#ebf8e6; --muted:#9cc3a8; --line:#2b4f38; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 Nunito,"Trebuchet MS",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;margin:0;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
img{max-width:100%}
.wrap{max-width:1240px;margin:0 auto;padding:12px 14px 40px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto}
.brand h1{font-size:34px;font-weight:800;letter-spacing:-.5px}
.brand canvas{width:46px;height:46px}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:800}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,var(--sun) 55%,var(--sund));box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);flex:none}
#coins{font-size:18px;min-width:3ch}
.fame{flex-direction:column;align-items:stretch;gap:3px;padding:4px 14px;min-width:150px}
.fame span{font-size:12.5px;line-height:1}
.fbar{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden}
.fbar i{display:block;height:100%;background:var(--sun);width:0}
.ico{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;font-weight:900;font-size:13px}
.ico.off{opacity:.45;text-decoration:line-through}
.tabs{display:flex;gap:6px;margin:12px 0;overflow-x:auto;padding-bottom:2px}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:800;font-size:16px;color:var(--muted);white-space:nowrap;position:relative}
.tabs button.on{background:var(--ink);color:var(--bg)}
.tabs button .dot{position:absolute;top:4px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--pink)}
.view{display:none}.view.on{display:block}
.card{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:14px}
.ranchGrid{display:grid;grid-template-columns:1fr 340px;gap:12px;align-items:start}
.tank{position:relative;border-radius:24px;border:6px solid var(--soil);background:#6fbf55;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.tank canvas{display:block;width:100%;height:min(62vh,560px);touch-action:manipulation}
.tankTag{position:absolute;left:10px;bottom:10px;background:rgba(22,53,31,.72);color:#fff;border-radius:12px;padding:4px 10px;font-size:13px;font-weight:700;pointer-events:none}
.roster{margin-top:12px}
.rhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:10px}
.rhead h2{font-size:22px}
.muted{color:var(--muted)}
.rlist{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;width:112px;border:2px solid var(--line);background:var(--panel2);border-radius:16px;padding:6px;text-align:center;position:relative}
.chip.sel{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink)}
.chip img{width:64px;height:64px;display:block;margin:0 auto}
.chip b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip small{display:block;font-size:11.5px;color:var(--muted)}
.mini{display:flex;gap:3px;margin-top:4px}
.mini i{flex:1;height:5px;border-radius:3px;background:rgba(0,0,0,.1);overflow:hidden;position:relative}
.mini i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--c)}
.badge{position:absolute;top:4px;right:4px;font-size:10.5px;font-weight:900;background:var(--sun);color:#3a2700;border-radius:8px;padding:1px 6px}
.cls{display:inline-block;font-size:12px;font-weight:800;border-radius:8px;padding:1px 8px;background:var(--c);color:#fff}
#side h2{font-size:24px}
.sideTop{display:flex;gap:10px;align-items:center}
.sideTop img{width:88px;height:88px;flex:none;background:var(--panel2);border-radius:18px}
.nameIn{font:800 22px "Baloo 2",system-ui,sans-serif;color:var(--ink);background:transparent;border:0;border-bottom:2px dashed var(--line);width:100%;padding:0}
.bars{display:grid;gap:6px;margin:12px 0}
.bar{display:grid;grid-template-columns:72px 1fr 38px;align-items:center;gap:8px;font-size:13px;font-weight:700}
.bar .tr{height:10px;border-radius:6px;background:var(--panel2);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:6px;background:var(--c);transition:width .3s}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px;margin:8px 0}
.stats div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:2px 0}
.stats b{font-variant-numeric:tabular-nums}
.traits{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.trait{font-size:12px;font-weight:800;border-radius:8px;padding:2px 8px;background:var(--panel2);border:1px solid var(--line)}
.trait.rad{background:linear-gradient(90deg,#ffd6e7,#fff1b8,#c9f2ff);color:#4a2b00}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:6px}
.item{border:2px solid var(--line);background:var(--panel2);border-radius:12px;padding:5px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:800;line-height:1.1;position:relative}
.item svg{width:30px;height:30px}
.item .n{position:absolute;top:2px;right:4px;font-size:11px;background:var(--ink);color:var(--bg);border-radius:6px;padding:0 4px}
.item.fav{border-color:var(--pink)}
.item:hover{border-color:var(--leaf)}
.sec{font-size:13px;font-weight:800;color:var(--muted);margin:12px 0 2px}
.btn{border:0;border-radius:14px;padding:9px 16px;font-weight:900;background:var(--leaf);color:#fff;box-shadow:0 3px 0 var(--leafd);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--leafd)}
.btn.pink{background:var(--pink);box-shadow:0 3px 0 var(--pinkd)}
.btn.sun{background:var(--sun);color:#3a2700;box-shadow:0 3px 0 var(--sund)}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.big{font-size:18px;padding:12px 22px;border-radius:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.sp{border:2px solid var(--line);background:var(--panel);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:4px}
.sp img{width:96px;height:96px;align-self:center}
.sp h3{font-size:19px}
.sp.lock{opacity:.6}
.sp .desc{font-size:13px;color:var(--muted);min-height:2.6em}
.sbars{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:11.5px;align-items:center}
.sbars i{height:6px;border-radius:3px;background:var(--panel2);display:block;overflow:hidden}
.sbars i::after{content:"";display:block;height:100%;width:var(--w);background:var(--leaf)}
.price{display:flex;align-items:center;gap:6px;font-weight:900;margin-top:auto}
.shopH{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px}
.shopH h2{font-size:26px}
.sup{border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:10px;display:grid;grid-template-columns:44px 1fr;gap:4px 10px;align-items:center}
.sup svg{width:44px;height:44px;grid-row:span 2}
.sup b{font-size:15px}
.sup p{margin:0;font-size:12.5px;color:var(--muted);grid-column:1/-1}
.sup .row{grid-column:1/-1}
.evs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ev{border:3px solid var(--line);background:var(--panel);border-radius:20px;padding:14px;text-align:left}
.ev.on{border-color:var(--pink);background:var(--panel2)}
.ev h3{font-size:22px}
.ev p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.lgs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.lg{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:8px 12px;text-align:left;min-width:150px}
.lg.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.lg:disabled{opacity:.45;cursor:not-allowed}
.lg b{display:block;font-size:15px}.lg small{font-size:12px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:10px 0}
.pick .chip{width:auto}
.chip:disabled{opacity:.4;cursor:not-allowed}
.wheel{font-size:13.5px;font-weight:700}
.breedRow{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;max-width:620px}
.slot{border:3px dashed var(--line);border-radius:20px;min-height:150px;display:grid;place-items:center;text-align:center;padding:8px;background:var(--panel)}
.slot img{width:96px;height:96px}
.plus{font:800 40px "Baloo 2",sans-serif;color:var(--pink)}
.eggs{display:flex;gap:10px;flex-wrap:wrap}
.egg{border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:8px 12px;min-width:170px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dx{border:2px solid var(--line);background:var(--panel);border-radius:18px;padding:10px;text-align:center}
.dx img{width:90px;height:90px}
.dx h3{font-size:17px}
.dx p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.dx.hy{background:linear-gradient(160deg,var(--panel),var(--panel2))}
#ov{position:fixed;inset:0;z-index:50;background:var(--bg2);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#ov[hidden]{display:none}
.ovbar{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.ovbar h2{font-size:24px;margin-right:auto}
#ovc{flex:1;min-height:0;width:100%;display:block;touch-action:manipulation}
.ovctl{display:flex;gap:10px;align-items:center;justify-content:center;padding:10px 14px 14px;flex-wrap:wrap}
.stam{width:min(320px,60vw);height:16px;border-radius:9px;background:var(--panel);border:2px solid var(--line);overflow:hidden}
.stam i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--grow));width:100%}
.result{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,30,18,.45);padding:16px}
.result[hidden]{display:none}
.result .card{max-width:420px;width:100%;text-align:center}
.result h2{font-size:44px;font-weight:800}
.result ul{list-style:none;padding:0;margin:10px 0 16px;text-align:left;font-weight:700}
.result li{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:5px 2px}
#help{position:fixed;z-index:90}
#toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:80;pointer-events:none;width:min(92vw,440px)}
.toast{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:14px;font-weight:800;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:tin .25s ease-out}
.toast.good{background:var(--leaf);color:#fff}.toast.warn{background:var(--bad);color:#fff}.toast.gold{background:var(--sun);color:#3a2700}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.help{max-width:560px}
.help li{margin:4px 0}
.empty{padding:20px;text-align:center;color:var(--muted)}
@media (max-width:860px){
  .ranchGrid{grid-template-columns:1fr}
  .tank canvas{height:52vh}
  .evs{grid-template-columns:1fr}
  .brand h1{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><canvas id="logo" width="92" height="92"></canvas><h1>Bug Ranch</h1></div>
    <div class="hud">
      <div class="pill" title="Coins"><span class="coin"></span><b id="coins">0</b></div>
      <div class="pill fame" title="Fame from cups unlocks new leagues and species"><span id="rlvl">Backyard ranch</span><div class="fbar"><i id="fbar"></i></div></div>
      <button class="ico" id="mBtn" title="Music" aria-label="Toggle music">♪</button>
      <button class="ico" id="sBtn" title="Sound effects" aria-label="Toggle sound effects">fx</button>
      <button class="ico" id="hBtn" title="How to play" aria-label="How to play">?</button>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="ranch" class="on">Ranch</button>
    <button data-tab="shop">Shop</button>
    <button data-tab="arena">Arena</button>
    <button data-tab="breed">Breeding</button>
    <button data-tab="dex">Bugdex</button>
  </nav>
  <main>
    <section class="view on" id="v-ranch">
      <div class="ranchGrid">
        <div class="tank"><canvas id="tc"></canvas><div class="tankTag" id="tankTag"></div></div>
        <aside class="card" id="side"></aside>
      </div>
      <div class="card roster">
        <div class="rhead"><h2>Your bugs</h2><span class="muted" id="slots"></span></div>
        <div class="rlist" id="roster"></div>
      </div>
    </section>
    <section class="view" id="v-shop"></section>
    <section class="view" id="v-arena"></section>
    <section class="view" id="v-breed"></section>
    <section class="view" id="v-dex"></section>
  </main>
</div>
<div id="ov" hidden>
  <div class="ovbar"><h2 id="ovTitle">Race</h2><div id="ovHud" class="row"></div><button class="btn ghost" id="ovQuit">Forfeit</button></div>
  <canvas id="ovc"></canvas>
  <div class="ovctl" id="ovCtl"></div>
  <div class="result" id="ovRes" hidden><div class="card" id="ovResCard"></div></div>
</div>
<div id="toasts"></div>
<script>
'use strict';

const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;

const uid=()=>Math.random().toString(36).slice(2,9);

dragonfly:{n:'Dragonfly',t:3,p:450,cls:'F',st:[10,5,2,4],z:1.1,life:45,c1:[170,230,80,45],c2:[180,220,60,75],pats:['dots','band','none'],

stag:{n:'Stag beetle',t:3,p:480,cls:'A',st:[4,9,8,5],z:1.15,life:65,c1:[0,30,45,25],c2:[0,40,50,40],pats:['split','none'],

function simBug(b,dt){
 const T=S.tools;
 const hr=.42*(has(b,'glutton')?1.5:1)*(b.st>0?1.6:1);
 const jr=.32*(has(b,'sunny')?.6:1)*(T.musicbox?.65:1)*(b.hunger<15?2:1);
 b.hunger=Math.max(0,b.hunger-hr*dt);b.joy=Math.max(0,b.joy-jr*dt);
 if(b.growth<100&&b.hunger>12){const prev=stageOf(b);
  b.growth=Math.min(100,b.growth+.6*dt*(SP[b.sp].grow||1)*(has(b,'glutton')?1.3:1)*(T.lamp?1.3:1)*(b.st>0?b.sm:1)*(.5+b.joy/200));
  if(stageOf(b)!==prev)onStage(b);}
 if(b.st>0){b.st-=dt;if(b.st<=0){b.st=0;b.sm=1;mark('side');}}
 const was=isElder(b);b.age+=dt/DAY*(has(b,'ageless')?.6:1);if(!was&&isElder(b)){toast(`${b.name} is now an elder. Stats drop 20%.`);mark('side','roster');}
 if(b.bcd>0)b.bcd=Math.max(0,b.bcd-dt);
 if(T.wheel&&b.growth>=100)addXp(b,dt*.25,true);
 if(T.feeder&&S.auto&&b.hunger<35){const f=['leaf','apple','honey','grub'].find(k=>S.inv[k]>0);if(f){S.inv[f]--;applyItem(b,f,true);mark('side');}}
}

 for(let i=S.eggs.length-1;i>=0;i--){const e=S.eggs[i];e.t-=dt*(S.tools.incubator?2:1);if(e.t<=0)hatch(e);}
}

 S.eggs=S.eggs.filter(x=>x!==e);const b=e.bug;S.bugs.push(b);const isNew=!S.dex[b.sp];S.dex[b.sp]=1;sfx('hatch');

  if(!auto&&b.hunger>=97){toast(`${b.name} is too full to eat`,'warn');return false;}
  const fav=b.favF===k;b.hunger=Math.min(100,b.hunger+I.h);b.joy=Math.min(100,b.joy+(I.j||0)+(fav?15:0));
  if(I.g&&b.growth<100){const p=stageOf(b);b.growth=Math.min(100,b.growth+I.g);if(stageOf(b)!==p)onStage(b);}
  if(I.x)addXp(b,I.x);spawnFx(b,'feed',fav);
 }else if(I.k==='toy'){
  if(I.all){for(const x of S.bugs){x.joy=Math.min(100,x.joy+I.j+(x.favT===k?10:0));spawnFx(x,'play');}}
  else{if(b.joy>=97){toast(`${b.name} is already overjoyed`,'warn');return false;}const fav=b.favT===k;b.joy=Math.min(100,b.joy+I.j*(fav?1.6:1));b.hunger=Math.max(0,b.hunger-4);spawnFx(b,'play',fav);}
 }else{
  if(I.sm){if(b.growth>=100){toast(`${b.name} is fully grown already`,'warn');return false;}b.sm=I.sm;b.st=I.sd;if(I.jd)b.joy=Math.max(0,b.joy-I.jd);}

  spawnFx(b,'spark');
 }
 return true;
}

 else if(p.k==='text'){c.font=`800 ${p.s||18}px "Baloo 2",sans-serif`;c.textAlign='center';c.lineWidth=4;c.strokeStyle='rgba(0,0,0,.55)';c.strokeText(p.txt,p.x,p.y);c.fillText(p.txt,p.x,p.y);}

function drawTank(t){

 S.eggs.forEach((e,i)=>{const[x,y]=eggPos(i);const p=1-e.t/e.tt;drawEgg(c,x*TW,y*TH,u*1.6,e.bug.col,t,p);
  c.fillStyle='rgba(255,255,255,.85)';c.fillRect(x*TW-12*u*1.6,y*TH+14*u*1.6,24*u*1.6*p,3);});

  if(b.id===S.sel){c.strokeStyle='#ff5c93';c.lineWidth=2.5;c.setLineDash([6,5]);c.lineDashOffset=-t*20;ell(c,x,y+3,E.len*sc*.6+6,E.len*sc*.42+5);c.stroke();c.setLineDash([]);}
  drawBug(c,b.sp,b.col,x,y,sc,r.ang,t,{walk:r.walk,fly:r.mv&&SP[b.sp].cls==='F',glow:b.joy/100,radiant:has(b,'radiant')});
  const top=y-E.len*sc*.55-10;
  if(b.hunger<25){const bb=Math.sin(t*5)*2;c.fillStyle='#fff';ell(c,x,top+bb,8,8);c.fill();c.fillStyle='#ff8a3d';c.beginPath();c.moveTo(x,top-5+bb);c.quadraticCurveTo(x+5,top+2+bb,x,top+4+bb);c.quadraticCurveTo(x-5,top+2+bb,x,top-5+bb);c.fill();}
  else if(b.joy<25){c.fillStyle='rgba(120,130,150,.85)';[[-5,0,5],[2,-2,6],[7,1,4]].forEach(([a,d,rr])=>{ell(c,x+a,top+d,rr,rr*.8);c.fill();});}
  if(b.id===S.sel){c.font='800 13px "Baloo 2",sans-serif';c.textAlign='center';const w=c.measureText(b.name).width+14;c.fillStyle='rgba(22,53,31,.8)';c.beginPath();c.roundRect?c.roundRect(x-w/2,top-30,w,20,8):c.rect(x-w/2,top-30,w,20);c.fill();c.fillStyle='#fff';c.fillText(b.name,x,top-15);}
 }
 for(const p of PRT)drawParticle(c,p);
}

function makeChild(a,b){
 let sp;if(a.sp===b.sp)sp=a.sp;else{const h=RECIPES[[a.sp,b.sp].sort().join('+')];sp=h&&Math.random()<.45?h:(Math.random()<.5?a.sp:b.sp);}
 const ch=newBug(sp),hy=SP[sp].t===5&&sp!==a.sp&&sp!==b.sp;
 const s1=Math.random()<.5?a.col:b.col,s2=Math.random()<.5?a.col:b.col;
 const col={h1:s1.h1,s1:s1.s1,l1:s1.l1,h2:s2.h2,s2:s2.s2,l2:s2.l2,pat:Math.random()<.5?a.col.pat:b.col.pat};
 if(Math.random()<.3)col.h1=mixHue(a.col.h1,b.col.h1);if(Math.random()<.3)col.h2=mixHue(a.col.h2,b.col.h2);
 if(Math.random()<.08)col.h1=(col.h1+rand(60,300))%360;if(Math.random()<.08)col.h2=(col.h2+rand(60,300))%360;
 if(hy){const n=natCol(sp);if(Math.random()<.5){col.h1=n.h1;col.s1=n.s1;col.l1=n.l1;}else{col.h2=n.h2;col.s2=n.s2;col.l2=n.l2;}}
 if(!SP[sp].pats.includes(col.pat))col.pat=pick(SP[sp].pats);
 ch.col=col;

 const tr=new Set();[...a.tr,...b.tr].forEach(t=>{if(t!=='radiant'&&Math.random()<.5)tr.add(t);});
 if(Math.random()<.1)tr.add(pick(Object.keys(TRAITS).filter(k=>k!=='radiant')));
 if(Math.random()<(has(a,'radiant')||has(b,'radiant')?.3:.04))tr.add('radiant');
 ch.tr=[...tr].slice(0,3);ch.gen=Math.max(a.gen,b.gen)+1;ch.par=[a.name,b.name];ch.favF=Math.random()<.5?a.favF:b.favF;ch.favT=Math.random()<.5?a.favT:b.favT;
 return ch;
}

function boost(r){const g=G;if(!g||g.type!=='race'||g.t<0||r.fin!=null||r.cd>0||r.stam<8)return;r.boost=.9;r.cd=2.4;if(r.me)sfx('boost');}
function updRace(dt){
 const g=G,pt=g.t;g.t+=dt;cdTick(pt,g.t);if(g.t<0||g.over)return;
 for(const r of g.rs){
  if(r.fin!=null){r.x+=40*dt;r.walk+=dt*4;continue;}
  let m=1;if(r.stam<=0)m*=.62;if(r.boost>0){m*=1.7;r.boost-=dt;r.stam-=22*dt;}
  if(has(r.bug,'sprinter')&&g.t<2.5)m*=1.35;if(r.stun>0){r.stun-=dt;m*=.15;}
  r.v=(55+r.st.spd*1.25)*m*(1+.07*Math.sin(g.t*2.3+r.ph));r.x+=r.v*dt;r.walk+=r.v*dt*.18;r.stam=Math.max(0,r.stam-5*dt);r.cd-=dt;
  if(Math.random()<dt*.05*(1-clamp(r.st.def/250,0,.8))&&r.stun<=0){r.stun=.5;if(r.me)sfx('stumble');}
  if(!r.me&&g.t>.8&&r.cd<=0&&r.stam>35&&Math.random()<dt*.8)boost(r);
  if(r.x>=g.len){r.fin=g.t;g.order.push(r);if(r.me){g.end=g.t+1.4;g.place=g.order.length;}}
 }
 if(g.end!=null&&g.t>=g.end)finishEvent(g.bugs,g.place,g.place===1);
 else if(g.t>60){const p=1+g.rs.filter(r=>r.x>g.me.x).length;finishEvent(g.bugs,p,p===1);}
}

}
function fpos(f){const W=OW,H=OH,base=f.side?W*.72:W*.28,x=base+(f.i===1?(f.side?W*.07:-W*.07):0),y=H*(.24+.27*f.i);return[x+f.ox,y+f.oy];}
function numAt(f,txt,col,big){const[x,y]=fpos(f);G.nums.push({x:x+rand(-8,8),y:y-30,txt:String(txt),col,life:1,max:1,s:big?24:18,k:'text',vx:0,vy:-30});}
function kill(f){f.dead=true;f.hp=0;sfx('ko');if(G.focus===f)G.focus=null;}
function dealHit(f,tg,mult,sp){
 const fc=SP[f.bug.sp].cls,tcl=SP[tg.bug.sp].cls;let adv=1;if(CLS[fc].beats===tcl)adv=1.3;else if(CLS[tcl].beats===fc)adv=.8;
 let d=f.st.pow*.55*mult*adv*rand(.85,1.15)*(70/(70+tg.st.def));if(tg.shell>0)d*=.5;d=Math.max(1,Math.round(d));
 tg.hp-=d;tg.en=Math.min(100,tg.en+12);tg.fl=.18;numAt(tg,d,adv>1?'#ffd23f':'#ffffff',sp||adv>1);sfx(sp||adv>1?'crit':'hit');
 const[x,y]=fpos(tg);for(let i=0;i<8;i++){const a=rand(0,TAU);G.parts.push({x,y,vx:Math.cos(a)*90,vy:Math.sin(a)*90,life:.4,max:.4,k:'spark',col:adv>1?'#ffd23f':'#fff'});}
 if(has(tg.bug,'thorny')&&!f.dead){const r=Math.max(1,Math.round(d*.2));f.hp-=r;numAt(f,r,'#ff9a9a');if(f.hp<=0)kill(f);}
 if(tg.hp<=0&&!tg.dead)kill(tg);
}
function beginAttack(f){
 const g=G,foes=g.f.filter(o=>o.side!==f.side&&!o.dead);if(!foes.length)return;
 const sp=f.en>=100,cls=SP[f.bug.sp].cls;let tg;
 if(f.side===0&&g.focus&&!g.focus.dead)tg=g.focus;
 else if(sp&&cls==='H')tg=foes.reduce((a,b)=>a.hp<b.hp?a:b);
 else{const good=foes.filter(o=>CLS[cls].beats===SP[o.bug.sp].cls);tg=f.side===1&&good.length&&Math.random()<.5?pick(good):pick(foes);}
 if(sp){f.en=0;numAt(f,CLS[cls].sp+'!','#c9b8ff',true);if(cls==='A')f.shell=3.5;}
 f.anim={t:0,d:.45,tg,hit:false,sp};
}
function resolveHit(f,a){
 const cls=SP[f.bug.sp].cls;let m=1;if(a.sp&&cls==='F')m=2;if(a.sp&&cls==='H')m=1.8;
 if(!a.tg.dead)dealHit(f,a.tg,m,a.sp);
 if(a.sp&&cls==='C'){const al=G.f.filter(o=>o.side!==f.side&&!o.dead);if(al.length)dealHit(f,a.tg.dead?pick(al):a.tg,.75,true);}
 if(!a.sp)f.en=Math.min(100,f.en+28);
}
function updBattle(dt){
 const g=G;dt*=g.spd;const pt=g.t;g.t+=dt;cdTick(pt,g.t);
 for(const arr of[g.nums,g.parts])for(let i=arr.length-1;i>=0;i--){const p=arr[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)arr.splice(i,1);}
 if(g.t<0||g.over)return;
 for(const f of g.f){f.fl=Math.max(0,f.fl-dt);if(f.dead)continue;
  if(has(f.bug,'regen'))f.hp=Math.min(f.max,f.hp+f.max*.015*dt);f.shell=Math.max(0,f.shell-dt);
  if(f.anim){const a=f.anim;a.t+=dt;const p=Math.min(1,a.t/a.d);f.ox=f.oy=0;const[ax,ay]=fpos(f),[tx,ty]=fpos(a.tg);const l=Math.sin(p*Math.PI)*.55;f.ox=(tx-ax)*l;f.oy=(ty-ay)*l;
   if(p>=.5&&!a.hit){a.hit=true;resolveHit(f,a);}if(p>=1){f.anim=null;f.ox=f.oy=0;}continue;}
  f.tm-=dt;if(f.tm<=0){f.tm=2.4*70/(f.st.spd+40);beginAttack(f);}
 }
 const a0=g.f.some(f=>f.side===0&&!f.dead),a1=g.f.some(f=>f.side===1&&!f.dead);
 if((!a0||!a1)&&!g.endT)g.endT=g.t+1.2;
 if(g.endT&&g.t>=g.endT)finishEvent(g.bugs,a0?1:2,a0);
}
function drawBattle(){
 const c=octx,g=G,W=OW,H=OH;c.setTransform(dpr,0,0,dpr,0,0);
 c.fillStyle='#7cc95f';c.fillRect(0,0,W,H);
 c.fillStyle='#d9a066';ell(c,W/2,H/2,W*.46,H*.44);c.fill();c.strokeStyle='#b07a44';c.lineWidth=6;c.stroke();
 const R=mulberry(3);for(let i=0;i<26;i++){const a=i/26*TAU;c.fillStyle=hsl(200+R()*30,10,60+R()*15);ell(c,W/2+Math.cos(a)*W*.47,H/2+Math.sin(a)*H*.45,6+R()*4,5+R()*3);c.fill();}
 c.strokeStyle='rgba(255,255,255,.35)';c.setLineDash([8,8]);c.lineWidth=2;c.beginPath();c.moveTo(W/2,H*.12);c.lineTo(W/2,H*.88);c.stroke();c.setLineDash([]);
 const u=Math.min(W,H)/380,t=g.t;
 const order=[...g.f].sort((a,b)=>fpos(a)[1]-fpos(b)[1]);
 for(const f of order){const[x,y]=fpos(f),b=f.bug,E=extent(b.sp),sc=u*1.5*Math.min(1.3,SP[b.sp].z)*(.55+.45*b.growth/100)*Math.min(1,48/E.len);
  if(g.focus===f){c.strokeStyle='#ff5c93';c.lineWidth=3;c.save();c.translate(x,y);c.rotate(t*2);for(let i=0;i<4;i++){c.rotate(TAU/4);c.beginPath();c.arc(0,0,E.len*sc*.6+10,-.4,.4);c.stroke();}c.restore();}
  c.globalAlpha=f.dead?.3:1;
  drawBug(c,b.sp,f.dead?{...b.col,s1:5,s2:5}:b.col,x,y,sc,f.ang+(f.dead?.6:0),t,{walk:f.anim?t*12:t*2,fly:SP[b.sp].cls==='F'&&!f.dead,radiant:has(b,'radiant')&&!f.dead});
  c.globalAlpha=1;
  if(f.fl>0){c.fillStyle=`rgba(255,255,255,${f.fl*3})`;ell(c,x,y,E.len*sc*.5,E.len*sc*.35);c.fill();}
  if(f.shell>0){c.strokeStyle='rgba(79,127,224,.8)';c.fillStyle='rgba(120,170,255,.18)';c.lineWidth=2;ell(c,x,y,E.len*sc*.65+6,E.len*sc*.65+6);c.fill();c.stroke();}
  const bw=70,bx=x-bw/2,by=y-E.len*sc*.6-26;
  c.fillStyle='rgba(22,53,31,.55)';c.fillRect(bx-1,by-1,bw+2,10);const p=clamp(f.hp/f.max,0,1);c.fillStyle=p>.5?'#2bb673':p>.25?'#ffc53a':'#e5484d';c.fillRect(bx,by,bw*p,8);
  c.fillStyle='#b6a3ff';c.fillRect(bx,by+9,bw*f.en/100,3);
  c.fillStyle=CLS[SP[b.sp].cls].c;ell(c,bx-8,by+4,5,5);c.fill();
  c.font='800 12px "Baloo 2",sans-serif';c.textAlign='center';c.fillStyle='#16351f';c.fillText(f.side?b.name:b.name+' (you)',x,by-4);
 }
 for(const p of g.parts)drawParticle(c,p);for(const p of g.nums)drawParticle(c,p);
 if(g.t<0)bigText(c,String(Math.max(1,Math.ceil(-g.t))>3?3:Math.max(1,Math.ceil(-g.t))),W/2,H/2,90);else if(g.t<.8)bigText(c,'Fight!',W/2,H/2,80,'#ffc53a');
}

/* lift */
function startLift(b,L){
 const st=stats(b);
 G={type:'lift',L,b,st,max:Math.round(st.pow*1.4),att:0,needle:0,dir:1,phase:'aim',anim:0,res:[],best:0,t:0,over:false,parts:[],bugs:[b],
  ai:[0,1,2,3].map(()=>{const ab=aiBug(L),s=stats(ab);return{bug:ab,best:Math.round(s.pow*1.4*rand(.6,.93))};})};
 openOv(LEAGUES[L].n+' crumb lift',`<button class="btn pink big" id="liftBtn">Lift!</button><span class="muted" style="font-weight:700">Stop the needle in the middle</span>`,'');
 $('#liftBtn').onpointerdown=e=>{e.preventDefault();liftPress();};
 playMusic('race');
}
function liftPress(){
 const g=G;if(!g||g.type!=='lift'||g.phase!=='aim'||g.over)return;
 const acc=1-Math.abs(g.needle-.5)*2,w=Math.round(g.max*(.4+.6*Math.pow(acc,1.4)));g.res.push({acc,w});g.best=Math.max(g.best,w);g.phase='lift';g.anim=0;g.cur=acc;sfx('lift');
 const msg=acc>.92?'Perfect!':acc>.7?'Great!':acc>.4?'Okay':'Wobbly...';g.parts.push({x:OW/2,y:OH*.25,vx:0,vy:-20,life:1.3,max:1.3,k:'text',txt:msg,col:acc>.7?'#ffc53a':'#fff',s:34});
}
function updLift(dt){
 const g=G;g.t+=dt;for(let i=g.parts.length-1;i>=0;i--){const p=g.parts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)g.parts.splice(i,1);}
 if(g.over)return;
 if(g.phase==='aim'){g.needle+=g.dir*dt*(.8+.45*g.att);if(g.needle>1){g.needle=1;g.dir=-1;}if(g.needle<0){g.needle=0;g.dir=1;}}
 else if(g.phase==='lift'){g.anim+=dt;if(g.anim>1.6){g.att++;if(g.att>=3){g.phase='done';const p=1+g.ai.filter(a=>a.best>g.best).length;setTimeout(()=>{if(G===g)finishEvent(g.bugs,p,p===1);},600);}else g.phase='aim';}}
 const lb=$('#liftBtn');if(lb)lb.disabled=g.phase!=='aim';
}
function drawLift(){
 const c=octx,g=G,W=OW,H=OH;c.setTransform(dpr,0,0,dpr,0,0);
 c.fillStyle='#7cc95f';c.fillRect(0,0,W,H);c.fillStyle='#d9a066';c.beginPath();c.roundRect?c.roundRect(W*.1,H*.12,W*.8,H*.62,30):c.rect(W*.1,H*.12,W*.8,H*.62);c.fill();
 const u=Math.min(W,H)/360,cx=W*.42,cy=H*.48,b=g.b,E=extent(b.sp),sc=u*1.7*Math.min(1,52/E.len);
 let lift=0;if(g.phase==='lift'){const p=g.anim/1.6;lift=Math.sin(Math.min(1,p*1.6)*Math.PI/2)*g.cur*(p<.75?1:Math.max(0,1-(p-.75)*4));}
 const cr=u*(26+18*Math.min(1,g.max/150));
 c.fillStyle='rgba(0,0,0,.18)';ell(c,cx+lift*10,cy+6,cr*(1-lift*.2),cr*.5*(1-lift*.2));c.fill();
 drawBug(c,b.sp,b.col,cx,cy+cr*.2,sc,-Math.PI/2,g.t,{walk:g.phase==='lift'?g.t*20:0,radiant:has(b,'radiant')});
 const ky=cy-lift*u*30,ks=1+lift*.3;c.save();c.translate(cx,ky);c.scale(ks,ks);
 c.fillStyle='#e0a95e';c.beginPath();for(let i=0;i<10;i++){const a=i/10*TAU,r=cr*(i%2?.9:1);c.lineTo(Math.cos(a)*r,Math.sin(a)*r*.8);}c.closePath();c.fill();
 c.fillStyle='#6b4428';[[-.4,-.2],[.3,.1],[0,.4],[-.1,-.5],[.5,-.3]].forEach(([a,d])=>{ell(c,a*cr,d*cr*.8,cr*.1,cr*.08);c.fill();});c.restore();
 const bx=W*.12,bw=W*.76,by=H*.8,bh=18,gr=c.createLinearGradient(bx,0,bx+bw,0);
 gr.addColorStop(0,'#e5484d');gr.addColorStop(.3,'#ffc53a');gr.addColorStop(.5,'#2bb673');gr.addColorStop(.7,'#ffc53a');gr.addColorStop(1,'#e5484d');
 c.fillStyle=gr;c.beginPath();c.roundRect?c.roundRect(bx,by,bw,bh,9):c.rect(bx,by,bw,bh);c.fill();
 const nx=bx+bw*g.needle;c.fillStyle='#16351f';c.beginPath();c.moveTo(nx,by-4);c.lineTo(nx-7,by-14);c.lineTo(nx+7,by-14);c.fill();c.fillRect(nx-2,by-4,4,bh+8);
 c.textAlign='left';c.font='800 15px Nunito,sans-serif';c.fillStyle='#16351f';
 c.fillText(`Try ${Math.min(3,g.att+1)} of 3`,bx,by+bh+22);c.textAlign='right';c.fillText(`Best: ${g.best} g`,bx+bw,by+bh+22);
 const lx=W*.66,ly=H*.18;c.textAlign='left';c.font='800 16px "Baloo 2",sans-serif';c.fillText('Leaderboard',lx,ly);
 const rows=[...g.ai.map(a=>({n:a.bug.name,v:a.best,me:false})),{n:b.name+' (you)',v:g.best,me:true}].sort((a,b2)=>b2.v-a.v);
 c.font='700 13px Nunito,sans-serif';rows.forEach((r,i)=>{c.fillStyle=r.me?'#d93a72':'#16351f';c.fillText(`${i+1}. ${r.n}`,lx,ly+22+i*19);c.textAlign='right';c.fillText(`${r.v} g`,Math.min(W-10,lx+Math.max(150,W*.22)),ly+22+i*19);c.textAlign='left';});
 if(g.phase==='lift'&&g.anim>.3){const w=g.res[g.res.length-1].w;bigText(c,`${w} g`,cx,ky-cr*1.3,30,'#fff');}
 for(const p of g.parts)drawParticle(c,p);
}
oc.addEventListener('pointerdown',e=>{
 const g=G;if(!g)return;const r=oc.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 if(g.type==='race')boost(g.me);
 else if(g.type==='lift')liftPress();
 else if(g.type==='battle'){let best=null,bd=60;for(const f of g.f){if(f.side!==1||f.dead)continue;const[fx,fy]=fpos(f),d=Math.hypot(fx-x,fy-y);if(d<bd){bd=d;best=f;}}if(best){g.focus=best;sfx('click');}}
});
document.addEventListener('keydown',e=>{if(!G||ov.hidden)return;if(e.code==='Space'){e.preventDefault();if(G.type==='race')boost(G.me);else if(G.type==='lift')liftPress();}});

/* ---------- loop ---------- */
function live(){
 if(DIRTY.has('top')){renderTop();DIRTY.delete('top');}else renderTop();
 if(TAB==='ranch'){if(DIRTY.has('side')){renderSide();DIRTY.delete('side');}else liveSide();if(DIRTY.has('roster')){renderRoster();DIRTY.delete('roster');}else liveRoster();}
 else if(DIRTY.has(TAB)){({shop:renderShop,arena:renderArena,breed:renderBreed,dex:renderDex})[TAB]();DIRTY.delete(TAB);}
 if(TAB==='breed')liveBreed();
}
let last=performance.now(),saveT=0,liveT=0,shopT=0;
function loop(now){
 let dt=(now-last)/1000;last=now;if(dt>2){catchUp(Math.min(dt,600));dt=0;}dt=Math.min(dt,.05);
 simAll(dt);
 if(G&&!ov.hidden){if(G.type==='race'){updRace(dt);if(G)drawRace();}else if(G.type==='battle'){updBattle(dt);if(G)drawBattle();}else{updLift(dt);if(G)drawLift();}}
 else if(TAB==='ranch'){tankUpdate(dt);drawTank(now/1000);}
 liveT+=dt;if(liveT>.35){liveT=0;live();}
 shopT+=dt;if(shopT>3){shopT=0;if(TAB==='shop'||TAB==='arena'||TAB==='breed')mark(TAB);}
 saveT+=dt;if(saveT>5){saveT=0;save();}
 requestAnimationFrame(loop);
}
window.addEventListener('resize',()=>{sizeTank();if(!ov.hidden)sizeOv();});
window.addEventListener('pagehide',()=>{dbT=0;save();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){dbT=0;save();}});
document.addEventListener('pointerdown',()=>{initAudio();if(!MUS.track)playMusic('ranch');},{once:false});
(function init(){
 if(localT){const away=Math.min((Date.now()-localT)/1000,600);if(away>5)catchUp(away);}
 const lc=$('#logo').getContext('2d');lc.scale(2,2);drawBug(lc,'ladybug',{h1:350,s1:85,l1:52,h2:0,s2:10,l2:14,pat:'spots'},23,23,1.15,-Math.PI/2.6,0,{shadow:false});
 applyAudioPrefs();sizeTank();markAll();live();
 if(!S.help)showHelp();
 requestAnimationFrame(t=>{last=t;sizeTank();requestAnimationFrame(loop);});
})();
</script>
