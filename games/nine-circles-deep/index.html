<style>
/* Layout: one full-bleed canvas; HUD floats at 16px insets; shops and title are centered panels over a dimmed scene. */
:root{
  --ink:#0c0a0f;      /* violet-biased black */
  --smoke:#1d1822;    /* panel ground */
  --bone:#d9d2c3;     /* text */
  --brass:#d8a94a;    /* money, primary action */

  --ichor:#6fd6c5;    /* fuel, secrets */
  --f-display:"IM Fell English SC","Times New Roman",serif;
  --f-body:"Spectral",Georgia,serif;
  --f-hud:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace;

}
html,body{height:100%;margin:0;padding:0}
body{background:var(--ink);color:var(--bone);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}

canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}

button:focus-visible{outline:2px solid var(--ichor);outline-offset:2px}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;font-family:var(--f-hud);font-size:13px;letter-spacing:.04em}
#hud .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
#hud .stat{background:rgba(12,10,15,.72);border:1px solid rgba(217,210,195,.18);padding:8px 10px;min-width:0}
#circle{font-family:var(--f-display);font-size:20px;letter-spacing:.06em;line-height:1.1}
#circleSub{opacity:.7;font-size:12px;margin-top:2px}
#cash{color:var(--brass);font-size:18px;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:6px;width:min(220px,44vw)}
.bar{position:relative;height:14px;background:rgba(217,210,195,.12);border:1px solid rgba(217,210,195,.25)}
.bar i{position:absolute;inset:0 auto 0 0;width:50%;display:block}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;mix-blend-mode:difference;color:#fff}
#hullBar i{background:var(--blood)} #fuelBar i{background:var(--ichor)} #cargoBar i{background:var(--brass)}
#toast{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,calc(100% - 32px));text-align:center;font-family:var(--f-body);font-style:italic;font-size:17px;line-height:1.35;text-shadow:0 1px 6px #000,0 0 2px #000;opacity:0;transition:opacity .5s;pointer-events:none}
#toast.on{opacity:1}
#items{position:absolute;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;pointer-events:auto}
.slot{width:48px;height:48px;background:rgba(12,10,15,.78);border:1px solid rgba(217,210,195,.3);position:relative;display:grid;place-items:center;font-family:var(--f-hud);font-size:18px;padding:0}
.slot small{position:absolute;left:3px;top:1px;font-size:10px;opacity:.6}
.slot b{position:absolute;right:3px;bottom:1px;font-size:11px;color:var(--brass);font-weight:400}
.slot:disabled{opacity:.35}

/* Panels */
.veil{position:absolute;inset:0;background:rgba(6,4,9,.78);display:grid;place-items:center;padding:16px;overflow:auto}
.veil[hidden]{display:none!important}
.panel{background:var(--smoke);border:1px solid rgba(217,210,195,.25);width:min(720px,100%);max-height:100%;overflow:auto;padding:22px 22px 18px;box-shadow:0 0 0 4px var(--ink),0 0 0 5px rgba(216,169,74,.35)}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0 0 2px;letter-spacing:.05em}
.panel .sub{font-style:italic;opacity:.75;margin:0 0 14px;line-height:1.4}
.tabs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.tab{background:none;border:1px solid rgba(217,210,195,.3);padding:6px 12px;font-family:var(--f-hud);font-size:13px}
.tab[aria-selected="true"]{background:var(--bone);color:var(--ink)}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:10px 12px;border:1px solid rgba(217,210,195,.16);background:rgba(12,10,15,.4)}
.row h3{margin:0;font-family:var(--f-hud);font-weight:400;font-size:14px;letter-spacing:.05em;color:var(--bone)}
.row p{margin:0;font-size:14px;opacity:.72;line-height:1.35;grid-column:1}
.row .lvl{font-family:var(--f-hud);font-size:12px;color:var(--ichor);margin-left:8px}
.buy{grid-row:1 / span 2;grid-column:2;background:var(--brass);color:var(--ink);border:0;padding:8px 14px;font-family:var(--f-hud);font-size:14px;min-width:92px;font-variant-numeric:tabular-nums}
.buy:disabled{background:transparent;color:var(--bone);opacity:.4;border:1px solid rgba(217,210,195,.35)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{background:var(--brass);color:var(--ink);border:0;padding:10px 18px;font-family:var(--f-hud);font-size:15px;letter-spacing:.06em}
.btn.ghost{background:none;color:var(--bone);border:1px solid rgba(217,210,195,.4)}
.total{font-family:var(--f-hud);color:var(--brass);font-size:16px;margin:10px 0 0}

/* Title */
#title .panel{text-align:left}
#title h1{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,9vw,76px);line-height:.95;margin:0 0 10px;letter-spacing:.03em}
#title .keys{font-family:var(--f-hud);font-size:13px;line-height:1.7;opacity:.85;margin:14px 0 0}
#title .keys kbd{border:1px solid rgba(217,210,195,.4);padding:0 6px;margin:0 2px}

/* Touch */
#touch{position:absolute;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;padding:0 16px;pointer-events:none}
#touch .pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:6px;pointer-events:auto}
#touch button{background:rgba(217,210,195,.14);border:1px solid rgba(217,210,195,.35);font-size:22px;padding:0}
@media (pointer:coarse){#touch{display:flex}#act{bottom:calc(214px + env(safe-area-inset-bottom,0px))!important}#toast{bottom:auto;top:calc(136px + env(safe-area-inset-top,0px))}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

<script>
'use strict';
/* ====== DATA ====== */
const W=56,H=420,S=6;           // columns, rows, surface row (first solid row)
const T={AIR:0,DIRT:1,ROCK:2,BED:3,LAVA:4,GAS:5,ICE:6,LIE:7,DOOR:8,WATER:10,ORE:16};
const ORES=[
 {n:'Tin',v:12,a:6,b:60,w:6,c:'#b9bdc4'},
 {n:'Copper',v:25,a:10,b:95,w:6,c:'#d07a4a'},
 {n:'Iron',v:45,a:25,b:125,w:5,c:'#9a8a82'},
 {n:'Silver',v:90,a:45,b:165,w:4,c:'#e6eaf2'},
 {n:'Gold',v:180,a:70,b:215,w:4,c:'#f2c14e'},
 {n:'Emerald',v:360,a:110,b:265,w:3,c:'#3ddc97'},
 {n:'Ruby',v:620,a:150,b:305,w:3,c:'#e0324f'},
 {n:'Diamond',v:1100,a:200,b:365,w:3,c:'#9fe8ff'},
 {n:'Soulglass',v:2000,a:240,b:405,w:2,c:'#7af0e0'},
 {n:'Hellfire Opal',v:3200,a:250,b:405,w:2,c:'#ff7a3d'},
 {n:'Judas Silver',v:5200,a:320,b:412,w:2,c:'#c9a6ff'},
 {n:'Cocytus Pearl',v:9000,a:372,b:418,w:2,c:'#f4fbff'}
];
const CIRCLES=[
 {name:'The Surface',sub:'Terra',a:0,b:S,dirt:['#6b4a32','#5a3d29'],rock:['#7a7468','#615b52'],bg:['#1a1630','#5a3a52'],acc:'#d9d2c3',dark:0,sur:0},
 {name:'Limbo',sub:'the virtuous pagans',a:S,b:50,dirt:['#6c6152','#574e42'],rock:['#8a8f98','#6b7078'],bg:['#2a2833','#1c1a22'],acc:'#b8b2a0',dark:.05,sur:.05},
 {name:'Lust',sub:'the storm that never rests',a:50,b:95,dirt:['#6b3552','#542a43'],rock:['#8a4a78','#6e3a60'],bg:['#3a1433','#1d0b24'],acc:'#ff7ac6',dark:.15,sur:.2},
 {name:'Gluttony',sub:'the rain of filth',a:95,b:140,dirt:['#4b5a2b','#3c4922'],rock:['#6b7a3e','#56632f'],bg:['#1e2a12','#10190b'],acc:'#b6e04a',dark:.25,sur:.3},
 {name:'Greed',sub:'the weight of the purse',a:140,b:190,dirt:['#6a5321','#553f18'],rock:['#8c7030','#6e5826'],bg:['#2b2008','#140e04'],acc:'#ffd24a',dark:.35,sur:.4},
 {name:'Wrath',sub:'the Styx, the sullen',a:190,b:240,dirt:['#34482f','#2a3a26'],rock:['#4a5a52','#3a4842'],bg:['#0f2a24','#08150f'],acc:'#ff5a3a',dark:.45,sur:.55},
 {name:'Heresy',sub:'the burning tombs',a:240,b:285,dirt:['#6a2c1c','#54221a'],rock:['#8a4028','#6c321e'],bg:['#3a0f08','#1a0504'],acc:'#ff8a2a',dark:.55,sur:.68},
 {name:'Violence',sub:'the river of blood',a:285,b:335,dirt:['#5a1420','#44101a'],rock:['#7a1c2c','#5e1624'],bg:['#2a0508','#0f0204'],acc:'#ff2a4a',dark:.65,sur:.8},
 {name:'Fraud',sub:'the ten ditches',a:335,b:380,dirt:['#2a2a5a','#20204a'],rock:['#4a3a7a','#3a2c62'],bg:['#0a0a2a','#05051a'],acc:'#9a7aff',dark:.75,sur:.92},
 {name:'Treachery',sub:'the frozen lake',a:380,b:420,dirt:['#4a6a82','#3a566c'],rock:['#7aa0b8','#628aa2'],bg:['#0a1a26','#040a12'],acc:'#d8f4ff',dark:.85,sur:1}
];
function circleIdx(row){for(let i=CIRCLES.length-1;i>=0;i--)if(row>=CIRCLES[i].a)return i;return 0}
const FLIP_ZONE=[196,212];      // Wrath: gravity points up
const SWAP_ZONE=[364,378];      // Fraud: left and right trade places

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ====== WORLD GENERATION ====== */
function genWorld(seed){
 const rnd=mulberry32(seed),t=new Uint8Array(W*H),objs=[];
 const I=(x,y)=>y*W+x, inb=(x,y)=>x>0&&x<W-1&&y>=S&&y<H-1;
 const pickOre=y=>{
  let tot=0;const ws=ORES.map(o=>{
   if(y<o.a||y>o.b)return 0;
   const c=(o.a+o.b)/2,h=(o.b-o.a)/2+1;
   const w=o.w*(1-.55*Math.abs(y-c)/h);tot+=w;return w});
  let r=rnd()*tot;for(let i=0;i<ws.length;i++){r-=ws[i];if(r<=0)return i}return 0};
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  let v=T.AIR;
  if(y>=S){
   const d=y-S,ci=circleIdx(y);
   if(x===0||x===W-1||y===H-1)v=T.BED;
   else{
    v=rnd()<Math.min(.38,.04+d*.0009)?T.ROCK:T.DIRT;
    if(ci===9&&v===T.DIRT&&rnd()<.75)v=T.ICE;
    if(y>70&&rnd()<Math.min(.04,(y-70)*.00012))v=T.BED;
    else if(rnd()<.058)v=T.ORE+pickOre(y);
    else if(ci===8&&rnd()<.05)v=T.LIE;
   }
  }
  t[I(x,y)]=v;
 }
 const disc=(cx,cy,r,val)=>{for(let y=Math.floor(cy-r);y<=cy+r;y++)for(let x=Math.floor(cx-r);x<=cx+r;x++)
  if(inb(x,y)&&(x-cx)*(x-cx)+(y-cy)*(y-cy)<=r*r)t[I(x,y)]=val};
 // caves, gas, lava
 const nCaves=180;
 for(let i=0;i<nCaves;i++){
  const y=S+6+Math.floor(rnd()*(H-S-14)),x=2+Math.floor(rnd()*(W-4)),r=1.5+rnd()*2.6;
  disc(x,y,r,T.AIR);
  const gp=.06+Math.min(.26,(y-S)/1400);
  if(rnd()<gp)disc(x,y,r-.4,T.GAS);
  else if(y>190&&rnd()<.2+Math.min(.25,(y-190)/900))disc(x,y+r*.4,r*.8,T.LAVA);
 }
 const band=(y0,y1,val)=>{for(let y=y0;y<=y1;y++)for(let x=1;x<W-1;x++)t[I(x,y)]=val};
 band(214,219,T.WATER);          // the Styx
 band(312,314,T.LAVA);           // river of blood
 const room=(x0,y0,w,h,frame)=>{
  if(frame)for(let y=y0-1;y<=y0+h;y++)for(let x=x0-1;x<=x0+w;x++)t[I(x,y)]=T.BED;
  for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)t[I(x,y)]=T.AIR};
 const add=(k,id,x,y,data)=>{const o={k,id,x,y,taken:false,data:data||null};objs.push(o);return o};
 // surface buildings
 [['market',10],['workshop',19],['depot',28],['supply',37]].forEach(([id,x])=>add('bld',id,x,S));
 // breadcrumbs to the buried cache
 for(let y=9;y<=17;y++)t[I(1,y)]=T.ORE+1;
 room(2,18,4,3,false); add('chest','cache',3,20,{cash:600});
 // Virgil's camp
 room(24,45,8,4,false); add('camp','virgil',27,48); add('npc','virgil',29,48);
 // rusted key, behind a room full of gas
 room(W-7,62,5,3,false);
 for(let y=62;y<65;y++)for(let x=W-7;x<W-2;x++)t[I(x,y)]=T.GAS;
 add('chest','key',W-5,64,{key:true});
 // Charon's ferry
 room(20,92,13,4,false); add('shop','charon',26,95);
 // the maw
 room(30,118,11,5,false); add('maw','maw',35,122);
 // greed vault
 room(22,172,12,6,true); t[I(21,176)]=T.DOOR;
 add('chest','vault',28,177,{cash:32000,gild:true});
 // the lantern, across a lava pool
 room(44,296,8,4,true); t[I(43,298)]=T.AIR;
 for(let x=44;x<52;x++)t[I(x,299)]=T.LAVA;
 add('chest','lantern',48,298,{lantern:true});
 // the forger
 room(26,352,13,4,false); add('shop','forger',32,355);
 // lucifer's heart
 room(20,402,17,10,false); add('heart','heart',28,408);
 for(let x=21;x<36;x++)t[I(x,412)]=T.ICE;
 // buried crates
 for(let i=0;i<34;i++){
  const y=S+10+Math.floor(rnd()*(H-S-40)),x=2+Math.floor(rnd()*(W-4));
  if(t[I(x,y)]===T.BED)continue;
  if(objs.some(o=>o.k!=='bld'&&Math.abs(o.x-x)<10&&Math.abs(o.y-y)<6))continue;
  t[I(x,y)]=T.AIR;t[I(x,y-1)]=T.AIR;
  add('chest','crate',x,y,{cash:Math.round((30+y*2)*(1+rnd()*2)),item:rnd()<.3?['dyn','rep','tele','fuel'][Math.floor(rnd()*4)]:null});
 }
 return {t,objs};
}
/* ====== STATE ====== */
const UP={
 drill:{n:'Drill bit',d:'Bites through earth faster.',lv:[[0,1],[150,1.5],[600,2.1],[2000,3],[8000,4.2],[30000,6]]},
 hull:{n:'Hull plating',d:'More punishment before the pod comes apart.',lv:[[0,100],[200,160],[800,250],[3000,400],[12000,650],[40000,1000]]},
 tank:{n:'Fuel tank',d:'Dig longer between refuels.',lv:[[0,20],[100,34],[450,55],[1800,90],[7000,140],[25000,220]]},
 cargo:{n:'Cargo bay',d:'Haul more ore per trip.',lv:[[0,8],[120,14],[500,24],[2200,40],[9000,65],[30000,100]]},
 engine:{n:'Thrusters',d:'Flight speed and lift.',lv:[[0,1],[250,1.2],[900,1.45],[3500,1.75],[14000,2.1],[45000,2.6]]},
 cool:{n:'Radiator',d:'Shrugs off lava and gas.',lv:[[0,0],[400,.25],[1500,.45],[6000,.65],[20000,.82],[60000,.92]]},
 lamp:{n:'Floodlamp',d:'Pushes the dark back further.',lv:[[0,1],[300,1.25],[1200,1.6],[5000,2],[18000,2.6]]},
 scan:{n:'Ore scanner',d:'Makes ore glint through solid rock.',lv:[[0,0],[700,2],[3000,3.5],[11000,5],[35000,7]]}
};
const UPV=id=>UP[id].lv[G.up[id]][1];
const ITEMS={dyn:{n:'Dynamite',k:'1',cost:120,d:'Blasts a 5x5 hole. Bedrock stays.',g:'✸'},
 rep:{n:'Repair nanites',k:'2',cost:150,d:'Restores half your hull.',g:'+'},
 fuel:{n:'Fuel canister',k:'3',cost:90,d:'Adds a third of a tank.',g:'◍'},
 tele:{n:'Teleporter',k:'4',cost:250,d:'Returns you to the surface with your cargo.',g:'◎'}};
const ITEM_IDS=['dyn','rep','fuel','tele'];
const LORE=['','No torment here. Just the long, patient absence of a reason.','The walls are warm. Something is always just behind you.','Mud, rot, and a rain with no sky to fall from. Your cargo feels heavier.','Every vein glitters. Every vein is someone’s.','The Styx. The dark water remembers how angry it was.','The stones are tombs. Some of them are still open.','A red river and thorned trees. The earth is bleeding on purpose.','Nothing here is what it looks like. Not even the floor.','It is very quiet. The cold is the last thing that loves you.'];

let seed=0,tiles=null,objs=null;
let G=null;
const P={x:23.5,y:S-.4,vx:0,vy:0,w:.78,h:.78,face:1,tgt:null,prog:0,onGround:false,gdir:1,drilling:false,bump:0,shake:0};
const K={left:false,right:false,up:false,down:false};
const parts=[],pops=[];
let hintBed=false,started=false,paused=false,muted=false;

function freshG(){return{up:{drill:0,hull:0,tank:0,cargo:0,engine:0,cool:0,lamp:0,scan:0},cash:0,cargo:ORES.map(()=>0),junk:0,
 items:{dyn:0,rep:0,fuel:0,tele:0},flags:{},hull:100,fuel:20,maxRow:S,maxCircle:0,deaths:0,time:0,mult:ORES.map(()=>1),
 circle:0,faust:0,moon:0,talk:0,mawFed:0,sold:0}}
const cargoUsed=()=>G.cargo.reduce((a,b)=>a+b,0)+G.junk;
const depthM=y=>Math.max(0,Math.round((y-S)*5));

function newGame(){
 seed=(Math.random()*4e9)>>>0;const w=genWorld(seed);tiles=w.t;objs=w.objs;
 G=freshG();G.hull=maxHull();G.fuel=UPV('tank');
 Object.assign(P,{x:23.5,y:S-.4,vx:0,vy:0,tgt:null,prog:0});
 parts.length=0;
}
const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s)};
const unb64=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
function save(){try{localStorage.setItem('ncd1',JSON.stringify({seed,t:b64(tiles),taken:objs.map(o=>o.taken?1:0),G,P:{x:P.x,y:P.y}}))}catch(e){}}
function load(){try{
 const s=localStorage.getItem('ncd1');if(!s)return false;const d=JSON.parse(s);
 const w=genWorld(d.seed);seed=d.seed;objs=w.objs;tiles=unb64(d.t);
 if(tiles.length!==W*H)return false;
 d.taken.forEach((v,i)=>{if(objs[i])objs[i].taken=!!v});
 G=Object.assign(freshG(),d.G);Object.assign(P,{x:d.P.x,y:d.P.y,vx:0,vy:0,tgt:null,prog:0});return true
}catch(e){return false}}
const hasSave=()=>{try{return !!localStorage.getItem('ncd1')}catch(e){return false}};

/* ====== TILES ====== */
const tileAt=(x,y)=>x<0||x>=W||y>=H?T.BED:y<0?T.AIR:tiles[y*W+x];
const isSolid=v=>v===T.DIRT||v===T.ROCK||v===T.BED||v===T.ICE||v===T.LIE||v===T.DOOR||v>=T.ORE;
const hardness=v=>v===T.DIRT?.45:v===T.ROCK?1.15:v===T.ICE?1.3:v===T.LIE?.6:v>=T.ORE?.55+(v-T.ORE)*.05:1;
function collides(x,y){
 const e=.001,x0=Math.floor(x-P.w/2+e),x1=Math.floor(x+P.w/2-e),y0=Math.floor(y-P.h/2+e),y1=Math.floor(y+P.h/2-e);
 for(let j=y0;j<=y1;j++)for(let i=x0;i<=x1;i++)if(isSolid(tileAt(i,j)))return true;return false}
function hazardAt(){
 let gas=0,lava=0,water=false;const hw=P.w/2-.05,hh=P.h/2-.05;
 for(const [dx,dy] of [[0,0],[-hw,-hh],[hw,-hh],[-hw,hh],[hw,hh]]){
  const v=tileAt(Math.floor(P.x+dx),Math.floor(P.y+dy));
  if(v===T.GAS)gas=1;else if(v===T.LAVA)lava=1;else if(v===T.WATER)water=true}
 return{gas,lava,water}}

/* ====== PLAY ====== */
function addOre(i){
 if(cargoUsed()>=UPV('cargo')){pop('Cargo full',P.x,P.y-.6,'#ff6a6a');sfx('full');return false}
 G.cargo[i]++;pop('+'+ORES[i].n,P.x,P.y-.6,ORES[i].c);sfx('ore');return true}
function spark(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(.3+Math.random())*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:.5+Math.random()*.6,c})}}
function pop(t,x,y,c){pops.push({t,x,y,c,life:1.4})}
function breakTile(tx,ty){
 const v=tileAt(tx,ty);if(v===T.BED||v===T.AIR)return;
 tiles[ty*W+tx]=T.AIR;
 if(v>=T.ORE){addOre(v-T.ORE);spark(tx+.5,ty+.5,ORES[v-T.ORE].c,10,4)}
 else if(v===T.LIE){
  const r=Math.random();
  if(r<.16){const i=6+Math.floor(Math.random()*4);G.cargo[i]=Math.min(G.cargo[i]+1,999);pop('It was real: +'+ORES[i].n,P.x,P.y-.6,ORES[i].c);sfx('ore')}
  else if(r<.36){hurt(14,'a lie with teeth');pop('It bites',P.x,P.y-.6,'#ff6a6a');spark(tx+.5,ty+.5,'#ff6a6a',14,5)}
  else if(G.junk+cargoUsed()<UPV('cargo')){G.junk++;pop('+Fool’s gold',P.x,P.y-.6,'#888');sfx('junk')}
 }else{spark(tx+.5,ty+.5,CIRCLES[circleIdx(ty)].dirt[0],4,3)}
 sfx('dig');
}
function hurt(d,why){
 if(G.hull<=0)return;G.hull-=d;P.shake=Math.min(.6,.12+d*.02);sfx('hit');
 if(G.hull<=0){G.hull=0;die(why)}}
function die(why){
 G.deaths++;const lost=Math.floor(G.cash*.4);G.cash-=lost;G.cargo.fill(0);G.junk=0;
 spark(P.x,P.y,'#ffb347',40,7);sfx('boom');
 Object.assign(P,{x:23.5,y:S-.4,vx:0,vy:0,tgt:null,prog:0});
 G.hull=maxHull();G.fuel=UPV('tank');
 toast('The pod was lost ('+why+'). The Company bills you $'+lost+' and sends a new one.',6000);
 save()}
function rescue(){
 const fee=Math.floor(G.cash*.2);G.cash-=fee;Object.assign(P,{x:23.5,y:S-.4,vx:0,vy:0,tgt:null,prog:0});
 G.fuel=Math.max(G.fuel,3);toast('Towed home. Rescue fee $'+fee+'.',4500);save()}

function update(dt){
 G.time+=dt;
 const ci=circleIdx(Math.floor(P.y));
 if(ci!==G.circle){G.circle=ci;
  if(ci>G.maxCircle){G.maxCircle=ci;if(ci>0)toast(CIRCLES[ci].name+'. '+LORE[ci],6500);sfx('circle')}}
 G.maxRow=Math.max(G.maxRow,Math.floor(P.y));
 if(G.time%45<dt)G.mult=G.mult.map(m=>Math.max(.75,Math.min(1.3,m+(Math.random()-.5)*.25)));
 const gd=(P.y>FLIP_ZONE[0]&&P.y<FLIP_ZONE[1])?-1:1;P.gdir=gd;
 const swap=P.y>SWAP_ZONE[0]&&P.y<SWAP_ZONE[1];
 let ix=(K.right?1:0)-(K.left?1:0);if(swap)ix=-ix;
 const eng=UPV('engine'),drillS=UPV('drill')*(G.flags.gild?1.35:1),surf=P.y<S;
 const hz=hazardAt(),ok=G.fuel>0||surf;
 let use=surf?0:.012;
 if(ix)P.face=ix;
 const vmax=7*Math.sqrt(eng);
 if(ok){P.vx+=(ix*vmax-P.vx)*Math.min(1,9*dt);if(ix&&!surf)use+=.03}
 else P.vx*=Math.exp(-6*dt);
 let grav=26*(hz.water?.25:1);
 P.vy+=gd*grav*dt;
 if(K.up&&ok){P.vy+=-gd*(52+10*eng)*dt;if(!surf)use+=.17;if(Math.random()<.5)parts.push({x:P.x,y:P.y+gd*.4,vx:(Math.random()-.5)*1.5,vy:gd*(2+Math.random()*2),life:.35,c:'#ffb347'});sfx('thrust')}
 if(hz.water){P.vx*=Math.exp(-2.2*dt);P.vy*=Math.exp(-2.2*dt)}
 const vt=P.vy*gd;if(vt>16)P.vy=16*gd;if(-vt>vmax)P.vy=-vmax*gd;
 // move X
 const steps=Math.max(1,Math.ceil((Math.abs(P.vx)+Math.abs(P.vy))*dt/.25)),sdt=dt/steps;
 let blockX=0,blockY=0,impact=0;P.onGround=false;
 for(let s=0;s<steps;s++){
  let nx=P.x+P.vx*sdt;
  if(collides(nx,P.y)){const r=P.vx>0;nx=r?Math.floor(P.x+P.vx*sdt+P.w/2)-P.w/2-.001:Math.floor(P.x+P.vx*sdt-P.w/2)+1+P.w/2+.001;
   if(collides(nx,P.y))nx=P.x;blockX=r?1:-1;P.vx=0}
  P.x=nx;
  let ny=P.y+P.vy*sdt;
  if(collides(P.x,ny)){const d=P.vy>0;ny=d?Math.floor(P.y+P.vy*sdt+P.h/2)-P.h/2-.001:Math.floor(P.y+P.vy*sdt-P.h/2)+1+P.h/2+.001;
   if(collides(P.x,ny))ny=P.y;blockY=d?1:-1;if(blockY===gd){impact=Math.max(impact,Math.abs(P.vy));P.onGround=true}P.vy=0}
  P.y=ny;
 }
 if(P.x<.5)P.x=.5;if(P.x>W-.5)P.x=W-.5;if(P.y<.5){P.y=.5;P.vy=Math.max(0,P.vy)}
 if(impact>13&&!surf){hurt((impact-13)*5,'hard landing')}
 // contact probes: independent of how far the pod moved this step
 P.onGround=collides(P.x,P.y+gd*.04);
 const wall=ix&&collides(P.x+ix*.04,P.y);
 // drilling
 let tgt=null;
 if(ok){
  if(K.down&&P.onGround){tgt=[Math.floor(P.x),Math.floor(P.y+gd*(P.h/2+.12))];
   // slide toward the column centre so the pod fits the shaft it digs
   P.x+=(Math.floor(P.x)+.5-P.x)*Math.min(1,10*dt)}
  else if(wall){tgt=[Math.floor(P.x+ix*(P.w/2+.12)),Math.floor(P.y)];P.y+=(Math.floor(P.y)+.5-P.y)*Math.min(1,10*dt)}
 }
 P.drilling=false;
 if(tgt&&!isSolid(tileAt(tgt[0],tgt[1]))&&tileAt(tgt[0],tgt[1])!==T.BED){
  // the probe hit a neighbouring column; drill the one actually underneath the pod's edge
  const alt=K.down?[Math.floor(P.x+(P.x%1<.5?-.3:.3)),tgt[1]]:[tgt[0],Math.floor(P.y+(P.y%1<.5?-.3:.3))];
  if(isSolid(tileAt(alt[0],alt[1])))tgt=alt}
 if(tgt){
  const v=tileAt(tgt[0],tgt[1]);
  if(v===T.BED){if(!hintBed){hintBed=true;toast('Bedrock. Go around.',2500)}sfx('clink');tgt=null}
  else if(v===T.DOOR&&!G.flags.key){toast('A vault door. It wants a key.',2600);tgt=null}
  else if(v===T.DOOR){tiles[tgt[1]*W+tgt[0]]=T.AIR;toast('The rusted key turns. The door gives.',3500);sfx('unlock');tgt=null}
  else if(isSolid(v)){
   if(!P.tgt||P.tgt[0]!==tgt[0]||P.tgt[1]!==tgt[1]){P.tgt=tgt;P.prog=0}
   P.prog+=dt*drillS/hardness(v);P.drilling=true;use+=.13;
   if(Math.random()<.4)spark(tgt[0]+.5,tgt[1]+.5,CIRCLES[circleIdx(tgt[1])].dirt[0],1,3);
   sfx('drill');
   if(P.prog>=1){breakTile(tgt[0],tgt[1]);P.tgt=null;P.prog=0}
  }else{P.tgt=null;P.prog=0}
 }else{P.prog=Math.max(0,P.prog-dt*2);if(!P.prog)P.tgt=null}
 G.fuel=Math.max(0,G.fuel-use*dt);
 // hazards
 const res=UPV('cool');
 if(hz.lava){hurt(16*(1-res)*dt+.01,'lava');P.burn=.3}
 if(hz.gas){hurt(6*(1-res)*dt+.005,'poison gas')}
 P.burn=Math.max(0,P.burn-dt);
 if(P.shake>0)P.shake=Math.max(0,P.shake-dt);
 // sell at surface? no. low fuel hint
 if(G.fuel<=0&&!surf&&!G.flags.fuelHint){G.flags.fuelHint=true;toast('Out of fuel. Use a canister (3), or press K to be towed home for 20% of your cash.',7000)}
 if(G.fuel>0)G.flags.fuelHint=false;
 // chests
 for(const o of objs){
  if(o.k==='chest'&&!o.taken&&Math.abs(o.x+.5-P.x)<1.1&&Math.abs(o.y+.5-P.y)<1.1)openChest(o);
  if(o.k==='heart'&&!o.taken&&Math.abs(o.x+.5-P.x)<1.6&&Math.abs(o.y+.5-P.y)<1.8)touchHeart(o)}
 // particles
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.vy+=10*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)parts.splice(i,1)}
 for(let i=pops.length-1;i>=0;i--){pops[i].life-=dt;pops[i].y-=dt*.7;if(pops[i].life<=0)pops.splice(i,1)}
}

/* ====== OBJECTS ====== */
function openChest(o){
 o.taken=true;sfx('chest');const d=o.data;let msg='';
 if(d.cash){G.cash+=d.cash;msg='Found $'+d.cash+'.'}
 if(d.item){G.items[d.item]++;msg+=' And a '+ITEMS[d.item].n.toLowerCase()+'.'}
 if(d.key){G.flags.key=true;msg='A rusted key, warm to the touch. Somewhere below, something is locked.'}
 if(d.gild){G.flags.gild=true;msg+=' Under the coins: a gilded drill head. You bolt it on. (+35% drilling speed)'}
 if(d.lantern){G.flags.lantern=true;msg='Beatrice’s lantern. The dark steps back a little, as if embarrassed.'}
 if(o.id==='cache')msg='Someone buried this on purpose. $600, and a note: “You dug sideways. Good.”';
 toast(msg.trim(),6000);spark(o.x+.5,o.y+.5,'#ffd24a',20,5);save()}
function nearest(){
 let best=null,bd=1e9;
 for(const o of objs){
  let ok=false,d=0;
  if(o.k==='bld'){const cx=o.x+2.5;d=Math.abs(P.x-cx);ok=d<2.4&&P.y<S+.3}
  else if(o.k==='camp'||o.k==='npc'||o.k==='shop'||o.k==='maw'){const dx=P.x-(o.x+.5),dy=P.y-(o.y+.5);d=Math.hypot(dx,dy);ok=d<2.2}
  if(ok&&d<bd){bd=d;best=o}}
 return best}
const BLD_NAME={market:'Ore Exchange',workshop:'Workshop',depot:'Fuel and Repair',supply:'General Supply'};
function interactLabel(o){
 if(o.k==='bld')return 'Enter '+BLD_NAME[o.id];
 if(o.k==='camp')return 'Warm yourself at the fire';
 if(o.k==='npc')return 'Speak with the stranger';
 if(o.k==='shop')return o.id==='charon'?'Approach the Ferryman':'Approach the Forger';
 if(o.k==='maw')return 'Feed the Maw';return ''}
function touchHeart(o){
 o.taken=true;sfx('heart');G.flags.won=true;save();showEnding()}
function useItem(id){
 if(!started||paused||!G.items[id])return;
 if(id==='dyn'){
  G.items.dyn--;const cx=Math.floor(P.x),cy=Math.floor(P.y);
  for(let y=cy-2;y<=cy+2;y++)for(let x=cx-2;x<=cx+2;x++){
   const v=tileAt(x,y);if(v===T.BED||v===T.AIR||x<1||x>=W-1||y<0)continue;
   if(v===T.DOOR)continue;
   if(v>=T.ORE)addOre(v-T.ORE);tiles[y*W+x]=T.AIR;spark(x+.5,y+.5,'#ffb347',2,5)}
  P.shake=.5;sfx('boom')}
 else if(id==='rep'){G.items.rep--;G.hull=Math.min(maxHull(),G.hull+maxHull()*.5);sfx('heal');pop('Repaired',P.x,P.y-.6,'#6fd6c5')}
 else if(id==='fuel'){G.items.fuel--;G.fuel=Math.min(UPV('tank'),G.fuel+UPV('tank')/3);sfx('heal');pop('Refueled',P.x,P.y-.6,'#6fd6c5')}
 else if(id==='tele'){G.items.tele--;spark(P.x,P.y,'#6fd6c5',30,6);Object.assign(P,{x:23.5,y:S-.4,vx:0,vy:0,tgt:null,prog:0});sfx('tele');toast('The shaft lets go of you.',2500);save()}
 renderItems()}
/* ====== UI ====== */
const $=id=>document.getElementById(id);
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const maxHull=()=>UP.hull.lv[G.up.hull][1]*(1-.15*G.faust);
let toastT=0,curPanel=null,lastHud={};
function toast(m,ms){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),ms||4200)}
function setText(id,v){if(lastHud[id]!==v){lastHud[id]=v;$(id).textContent=v}}
function bar(id,f,label){const b=$(id);const w=Math.max(0,Math.min(1,f))*100+'%';if(lastHud[id]!==w+label){lastHud[id]=w+label;b.firstElementChild.style.width=w;b.lastElementChild.textContent=label}}

function openModal(html){$('panel').innerHTML=html;$('modal').hidden=false;paused=true;sfx('ui');$('act').hidden=true}

const head=(t,s)=>`<h2>${t}</h2><p class="sub">${s}</p>`;

function sellRows(f){
 let rows='',tot=0;
 ORES.forEach((o,i)=>{const c=G.cargo[i];if(!c)return;const p=Math.round(o.v*G.mult[i]*f);tot+=p*c;
  const m=G.mult[i],tr=m>1.08?'Price is up today.':m<.92?'Price is down today.':'Steady.';

 if(G.junk)rows+=`<div class="row"><h3>Fool’s gold ×${G.junk}<span class="lvl">$0</span></h3><p>Worth nothing. Take it out of the hold.</p><button class="buy" data-a="junk">Dump</button></div>`;
 if(!rows)rows='<div class="row"><h3>Your hold is empty</h3><p>Dig something up first.</p></div>';

function openBuilding(id,tab){

 if(id==='market'){

  openModal(head('Ore Exchange','The Company buys by weight and by mood. Prices drift through the day.')+`<div class="rows">${rows}</div>`+(tot?`<p class="total">Everything in the hold: ${money(tot)}</p>`:'')+`<div class="actions">${tot?'<button class="btn" data-a="sellall:1">Sell all</button>':''}<button class="btn ghost" data-a="close">Leave</button></div>`)}
 else if(id==='workshop'){
  const U={drill:v=>v+'×',hull:v=>Math.round(v*(1-.15*G.faust))+' hp',tank:v=>v+' units',cargo:v=>v+' slots',engine:v=>v+'×',cool:v=>Math.round(v*100)+'%',lamp:v=>v+'×',scan:v=>v?v+' tiles':'off'};
  const rows=Object.keys(UP).map(k=>{const u=UP[k],lv=G.up[k],mx=u.lv.length-1,now=u.lv[lv][1];

   const nx=u.lv[lv+1];return `<div class="row"><h3>${u.n}<span class="lvl">Lv ${lv+1}/${mx+1}</span></h3><p>${u.d} ${U[k](now)} → ${U[k](nx[1])}</p><button class="buy" data-a="up:${k}" ${G.cash<nx[0]?'disabled':''}>${money(nx[0])}</button></div>`}).join('');
  openModal(head('Workshop','Bolt it on, weld it down, go lower.')+`<div class="rows">${rows}</div>`+leave())}
 else if(id==='depot'){
  const mf=UPV('tank')-G.fuel,mh=maxHull()-G.hull,cf=Math.ceil(mf*2),ch=Math.ceil(mh);
  openModal(head('Fuel and Repair','Two dollars a unit. One dollar a point of hull. No haggling.')+`<div class="rows">
   <div class="row"><h3>Fill the tank<span class="lvl">${G.fuel.toFixed(1)}/${UPV('tank')}</span></h3><p>${mf>0.05?'Tops up what you are missing, or as much as you can afford.':'Already full.'}</p><button class="buy" data-a="fuel" ${mf>0.05&&G.cash>=1?'':'disabled'}>${money(cf)}</button></div>
   <div class="row"><h3>Repair the hull<span class="lvl">${Math.ceil(G.hull)}/${Math.round(maxHull())}</span></h3><p>${mh>0.5?'Patches the pod back to spec.':'Nothing to fix.'}</p><button class="buy" data-a="repair" ${mh>0.5&&G.cash>=1?'':'disabled'}>${money(ch)}</button></div></div>`+leave())}
 else if(id==='supply'){
  const rows=ITEM_IDS.map(k=>{const it=ITEMS[k];return `<div class="row"><h3>${it.n}<span class="lvl">${G.items[k]} owned · key ${it.k}</span></h3><p>${it.d}</p><button class="buy" data-a="item:${k}:${it.cost}" ${G.cash<it.cost?'disabled':''}>${money(it.cost)}</button></div>`}).join('');
  openModal(head('General Supply','Anything that goes bang, heals, or gets you home.')+`<div class="rows">${rows}</div>`+leave())}
}
function openShop(id,tab){
 tab=tab||(id==='charon'?'sell':'wares');curPanel=['s',id,tab];
 if(id==='charon'){
  const t=tabs([['sell','Sell gems'],['pass','Passage']],tab,'charon');
  if(tab==='sell'){const {rows,tot}=sellRows(1.35);
   openModal(head('The Ferryman','He takes payment in whatever shines. He pays a third above the Exchange, and does not explain why.')+t+`<div class="rows">${rows}</div>`+`<div class="actions">${tot?'<button class="btn" data-a="sellall:1.35">Sell all</button>':''}<button class="btn ghost" data-a="close">Leave</button></div>`)}

 else if(e.key>='1'&&e.key<='4')useItem(ITEM_IDS[+e.key-1]);
 else if(e.key==='m'||e.key==='M'){muted=!muted;if(master)master.gain.value=muted?0:.5;toast(muted?'Sound off.':'Sound on.',1200)}
 else if(e.key==='k'||e.key==='K'){if(!paused&&G.fuel<=0&&P.y>=S)rescue()}
});
addEventListener('keyup',e=>{const k=KEYMAP[e.key];if(k)K[k]=false});
addEventListener('blur',()=>{K.left=K.right=K.up=K.down=false});
document.querySelectorAll('#touch button').forEach(b=>{
 const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();if(!paused)K[k]=true});
 const off=()=>{K[k]=false};
 b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off)});
$('items').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)useItem(b.dataset.i)});
$('panel').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)panelAction(b.dataset.a)});
// hold the mouse or a finger on the screen to steer and dig toward that point
let ptr=null;
function ptrKeys(){
 if(!ptr||paused){return}
 const wx=(ptr.x-OX)/TS,wy=(ptr.y-OY)/TS,dx=wx-P.x,dy=wy-P.y;
 K.left=dx<-.7&&Math.abs(dx)>=Math.abs(dy)*.5;K.right=dx>.7&&Math.abs(dx)>=Math.abs(dy)*.5;
 K.down=dy*P.gdir>.6&&Math.abs(dy)>Math.abs(dx);K.up=dy*P.gdir<-.6;
}
cv.addEventListener('pointerdown',e=>{
 audioInit();if(!started||paused)return;
 const wx=(e.clientX-OX)/TS,wy=(e.clientY-OY)/TS;
 if(P.y<S+4&&Math.hypot(wx-46,wy-1.8)<1.1){
  const n=G.moon++;
  if(n===0){G.cash+=25;toast('A silver coin drops out of the moon. You catch it on your tongue. +$25',4500)}
  else if(n===1){G.cash+=50;toast('Again? Fine. +$50',3500)}
  else if(n===2){G.cash+=250;toast('The moon is out of change. +$250, and it would like you to stop.',5000)}
  else toast('The moon ignores you.',2500);
  sfx('cash');return}
 ptr={x:e.clientX,y:e.clientY,id:e.pointerId};try{cv.setPointerCapture(e.pointerId)}catch(_){}
 ptrKeys()});
cv.addEventListener('pointermove',e=>{if(ptr&&e.pointerId===ptr.id){ptr.x=e.clientX;ptr.y=e.clientY}});
const ptrEnd=e=>{if(ptr&&e.pointerId===ptr.id){ptr=null;K.left=K.right=K.up=K.down=false}};
cv.addEventListener('pointerup',ptrEnd);cv.addEventListener('pointercancel',ptrEnd);

let last=0,acc=0,saveT=0,zFlip=false,zSwap=false;
const STEP=1/60;
function frame(ms){
 const t=ms/1000,dt=Math.min(.1,Math.max(0,t-last)||STEP);last=t;
 try{
 if(started){
  if(!paused){
   ptrKeys();
   acc+=dt;let n=0;
   while(acc>=STEP&&n<6){update(STEP);acc-=STEP;n++}
   if(n>=6)acc=0;
   audioTick();
   const fl=P.gdir<0,sw=P.y>SWAP_ZONE[0]&&P.y<SWAP_ZONE[1];
   if(fl&&!zFlip)toast('Down is up here. The keys follow the pod.',4500);
   if(sw&&!zSwap)toast('Left is right. Right is something else.',4500);
   zFlip=fl;zSwap=sw;
   if(G.hull<maxHull()*.25&&Math.random()<.2)parts.push({x:P.x,y:P.y-.3,vx:(Math.random()-.5),vy:-1.5,life:.7,c:'#555'});
   saveT+=dt;if(saveT>15){saveT=0;save()}
  }else audioTick();
  updateHUD();
 }
 render(t,dt);
 }catch(err){console.error(err)}
 requestAnimationFrame(frame)}

function begin(loadSave){
 audioInit();if(AC&&AC.state==='suspended')AC.resume();
 if(loadSave){if(!load())newGame()}else newGame();
 lastHud={};started=true;paused=false;$('title').hidden=true;zFlip=false;zSwap=false;
 renderItems();cam.x=P.x;cam.y=P.y;
 if(!loadSave)toast('The Exchange, Workshop, Fuel depot and Supply are on the surface. Fly to a door and press E.',7000);
 else toast('Back in the pod. The shaft kept your place.',3500);
}
$('startBtn').addEventListener('click',()=>begin(false));
$('contBtn').addEventListener('click',()=>begin(true));
$('wipeBtn').addEventListener('click',()=>begin(false));
if(hasSave()){$('startBtn').hidden=true;$('contBtn').hidden=false;$('wipeBtn').hidden=false}
addEventListener('resize',resize);
resize();newGame();
cam.x=P.x;cam.y=S-3;
requestAnimationFrame(frame);
</script>
