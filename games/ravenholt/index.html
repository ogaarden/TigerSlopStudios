<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ravenholt — Until Dawn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
:root{
  --wax:#d9cdb4; --wax-dim:#8e8473; --blood:#7a1418; --blood-hi:#b3262b; --brass:#a8864a; --soot:#000; --bruise:#2a1f2e;
  --serif:'IM Fell English', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
  --sc:'IM Fell English SC', 'IM Fell English', Georgia, serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --wax:#d9cdb4; --soot:#000; } }
:root[data-theme="dark"]{ --wax:#d9cdb4; --soot:#000; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--soot);color:var(--wax);font-family:var(--serif);-webkit-user-select:none;user-select:none}
#game canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 42%,rgba(0,0,0,.55) 75%,rgba(0,0,0,.92) 100%)}
#grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.10;mix-blend-mode:screen;image-rendering:pixelated}
#slats{position:fixed;inset:0;pointer-events:none;display:none;
  background:repeating-linear-gradient(to bottom,rgba(10,6,3,.97) 0,rgba(10,6,3,.97) 30px,rgba(0,0,0,0) 30px,rgba(0,0,0,0) 38px);
  box-shadow:inset 0 0 220px 90px #000}
#deskov{position:fixed;inset:0;pointer-events:none;display:none;
  background:linear-gradient(to bottom,rgba(12,7,4,.98) 0%,rgba(12,7,4,.93) 22%,rgba(0,0,0,0) 38%);box-shadow:inset 0 0 200px 70px #000}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0}
#fade{position:fixed;inset:0;background:#000;pointer-events:none;opacity:1;transition:opacity .6s ease}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#clock{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);
  font-family:var(--sc);font-size:52px;line-height:1;letter-spacing:.06em;color:var(--wax);
  text-shadow:0 0 18px rgba(179,38,43,.7),0 0 3px #000;font-variant-numeric:tabular-nums}
#clock small{font-size:20px;margin-left:8px;color:var(--wax-dim)}
#floorLbl{position:absolute;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-style:italic;font-size:15px;color:var(--wax-dim);white-space:nowrap}
#tl{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:22px;width:210px}
#lives{font-size:28px;color:var(--blood-hi);letter-spacing:6px;text-shadow:0 0 10px #000}
.bar{height:6px;background:rgba(217,205,180,.08);border:1px solid rgba(217,205,180,.22);margin-top:5px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--blood-hi)}
.lbl{font-style:italic;font-size:14px;color:var(--wax-dim);margin-top:9px;display:flex;justify-content:space-between}
#bl{position:absolute;left:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:210px}
#batBar{background:var(--brass)} #stBar{background:#8a8070} #noiseBar{background:var(--wax)}
#buffs{position:absolute;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));text-align:right;font-size:16px;line-height:1.5}
#buffs .b{color:var(--wax)} #buffs .b span{color:var(--wax-dim);font-style:italic}
#prompt{position:absolute;left:50%;top:62%;transform:translateX(-50%);font-size:18px;padding:5px 16px;background:rgba(0,0,0,.6);border-bottom:1px solid var(--brass);display:none;white-space:nowrap}
#prompt kbd{font-family:var(--sc);color:var(--brass);margin-right:6px}
#state{position:absolute;left:50%;top:68%;transform:translateX(-50%);font-style:italic;font-size:16px;color:var(--brass);display:none}
#subs{position:absolute;left:50%;bottom:15%;transform:translateX(-50%);text-align:center;font-size:17px;max-width:80vw;display:flex;flex-direction:column;align-items:center;gap:4px}
#subs div{background:rgba(0,0,0,.62);padding:2px 12px;font-style:italic;transition:opacity .6s}
#subs .out{opacity:0}
#msg{position:absolute;left:50%;top:28%;transform:translateX(-50%);font-size:21px;text-align:center;opacity:0;transition:opacity .5s;text-shadow:0 0 8px #000,0 0 2px #000;max-width:80vw}
#big{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--sc);font-size:clamp(60px,11vw,130px);color:var(--wax);opacity:0;transition:opacity .8s;text-shadow:0 0 40px rgba(179,38,43,.85);white-space:nowrap}
#hint{position:absolute;right:22px;top:calc(18px + env(safe-area-inset-top,0px));width:310px;background:rgba(8,5,6,.86);border-left:2px solid var(--blood-hi);padding:12px 16px 14px;font-size:15px;line-height:1.5;opacity:0;transition:opacity .6s}
#hint b{font-family:var(--sc);font-size:23px;font-weight:normal;display:block;color:#e8c99a;margin-bottom:4px}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(217,205,180,.45)}
#spirit{position:absolute;left:50%;top:calc(96px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-style:italic;color:#ff8a5a;font-size:15px;display:none}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;overflow:auto;
  background:radial-gradient(ellipse at 50% 35%,rgba(70,10,14,.45),rgba(0,0,0,.96) 70%)}
.panel{max-width:720px;width:calc(100% - 40px);padding:34px 8px;margin:auto;text-align:center}
.panel h1{font-family:var(--sc);font-weight:normal;font-size:clamp(54px,10vw,112px);margin:0;line-height:.95;letter-spacing:.04em;color:#e9dcc2;text-shadow:0 0 40px rgba(150,12,16,.85)}
.panel .tag{font-style:italic;font-size:21px;color:var(--wax-dim);margin:10px 0 22px}
.panel p{font-size:17px;line-height:1.55;max-width:60ch;margin:0 auto 14px}
.ctl{display:grid;grid-template-columns:max-content 1fr;gap:5px 18px;text-align:left;max-width:440px;margin:18px auto 24px;font-size:16px}
.ctl kbd{font-family:var(--sc);color:var(--brass);text-align:right}
.btn{pointer-events:auto;font-family:var(--sc);font-size:24px;padding:10px 34px;background:transparent;color:var(--wax);border:1px solid rgba(217,205,180,.45);cursor:pointer;letter-spacing:.04em;margin:6px}
.btn:hover{background:rgba(122,20,24,.45);border-color:var(--blood-hi)}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.small{font-style:italic;font-size:15px;color:var(--wax-dim)}
.set{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;margin:16px 0;font-size:16px}
.set input[type=range]{accent-color:var(--blood-hi);width:140px}
.best{text-align:left;max-width:620px;margin:20px auto 0;max-height:38vh;overflow:auto;padding-right:8px}
.best div{margin-bottom:12px;font-size:15px;line-height:1.5}
.best b{font-family:var(--sc);font-weight:normal;font-size:20px;color:#e8c99a;display:block}
.stats{font-size:19px;margin:14px 0 22px;line-height:1.7}
@media (prefers-reduced-motion: reduce){ #fade,#msg,#big,#hint,#subs div{transition:none} }
@media (max-width:640px){ #clock{font-size:38px} #hint{width:220px;font-size:13px} #tl,#bl{width:150px} }
</style>
</head>
<body>
<div id="game"></div>
<div id="vig"></div>
<canvas id="grain" width="200" height="120"></canvas>
<div id="slats"></div>
<div id="deskov"></div>
<div id="hud">
  <div id="clock">00:00<small>am</small></div>
  <div id="floorLbl">Ground floor</div>
  <div id="spirit"></div>
  <div id="tl">
    <div id="lives"></div>
    <div class="lbl"><span>Health</span><span id="hpTxt">100</span></div>
    <div class="bar"><i id="hpBar"></i></div>
  </div>
  <div id="bl">
    <div class="lbl"><span>Flashlight</span><span id="batTxt">100%</span></div>
    <div class="bar"><i id="batBar"></i></div>
    <div class="lbl"><span>Breath</span></div>
    <div class="bar"><i id="stBar"></i></div>
    <div class="lbl"><span>Noise you make</span></div>
    <div class="bar"><i id="noiseBar"></i></div>
  </div>
  <div id="buffs"></div>
  <div id="cross"></div>
  <div id="prompt"></div>
  <div id="state"></div>
  <div id="subs"></div>
  <div id="msg"></div>
  <div id="big"></div>
  <div id="hint"></div>
</div>
<div id="flash"></div>
<div id="fade"></div>
<div id="menu"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ================= WORLD GENERATOR (pure) =================
const CELL=2, STORY=4, CEIL=3.2, GW=44, GH=36, GWH=GW*GH;
const FLOOR_Y=[-4,0,4];
const MX0=6,MY0=6,MX1=37,MY1=29,CX=21,CY=17;
const C_VOID=0,C_WALL=1,C_FLOOR=2,C_DOOR=3,C_GRASS=4,C_HEDGE=5,C_OUTER=6,C_TREE=7,C_FOUNTAIN=8,C_GRAVE=9;
const DX=[1,0,-1,0], DY=[0,1,0,-1];
const FT={WARDROBE:0,DESK:1,SHELF:2,BED:3,CRATE:4,BARREL:5};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function generateWorld(seed){
  const R=mulberry(seed);
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;};
  const F=[];
  for(let f=0;f<3;f++) F.push({g:new Uint8Array(GWH), furn:new Int16Array(GWH).fill(-1), res:new Uint8Array(GWH)});
  const inb=(x,y)=>x>=0&&y>=0&&x<GW&&y<GH;
  const get=(f,x,y)=>inb(x,y)?F[f].g[y*GW+x]:C_VOID;
  const set=(f,x,y,v)=>{F[f].g[y*GW+x]=v;};
  const open=c=>c===C_FLOOR||c===C_GRASS;
  const solidW=c=>c===C_WALL||c===C_OUTER;
  const walkC=c=>c===C_FLOOR||c===C_DOOR||c===C_GRASS;

  const totalWalk=f=>{let c=0;for(let i=0;i<GWH;i++) if(walkC(F[f].g[i])&&F[f].furn[i]<0) c++;return c;};
  const reach=f=>{const s=CY*GW+CX;const seen=new Uint8Array(GWH);const st=[s];seen[s]=1;let c=0;
    while(st.length){const i=st.pop();c++;const x=i%GW,y=(i/GW)|0;
      for(let d=0;d<4;d++){const nx=x+DX[d],ny=y+DY[d];if(!inb(nx,ny))continue;const j=ny*GW+nx;if(seen[j])continue;
        if(walkC(F[f].g[j])&&F[f].furn[j]<0){seen[j]=1;st.push(j);}}}
    return c;};
  const connected=f=>reach(f)===totalWalk(f);
  const doorNear=(f,x,y)=>{for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++) if(get(f,x+dx,y+dy)===C_DOOR) return true;return false;};

  // courtyard on ground floor
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++) set(1,x,y,(x===0||y===0||x===GW-1||y===GH-1)?C_OUTER:C_GRASS);

  function fixDead(f){
    for(let pass=0;pass<2;pass++){
      const lab=new Int32Array(GWH).fill(-1);const size=[];let n=0;
      for(let i=0;i<GWH;i++){
        if(lab[i]>=0||!open(F[f].g[i]))continue;
        const st=[i];lab[i]=n;let cnt=0;
        while(st.length){const c=st.pop();cnt++;const x=c%GW,y=(c/GW)|0;
          for(let d=0;d<4;d++){const nx=x+DX[d],ny=y+DY[d];if(!inb(nx,ny))continue;const j=ny*GW+nx;
            if(lab[j]<0&&open(F[f].g[j])){lab[j]=n;st.push(j);}}}
        size.push(cnt);n++;
      }
      const dc=new Int32Array(n);
      for(let i=0;i<GWH;i++){
        if(F[f].g[i]!==C_DOOR)continue;const x=i%GW,y=(i/GW)|0;const seen=new Set();
        for(let d=0;d<4;d++){const nx=x+DX[d],ny=y+DY[d];if(inb(nx,ny)&&lab[ny*GW+nx]>=0) seen.add(lab[ny*GW+nx]);}
        seen.forEach(r=>dc[r]++);
      }
      for(let r=0;r<n;r++){
        if(dc[r]>=2||size[r]>90)continue;
        const cand=[];
        for(let i=0;i<GWH;i++){
          if(lab[i]!==r)continue;const x=i%GW,y=(i/GW)|0;
          for(let d=0;d<4;d++){
            const wx=x+DX[d],wy=y+DY[d],bx=x+2*DX[d],by=y+2*DY[d];
            if(get(f,wx,wy)!==C_WALL||!open(get(f,bx,by)))continue;
            const lb=lab[by*GW+bx];if(lb===r)continue;
            const ring=(wx===MX0||wx===MX1||wy===MY0||wy===MY1);if(ring&&f!==1)continue;
            const px=DY[d]!==0?1:0, py=DX[d]!==0?1:0;
            if(!solidW(get(f,wx+px,wy+py))||!solidW(get(f,wx-px,wy-py)))continue;
            let adj=false;for(let e=0;e<4;e++) if(get(f,wx+DX[e],wy+DY[e])===C_DOOR) adj=true;if(adj)continue;
            cand.push([wx,wy,lb]);
          }
        }
        if(cand.length){const c=cand[Math.floor(R()*cand.length)];set(f,c[0],c[1],C_DOOR);dc[r]++;if(c[2]>=0)dc[c[2]]++;}
      }
    }
  }

  for(let f=0;f<3;f++){
    for(let y=MY0;y<=MY1;y++)for(let x=MX0;x<=MX1;x++) set(f,x,y,C_WALL);
    for(let x=MX0+1;x<=MX1-1;x++) set(f,x,CY,C_FLOOR);
    for(let y=MY0+1;y<=MY1-1;y++) set(f,CX,y,C_FLOOR);
    const splits=[];const maxS=[8,7,6][f];
    const bsp=(x0,y0,x1,y1)=>{
      const w=x1-x0+1,h=y1-y0+1,cv=w>=7,ch=h>=7;
      if((!cv&&!ch)||(w<=maxS&&h<=maxS&&R()<0.55)){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++) set(f,x,y,C_FLOOR);return;}
      const vert=cv&&ch?(w>h?true:(h>w?false:R()<0.5)):cv;
      if(vert){const s=x0+3+Math.floor(R()*(w-6));splits.push({v:true,c:s,a:y0,b:y1});bsp(x0,y0,s-1,y1);bsp(s+1,y0,x1,y1);}
      else{const s=y0+3+Math.floor(R()*(h-6));splits.push({v:false,c:s,a:x0,b:x1});bsp(x0,y0,x1,s-1);bsp(x0,s+1,x1,y1);}
    };
    bsp(MX0+1,MY0+1,CX-2,CY-2);bsp(CX+2,MY0+1,MX1-1,CY-2);bsp(MX0+1,CY+2,CX-2,MY1-1);bsp(CX+2,CY+2,MX1-1,MY1-1);
    splits.push({v:false,c:CY-1,a:MX0+1,b:CX-2},{v:true,c:CX-1,a:MY0+1,b:CY-2},
                {v:false,c:CY-1,a:CX+2,b:MX1-1},{v:true,c:CX+1,a:MY0+1,b:CY-2},
                {v:false,c:CY+1,a:MX0+1,b:CX-2},{v:true,c:CX-1,a:CY+2,b:MY1-1},
                {v:false,c:CY+1,a:CX+2,b:MX1-1},{v:true,c:CX+1,a:CY+2,b:MY1-1});
    for(const s of splits){
      const cand=[];
      for(let t=s.a;t<=s.b;t++){
        const x=s.v?s.c:t,y=s.v?t:s.c;
        const a=s.v?get(f,x-1,y):get(f,x,y-1),b=s.v?get(f,x+1,y):get(f,x,y+1);
        if(get(f,x,y)===C_WALL&&a===C_FLOOR&&b===C_FLOOR) cand.push([x,y,t]);
      }
      shuffle(cand);
      const want=Math.max(1,Math.round((s.b-s.a+1)/6+R()*0.7));const ch=[];
      for(const c of cand){if(ch.length>=want)break;if(ch.some(o=>Math.abs(o[2]-c[2])<3))continue;ch.push(c);set(f,c[0],c[1],C_DOOR);}
    }
    if(f===1){set(1,MX0,CY,C_DOOR);set(1,MX1,CY,C_DOOR);set(1,CX,MY0,C_DOOR);set(1,CX,MY1,C_DOOR);}
    fixDead(f);
  }

  // courtyard decoration
  const tryPlace=(x,y,v)=>{if(get(1,x,y)!==C_GRASS)return false;set(1,x,y,v);if(!connected(1)){set(1,x,y,C_GRASS);return false;}return true;};
  for(let x=20;x<=22;x++)for(let y=2;y<=3;y++) set(1,x,y,C_FOUNTAIN);
  const nearM=(x,y)=>x>=MX0-1&&x<=MX1+1&&y>=MY0-1&&y<=MY1+1;
  for(let y=31;y<=33;y+=2)for(let x=2;x<=14;x+=2) if(R()<0.8) tryPlace(x,y,C_GRAVE);
  for(let i=0;i<GWH;i++){const x=i%GW,y=(i/GW)|0;if(F[1].g[i]===C_GRASS&&!nearM(x,y)&&!(x>=19&&x<=23&&y<=5)&&R()<0.08) tryPlace(x,y,C_TREE);}
  for(let k=0;k<14;k++){const vert=R()<0.5;const x=1+Math.floor(R()*(GW-2)),y=1+Math.floor(R()*(GH-2));const len=2+Math.floor(R()*3);
    for(let t=0;t<len;t++){const xx=x+(vert?0:t),yy=y+(vert?t:0);if(!nearM(xx,yy)&&inb(xx,yy)) tryPlace(xx,yy,C_HEDGE);}}

  // stairs (3 per link, spread out)
  const stairs=[];const bins=[[MX0+1,16],[17,26],[27,MX1-1]];
  for(const L of [0,1]){
    for(const bn of bins){
      const cand=[];
      for(let y=MY0+1;y<=MY1-1;y++)for(let x=bn[0];x<=bn[1];x++){
        if(x===CX||y===CY)continue;
        if(get(L,x,y)!==C_FLOOR||get(L+1,x,y)!==C_FLOOR)continue;
        if(doorNear(L,x,y)||doorNear(L+1,x,y))continue;
        if(stairs.some(s=>Math.abs(s.x-x)+Math.abs(s.y-y)<4))continue;
        let ok=true;
        for(const ff of [L,L+1]){let n=0;for(let d=0;d<4;d++) if(get(ff,x+DX[d],y+DY[d])===C_FLOOR) n++;if(n<2) ok=false;}
        if(ok) cand.push([x,y]);
      }
      if(cand.length){
        const c=cand[Math.floor(R()*cand.length)];stairs.push({lower:L,x:c[0],y:c[1]});
        for(const ff of [L,L+1]){F[ff].res[c[1]*GW+c[0]]=1;for(let d=0;d<4;d++){const nx=c[0]+DX[d],ny=c[1]+DY[d];if(inb(nx,ny)) F[ff].res[ny*GW+nx]=1;}}
      }
    }
  }

  // furniture
  const furniture=[];
  const probs=[{w:0.075,d:0.07,s:0.03,b:0,c:0.09,r:0.06},{w:0.09,d:0.095,s:0.08,b:0,c:0,r:0},{w:0.11,d:0.075,s:0.05,b:0.06,c:0,r:0}];
  const order=[['w',0],['d',1],['s',2],['b',3],['c',4],['r',5]];
  for(let f=0;f<3;f++){
    const cells=[];
    for(let y=MY0+1;y<=MY1-1;y++)for(let x=MX0+1;x<=MX1-1;x++) if(x!==CX&&y!==CY) cells.push([x,y]);
    shuffle(cells);const P=probs[f];
    for(const [x,y] of cells){
      const i=y*GW+x;
      if(F[f].g[i]!==C_FLOOR||F[f].res[i]||F[f].furn[i]>=0)continue;
      if(doorNear(f,x,y))continue;
      const walls=[];for(let d=0;d<4;d++) if(get(f,x+DX[d],y+DY[d])===C_WALL) walls.push(d);
      if(!walls.length)continue;
      const wd=walls[Math.floor(R()*walls.length)],fd=(wd+2)%4;
      const fx=x+DX[fd],fy=y+DY[fd],fi=fy*GW+fx;
      if(get(f,fx,fy)!==C_FLOOR||F[f].furn[fi]>=0)continue;
      const r=R();let type=-1,acc=0;
      for(const [k,t] of order){acc+=P[k];if(r<acc){type=t;break;}}
      if(type<0)continue;

function solidBox(f,cx,cy){const c=code(f,cx,cy);const x0=cx*CELL,z0=cy*CELL;

  return null;}

      const sb=solidBox(f,xx,yy);if(sb){const q=pushOut(x,z,r,sb);if(q){x=q[0];z=q[1];moved=true;}}

class Mon{
 constructor(type){this.type=type;this.def=MDEF[type];this.mesh=BUILD[type]();this.mesh.visible=false;scene.add(this.mesh);
  this.S=AU.spatial();this.L=AU.loops(type,this.S.input);
  this.ok=type==='butler'?(n=>walk[n]===1&&nF(n)===1&&!isGrass(n)):type==='phantom'?(n=>walk[n]===1&&!isGrass(n)):okWalk;
  this.marker=new THREE.Sprite(new THREE.SpriteMaterial({map:T.glow,color:0xff4020,depthTest:false,transparent:true,blending:THREE.AdditiveBlending}));
  this.marker.scale.set(1.4,1.4,1);this.marker.renderOrder=999;this.marker.visible=false;scene.add(this.marker);
  if(type==='mimic'){this.spark=mkSparkle(null);this.spark.visible=false;scene.add(this.spark);}
  this.reset();}
 reset(){Object.assign(this,{active:false,f:1,x:0,z:0,y:0,yaw:0,state:'wander',path:null,pi:0,rp:0,pt:0,sees:false,lp:false,lose:0,timer:0,t2:2,cd:0,
  climb:0,moving:false,spd:0,stepAcc:0,cueT:0,sawHide:null,deskFooled:false,show:true,last:-1,gone:0,exp:0,tired:0,burst:0,phase:0,obs:false,wasObs:false,on:true,cyc:50,hover:0});
  this.mesh.visible=false;this.mesh.scale.set(1,1,1);if(this.spark)this.spark.visible=false;DIR.rel(this);}
 dP(){return this.f===P.f?Math.hypot(P.x-this.x,P.z-this.z):999;}
 node(){return nodeAt(this.f,this.x,this.z);}
 go(n){const s=nearestOk(this.node(),this.ok),g=nearestOk(n,this.ok);if(s<0||g<0){this.path=null;return false;}
  if(s===g){this.path=[g];this.pi=0;return true;}const p=bfsPath(s,g,this.ok);this.path=p;this.pi=0;return !!p;}
 goP(){return this.go(pNode());}
 wanderPick(near){for(let k=0;k<20;k++){let n;if(near){const cx=cellOf(this.x)+Math.round((rnd()*2-1)*near),cy=cellOf(this.z)+Math.round((rnd()*2-1)*near);
   if(cx<0||cy<0||cx>=GW||cy>=GH)continue;n=this.f*GWH+cy*GW+cx;}else{const f=rnd()<0.6?this.f:(rnd()*3)|0;n=f*GWH+((rnd()*GWH)|0);}
   if(!this.ok(n))continue;if(this.go(n))return true;}return false;}
 follow(sp,dt){this.moving=false;if(!this.path||this.pi>=this.path.length)return true;const n=this.path[this.pi],nf=nF(n);
  if(nf!==this.f){this.climb+=dt;if(this.climb>1.1){this.climb=0;this.f=nf;this.x=ncx(n);this.z=ncz(n);this.pi++;
     AU.creak(AU.at(this.x,FLOOR_Y[this.f]+1,this.z,mufFor(this.f,this.x,this.z)),0.9,110,0.3);this.cue('footsteps on the stairs');}return false;}
  const door=doorAt[n];if(door&&!door.open&&this.type!=='phantom')monsterOpenDoor(door,this);
  const tx=ncx(n),tz=ncz(n),dx=tx-this.x,dz=tz-this.z,d=Math.hypot(dx,dz),s=sp*dt;
  if(d<=s){this.x=tx;this.z=tz;this.pi++;}else{this.x+=dx/d*s;this.z+=dz/d*s;}
  if(d>0.01)this.face(dx,dz,dt);this.moving=true;this.spd=sp;return this.pi>=this.path.length;}
 direct(tx,tz,sp,dt){const dx=tx-this.x,dz=tz-this.z,d=Math.hypot(dx,dz);if(d<0.02)return;const s=Math.min(d,sp*dt);
  const q=collide(this.f,this.x+dx/d*s,this.z+dz/d*s,0.3,false);this.x=q[0];this.z=q[1];this.face(dx,dz,dt);this.moving=true;this.spd=sp;}
 face(dx,dz,dt){this.yaw+=angDiff(Math.atan2(dx,dz),this.yaw)*Math.min(1,dt*8);}
 see(range,fov){if(this.f!==P.f||P.hidden)return false;let r=range*pVis();
  if(P.underDesk){if(this.type!=='crawler'&&this.deskFooled)return false;r=Math.min(r,this.type==='crawler'?6:3);}
  const dx=P.x-this.x,dz=P.z-this.z,d=Math.hypot(dx,dz);if(d>r)return false;
  if(d>1.6&&fov>-1){if((Math.sin(this.yaw)*dx+Math.cos(this.yaw)*dz)/d<fov)return false;}return this.lp;}

  else{this.rp-=dt;if(this.rp<=0||!this.path){this.rp=0.45;if(this.sees)this.goP();else if(this.last>=0)this.go(this.last);}this.follow(sp,dt);}}

 cue(text){if(this.cueT>0)return;const d=this.f===P.f?this.dP():Math.hypot(P.x-this.x,P.z-this.z)+8;if(d>24)return;this.cueT=7;sub(`[${text}, ${where(this)}]`);}
 teleportFar(){const n=farNode(this.ok,30);if(n>=0){this.f=nF(n);this.x=ncx(n);this.z=ncz(n);this.y=FLOOR_Y[this.f];}this.path=null;this.state=this.type==='butler'?'return':'wander';
  this.sawHide=null;DIR.rel(this);this.mesh.scale.set(1,1,1);}
 spawn(){this.reset();this.active=true;this.teleportFar();
  if(this.type==='butler'){this.route=[];const cand=[];for(let i=0;i<GWH;i++){const n=GWH+i;if(this.ok(n)&&rnd()<0.03)cand.push(n);}
    for(const n of [GWH+CY*GW+MX0+2,GWH+CY*GW+MX1-2,GWH+(MY0+2)*GW+CX,GWH+(MY1-2)*GW+CX])cand.push(n);

  if(inten>0&&(P.battery<0.15||ghost)&&rnd()<0.14)inten*=rnd()*0.3;flashL.intensity=inten;
  G.lt-=dt;if(G.lt<=0){G.lt=14+rnd()*22;G.lightning=0.38;if(AU.on)AU.thunder(0.6+rnd()*1.8,P.f===0?0.35:1);}
  let boost=0;if(G.lightning>0){G.lightning-=dt;if(P.f>0&&rnd()<0.55)boost=1;}
  const nv=P.buff.tonic>0;ambient.color.setHex(nv?0x3c6a3c:0x2c3046);
  ambient.intensity=(nv?1.25:0.34)+boost*(P.outside?2.2:1.2)+(G.dawn||0)*1.5;
  MAT.win.color.copy(boost?WIN_FLASH:WIN_BASE);
  moon.intensity+=((P.outside?0.45:0)+boost*(P.outside?1.5:0)-moon.intensity)*Math.min(1,dt*3);
  scene.fog.color.setHex(P.outside?0x05070c:0x000000);scene.fog.density=nv?0.03:(P.outside?0.045:(P.f===0?0.1:0.085));
  G.ghostNear=0;
}

// ================= HUD =================
let hudT=0;
function updHud(dt){hudT-=dt;if(hudT>0)return;hudT=0.1;
  const tm=Math.min(6,G.time/HOUR_LEN),h=Math.floor(tm),mi=Math.floor((tm-h)*60);$('clock').innerHTML=`0${h}:${mi<10?'0':''}${mi}<small>am</small>`;
  $('floorLbl').textContent=FLOOR_NAME[P.f]+(P.outside?', in the courtyard':'');
  $('lives').textContent='♥'.repeat(Math.max(0,P.lives))+(P.charm?'  ✧'.repeat(P.charm):'');
  $('hpBar').style.width=Math.max(0,P.health)+'%';$('hpTxt').textContent=Math.ceil(Math.max(0,P.health));
  $('batBar').style.width=(P.battery*100)+'%';$('batTxt').textContent=Math.round(P.battery*100)+'%'+(P.flashOn?'':', off');
  $('stBar').style.width=(P.buff.stamina>0?100:P.stamina*100)+'%';$('stBar').style.background=P.exhausted?'#5a2020':(P.buff.stamina>0?'#40d080':'#8a8070');
  $('noiseBar').style.width=Math.min(100,(P.noise||0)/17*100)+'%';
  const B={stamina:'Adrenaline',silent:'Felt soles',spirit:'Planchette',tonic:'Owl-eye tonic'};let bh='';
  for(const k in B)if(P.buff[k]>0)bh+=`<div class="b">${B[k]} <span>${Math.ceil(P.buff[k])}s</span></div>`;$('buffs').innerHTML=bh;
  const pr=$('prompt');if(P.hidden){pr.style.display='block';pr.innerHTML='<kbd>E</kbd>Leave the wardrobe';}
  else if(P.focus){pr.style.display='block';pr.innerHTML=`<kbd>E</kbd>${P.focus.label}`;}else pr.style.display='none';
  const st=$('state');if(P.hidden){st.style.display='block';st.textContent='Hidden in the wardrobe. Hold still.';}
  else if(P.underDesk){st.style.display='block';st.textContent='Curled up under the desk.';}else if(P.invuln>0){st.style.display='block';st.textContent='Catch your breath...';}else st.style.display='none';
  $('deskov').style.display=P.underDesk?'block':'none';
  const sp=$('spirit');if(P.buff.spirit>0){let up=0,dn=0;for(const m of MONS){if(!m.active||!m.show)continue;if(m.f>P.f)up++;else if(m.f<P.f)dn++;}
    sp.style.display='block';sp.textContent=`You sense ${up} above and ${dn} below`;}else sp.style.display='none';}
const gc=$('grain'),gx=gc.getContext('2d'),gimg=gx.createImageData(200,120);
function updGrain(){const d=gimg.data;for(let i=0;i<d.length;i+=4){const v=(rnd()*255)|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}gx.putImageData(gimg,0,0);
  gc.style.opacity=(0.08+(G.drainFx>0?0.25:0)+(P.health<35?0.08:0)).toFixed(2);if(G.drainFx>0)G.drainFx-=0.016;}
// ================= GAME FLOW =================
const HUD=$('hud'),MENU=$('menu'),cvs=renderer.domElement;
let drag=false,noLockNote=false,hadLock=false,last=performance.now();
try{const s=JSON.parse(localStorage.getItem('ravenholt-set')||'null');if(s)Object.assign(SET,s);}catch(e){}
function saveSet(){try{localStorage.setItem('ravenholt-set',JSON.stringify(SET));}catch(e){}}
function newPlayer(){const n=nearestOk(GWH+CY*GW+CX,okWalk);return {f:1,x:ncx(n),z:ncz(n),yaw:Math.PI,pitch:0,vx:0,vz:0,eye:1.6,bob:0,bobAmt:0,stepAcc:0,stamina:1,exhausted:false,
  battery:1,flashOn:true,health:100,lives:3,charm:0,buff:{stamina:0,silent:0,spirit:0,tonic:0},hidden:null,underDesk:null,crouch:false,lock:0,invuln:0,noise:0,focus:null,outside:false};}
P=newPlayer();G={state:'title',time:0,hour:0,lt:12,lightning:0,ghostNear:0,collected:0,drainFx:0,dawn:0,frame:0};
function silenceAll(){if(!AU.on)return;const t=AU.C.currentTime;for(const m of MONS)m.S.out.gain.setTargetAtTime(0,t,0.3);AU.chaseG.gain.setTargetAtTime(0,t,0.5);try{speechSynthesis.cancel();}catch(e){}}
function startGame(){
  AU.init();if(!MONS.length)ORDER.forEach(t=>MONS.push(new Mon(t)));
  $('slats').style.display='none';$('deskov').style.display='none';AU.setHidden(false);
  P=newPlayer();
  G={state:'play',time:0,hour:0,lastHour:0,lt:10,lightning:0,ghostNear:0,collected:0,drainFx:0,dawn:0,spawned:new Set(),spawnCd:3,itemT:18,frame:0};
  DIR.eng.clear();journal.clear();hintQ.length=0;
  for(const m of MONS){m.reset();m.S.out.gain.value=0;}
  for(const it of items)scene.remove(it.g);items.length=0;for(let i=0;i<16;i++)spawnItem();
  for(const o of furnObjs)if(o)o.known=false;
  MENU.style.display='none';HUD.style.display='block';$('fade').style.opacity=0;
  last=performance.now();lockPointer();msg('Midnight. Survive until six.',4);
}
function tick(dt){
  G.frame++;
  if(G.state==='title'){P.yaw+=dt*0.08;applyCam();}
  else if(G.state==='play'){
    G.time+=dt;const tH=G.time/HOUR_LEN;G.hour=Math.floor(tH);
    if(G.hour>G.lastHour&&G.hour<6){G.lastHour=G.hour;AU.chime(G.hour);big(`0${G.hour}:00`,2.5);}
    G.spawnCd-=dt;if(G.spawnCd<=0){for(const t of ORDER){if(!G.spawned.has(t)&&tH>=MDEF[t].t){G.spawned.add(t);MONS.find(m=>m.type===t).spawn();G.spawnCd=12;
      if(G.spawned.size>2)sub('[something new stirs in the house]',4);break;}}}
    G.itemT-=dt;if(G.itemT<=0){G.itemT=16;if(items.length<14)spawnItem();}
    G.dawn=tH>5.5?(tH-5.5)*0.3:0;
    updPlayer(dt);for(const m of MONS)m.update(dt);
    if(tH>=6)win();
  }else if(G.state==='scare')updScare(dt);
  else if(G.state==='won'){G.dawn=Math.min(1,G.dawn+dt*0.25);applyCam();}
  if(G.state!=='paused'){updWorld(dt);if(G.state!=='title')updHud(dt);
    if(AU.on){AU.listen(camera);if(G.state==='play')AU.update(dt);}if(G.frame%2===0)updGrain();}
}
function win(){G.state='won';for(const m of MONS){m.active=false;m.mesh.visible=false;m.marker.visible=false;if(m.spark)m.spark.visible=false;}DIR.eng.clear();silenceAll();
  if(P.hidden)leaveWardrobe(true);AU.chime(6);big('06:00',5);msg('Pale light creeps through the windows. The house falls silent.',5);flashScreen('#ffe6b8',0.5);
  setTimeout(()=>endScreen(true),6500);}
function bestiaryHtml(){if(!journal.size)return '';return `<div class="best">${ORDER.filter(t=>journal.has(t)).map(t=>`<div><b>${MDEF[t].name}</b>${MDEF[t].desc}</div>`).join('')}</div>`;}
function settingsHtml(){return `<div class="set"><label>Mouse speed <input type="range" id="sSens" min="0.3" max="2.5" step="0.1" value="${SET.sens}"></label>
<label>Volume <input type="range" id="sVol" min="0" max="1" step="0.05" value="${SET.vol}"></label>
<label><input type="checkbox" id="sSubs" ${SET.subs?'checked':''}> Sound captions</label></div>`;}
function bindSettings(){$('sSens').oninput=e=>{SET.sens=+e.target.value;saveSet();};$('sVol').oninput=e=>{SET.vol=+e.target.value;if(AU.master)AU.master.gain.value=SET.vol;saveSet();};
  $('sSubs').onchange=e=>{SET.subs=e.target.checked;saveSet();};}
function clockStr(){const tm=Math.min(6,G.time/HOUR_LEN),h=Math.floor(tm),mi=Math.floor((tm-h)*60);return `0${h}:${mi<10?'0':''}${mi}`;}
function showTitle(){HUD.style.display='none';MENU.style.display='flex';$('fade').style.opacity=0;MENU.innerHTML=`<div class="panel">
<h1>Ravenholt</h1><div class="tag">Six hours until dawn.</div>
<p>The clock in the hall has struck midnight, and something in the house has noticed you. Stay alive until six in the morning.</p>
<p class="small">Every hour wakes something new. Learn how each one hunts, because what saves you from one may doom you to another. Sparkles mark useful finds. Wear headphones: sound tells you where they are.</p>
<div class="ctl"><kbd>W A S D</kbd><span>Move</span><kbd>Mouse</kbd><span>Look</span><kbd>Shift</kbd><span>Run, which is loud</span><kbd>Q</kbd><span>Hold to sneak quietly</span>
<kbd>C</kbd><span>Crawl, and fit under desks</span><kbd>E</kbd><span>Doors, stairs and wardrobes</span><kbd>F</kbd><span>Flashlight</span><kbd>Esc</kbd><span>Pause</span></div>
${settingsHtml()}<button class="btn" id="go">Enter the house</button><p class="small">Needs a keyboard and mouse.</p></div>`;
  bindSettings();$('go').onclick=()=>startGame();}
function showPause(){HUD.style.display='none';MENU.style.display='flex';MENU.innerHTML=`<div class="panel"><h1>Paused</h1><div class="tag">${clockStr()} am. The house waits for you.</div>
${settingsHtml()}<button class="btn" id="res">Resume</button><button class="btn" id="rst">Restart the night</button>${bestiaryHtml()}</div>`;
  bindSettings();$('res').onclick=resume;$('rst').onclick=()=>startGame();}
function endScreen(won){silenceAll();exitLock();HUD.style.display='none';MENU.style.display='flex';
  MENU.innerHTML=`<div class="panel"><h1>${won?'Dawn':'Taken'}</h1><div class="tag">${won?'You survived the night at Ravenholt.':'Ravenholt keeps another guest.'}</div>
<div class="stats">You lasted until ${clockStr()} am<br>${G.collected} ${G.collected===1?'item':'items'} found<br>${won?`${P.lives} ${P.lives===1?'life':'lives'} to spare`:`${journal.size} of 10 horrors met`}</div>
<button class="btn" id="again">Play again</button>${bestiaryHtml()}</div>`;$('again').onclick=()=>startGame();}
function pause(){if(G.state!=='play')return;G.state='paused';for(const k in keys)keys[k]=false;if(AU.C)AU.C.suspend();try{speechSynthesis.pause();}catch(e){}showPause();}
function resume(){if(G.state!=='paused')return;G.state='play';if(AU.C)AU.C.resume();try{speechSynthesis.resume();}catch(e){}MENU.style.display='none';HUD.style.display='block';last=performance.now();lockPointer();}
// ================= INPUT =================
function lockFail(){if(noLockNote)return;noLockNote=true;sub('[Mouse capture is unavailable here. Hold the left mouse button and drag to look around.]',7);}
function lockPointer(){try{const r=cvs.requestPointerLock&&cvs.requestPointerLock();if(r&&r.catch)r.catch(lockFail);}catch(e){lockFail();}}
function exitLock(){try{if(document.pointerLockElement&&document.exitPointerLock)document.exitPointerLock();}catch(e){}}
document.addEventListener('pointerlockerror',lockFail);
document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement===cvs)hadLock=true;else if(G.state==='play'&&hadLock)pause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
cvs.addEventListener('mousedown',()=>{if(G.state!=='play')return;drag=true;if(document.pointerLockElement!==cvs&&!noLockNote)lockPointer();});
addEventListener('mouseup',()=>drag=false);
document.addEventListener('mousemove',e=>{if(G.state!=='play')return;if(document.pointerLockElement!==cvs&&!drag)return;
  const s=0.0022*SET.sens;P.yaw-=e.movementX*s;P.pitch=clamp(P.pitch-e.movementY*s,-1.45,1.45);
  if(P.hidden){P.yaw=P.hidden.camYaw+clamp(angDiff(P.yaw,P.hidden.camYaw),-0.7,0.7);P.pitch=clamp(P.pitch,-0.5,0.4);}});
function toggleFlash(){if(P.battery<=0){msg('The flashlight is dead. Find batteries.');return;}P.flashOn=!P.flashOn;AU.click();emitNoise(P.f,P.x,P.z,1.5);}
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(G.state!=='play'){if(e.code==='Escape'&&G.state==='paused'&&!e.repeat)resume();return;}
  keys[e.code]=true;if(e.repeat)return;
  switch(e.code){case 'KeyE':case 'Space':interact();break;case 'KeyF':toggleFlash();break;case 'KeyC':toggleCrouch();break;case 'Escape':pause();break;}});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
function frame(now){const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;try{tick(dt);}catch(err){console.error(err);}renderer.render(scene,camera);requestAnimationFrame(frame);}
showTitle();applyCam();requestAnimationFrame(frame);
</script>
</body></html>
