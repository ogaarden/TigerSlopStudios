<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Deep Core: Mars Miner</title>
<style>
  :root{color-scheme:dark;
  --bg:#0a0505; --panel:#1a100d; --panel2:#24160f; --ink:#f4e5d2; --dim:#b09580;
  --accent:#ff8a3d; --accent2:#ffc560; --good:#7bd88f; --bad:#ff5a4f; --line:#5a3624; --line2:#2e1c14;
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Courier New",ui-monospace,Menlo,Consolas,monospace;-webkit-user-select:none;user-select:none;}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);}
#game{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000;}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,2,2,.62);z-index:10;padding:16px;box-sizing:border-box;}
.ov.show{display:flex;}
.panel{background:var(--panel);border:3px solid var(--line);box-shadow:0 0 0 3px #000,0 14px 50px rgba(0,0,0,.7);
  padding:18px 22px;width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto;box-sizing:border-box;}
h1{font-size:34px;margin:4px 0 2px;color:var(--accent);letter-spacing:2px;text-shadow:3px 3px 0 #3a1608;}
h2{font-size:22px;margin:0;color:var(--accent2);letter-spacing:1px;}
h3{font-size:15px;margin:14px 0 6px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;}
p{line-height:1.45;margin:8px 0;}
.sub{color:var(--dim);font-size:14px;}
.btn{font:inherit;font-weight:bold;font-size:15px;background:#3a2216;color:var(--ink);border:2px solid var(--line);
  padding:8px 14px;margin:4px 6px 4px 0;cursor:pointer;box-shadow:0 3px 0 #000;}
.btn:hover:not([disabled]){background:#5a3220;border-color:var(--accent);}
.btn:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 #000;}
.btn[disabled]{opacity:.38;cursor:default;}
.btn.big{font-size:18px;padding:11px 20px;display:block;width:100%;margin:8px 0;text-align:left;}
.btn.primary{background:#7a3a12;border-color:var(--accent);}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:4px;}
.shop-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--line2);padding-bottom:8px;}
.cash{font-size:22px;color:var(--good);font-weight:bold;}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0;}
td,th{padding:6px 6px;border-bottom:1px solid var(--line2);text-align:left;}
th{color:var(--dim);font-weight:normal;font-size:12px;text-transform:uppercase;}
td.num,th.num{text-align:right;}
tr.cur td{background:#2c1a10;color:var(--accent2);}
tr.extra td:first-child::after{content:" ★";color:#c78bff;}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 4px;}
.tab{font:inherit;font-size:13px;padding:6px 10px;background:#24150e;color:var(--dim);border:2px solid var(--line2);cursor:pointer;}
.tab.on{color:var(--ink);border-color:var(--accent);background:#3a2216;}
.bar{height:14px;background:#000;border:2px solid var(--line);position:relative;margin:6px 0;}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--good);}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;}
.keys b{color:var(--accent2);}
.dlg{display:flex;gap:16px;align-items:flex-start;}
.dlg canvas{width:96px;height:96px;image-rendering:pixelated;border:3px solid var(--line);flex:none;background:#000;}
.dlg .who{color:var(--accent);font-weight:bold;letter-spacing:1px;font-size:14px;}
.dlg .txt{white-space:pre-wrap;min-height:90px;}
.bonus{color:var(--good);font-weight:bold;}
.hint{color:var(--dim);font-size:12px;margin-top:10px;}
.tag{display:inline-block;font-size:11px;padding:2px 6px;border:1px solid var(--line);color:var(--dim);margin-left:6px;}
#touch{position:fixed;inset:auto 0 0 0;display:none;z-index:5;pointer-events:none;justify-content:space-between;padding:12px;box-sizing:border-box;}
#touch .pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:6px;pointer-events:auto;}
#touch button{font:inherit;font-size:22px;font-weight:bold;background:rgba(40,20,12,.6);color:var(--ink);border:2px solid rgba(255,138,61,.5);border-radius:8px;touch-action:none;}
#touch .side{display:flex;gap:6px;align-items:flex-end;pointer-events:auto;flex-wrap:wrap;max-width:200px;justify-content:flex-end;}
#touch .side button{width:52px;height:52px;font-size:14px;}
@media (max-width:520px){ h1{font-size:26px;} .dlg{flex-direction:column;} .panel{padding:14px;} }
</style>

const rand=(a,b)=>a+Math.random()*(b-a);

const isMineral=t=>t>=T_MIN&&t<T_MIN+CONFIG.MINERALS.length;
const isArtifact=t=>t>=T_ART&&t<T_ART+CONFIG.ARTIFACTS.length;
const diggable=t=>t===T_DIRT||t===T_GAS||t===T_LAVA||isMineral(t)||isArtifact(t);

const STRATA=[
  {ft:0,    c:['#8a4426','#7a3a20','#9c5230','#5e2c16'], tunnel:'#2a120a'},
  {ft:1200, c:['#70381f','#62301b','#80442a','#4a2412'], tunnel:'#230f08'},

  {ft:7010, c:['#13203a','#0f1a30','#1b2c4a','#0a1222'], tunnel:'#04070e'},
];
function strataIdx(d){ for(let i=STRATA.length-1;i>=0;i--) if(d>=STRATA[i].ft) return i; return 0; }

function mineralWeights(d){
  return CONFIG.MINERALS.map(m=>{
    if(m.extra&&CONFIG.ORIGINAL_MODE) return 0;
    if(d<m.min) return 0;
    let w=m.w;
    if(m.peak>m.min&&d<m.peak) w*=Math.max(0.15,(d-m.min)/(m.peak-m.min));
    if(m.fadeStart!=null&&d>m.fadeStart){ const t=clamp((d-m.fadeStart)/(m.fadeEnd-m.fadeStart),0,1); w*=lerp(1,m.floor,t); }
    return w;
  });
}

function genTile(r,rnd){
  const g=r-W.skyRows; if(g<0) return T_EMPTY;
  const d=depthFtRow(r), H=CONFIG.HAZARDS;
  for(let i=0;i<CONFIG.ARTIFACTS.length;i++){ const a=CONFIG.ARTIFACTS[i];
    if(a.extra&&CONFIG.ORIGINAL_MODE) continue;
    if(d>=a.min&&d<=a.max&&rnd()<a.chance) return T_ART+i; }
  if(g>=3){
    if(rnd()<H.CAVE_CHANCE) return T_EMPTY;
    if(rnd()<lerp(H.ROCK_MIN,H.ROCK_MAX,clamp(d/H.ROCK_FULL_FT,0,1))) return T_ROCK;
    if(d>=H.GAS_START_FT&&rnd()<lerp(H.GAS_MIN,H.GAS_MAX,clamp((d-H.GAS_START_FT)/(H.GAS_FULL_FT-H.GAS_START_FT),0,1))) return T_GAS;
    if(d>=H.LAVA_START_FT&&rnd()<lerp(H.LAVA_MIN,H.LAVA_MAX,clamp((d-H.LAVA_START_FT)/(H.LAVA_FULL_FT-H.LAVA_START_FT),0,1))) return T_LAVA;
  }
  const dens=lerp(CONFIG.MINERAL_DENSITY_TOP,CONFIG.MINERAL_DENSITY_BOTTOM,clamp(d/CONFIG.MAIN_DEPTH_FT,0,1));
  if(g>=1&&rnd()<dens){
    const ws=mineralWeights(d); let tot=0; for(const w of ws) tot+=w;
    if(tot>0){ let p=rnd()*tot; for(let i=0;i<ws.length;i++){ p-=ws[i]; if(p<=0) return T_MIN+i; } }
  }
  return T_DIRT;
}

function buildWorld(seed){
  const cols=CONFIG.WORLD_COLS, sky=CONFIG.SKY_ROWS;
  const mainRows=Math.round(CONFIG.MAIN_DEPTH_FT/CONFIG.FT_PER_TILE);
  const extra=CONFIG.ORIGINAL_MODE?0:Math.round(CONFIG.EXTRA_DEPTH_FT/CONFIG.FT_PER_TILE);
  const sealRow=sky+mainRows;
  const rows=sealRow+1+(extra?extra+1:0);
  W={cols,rows,skyRows:sky,sealRow,arenaBottom:sealRow-1,
     arenaTop:sealRow-Math.round(CONFIG.ARENA_HEIGHT_FT/CONFIG.FT_PER_TILE),
     grid:new Uint8Array(cols*rows),rowStrata:new Uint8Array(rows),hasExtra:!!extra};
  const rnd=mulberry32(seed);
  for(let r=0;r<rows;r++){
    W.rowStrata[r]=strataIdx(depthFtRow(r));
    for(let c=0;c<cols;c++){
      let t;
      if(r<sky) t=T_EMPTY;
      else if(c===0||c===cols-1) t=T_BEDROCK;
      else if(r===sealRow) t=T_SEAL;
      else if(r===rows-1&&extra) t=T_BEDROCK;
      else t=genTile(r,rnd);
      W.grid[r*cols+c]=t;
    }
  }
  if(!extra) for(let c=0;c<cols;c++) W.grid[sealRow*cols+c]=c===0||c===cols-1?T_BEDROCK:T_SEAL;
  // betong under byggene
  for(const z of ZONES) for(let c=z.x0;c<=z.x1;c++) W.grid[sky*cols+c]=T_CONCRETE;
  // sjefsarena
  for(let r=W.arenaTop;r<=W.arenaBottom;r++) for(let c=1;c<cols-1;c++) W.grid[r*cols+c]=T_EMPTY;
  for(let c=5;c<=9;c++)   W.grid[(W.arenaBottom-4)*cols+c]=T_BEDROCK;
  for(let c=30;c<=34;c++) W.grid[(W.arenaBottom-4)*cols+c]=T_BEDROCK;
  for(let c=17;c<=22;c++) W.grid[(W.arenaBottom-8)*cols+c]=T_BEDROCK;
}
function getT(c,r){ if(r<0) return T_EMPTY; if(c<0||c>=W.cols||r>=W.rows) return T_BEDROCK; return W.grid[r*W.cols+c]; }
function setT(c,r,t){ if(c<0||c>=W.cols||r<0||r>=W.rows) return; W.grid[r*W.cols+c]=t; }
const solid=(c,r)=>getT(c,r)!==T_EMPTY;

function pix(fn){ const s=mk(16,16,fn); return mk(TS,TS,x=>{x.imageSmoothingEnabled=false;x.drawImage(s,0,0,TS,TS);}); }
function p1(x,c,i,j,w=1,h=1){x.fillStyle=c;x.fillRect(i,j,w,h);}

        for(let k=0;k<4;k++){const a=(r()*14)|0,b=(r()*14)|0; p1(x,s.c[3],a,b+1,2,1); p1(x,s.c[2],a,b,1,1);}

        for(const [a,b,h] of sh){ p1(x,'rgba(0,0,0,.4)',a+1,b+1,2,h); p1(x,m.col,a,b,2,h); p1(x,m.hi,a,b,1,Math.max(1,h-3)); }

        p1(x,'#ffffff',cx-2,cy-3,1,1); p1(x,m.hi,cx-1,cy-2,1,1);

  CONFIG.ARTIFACTS.forEach((a,i)=>{
    SPR.art[i]=pix(x=>{
      const c=ART_COL[a.kind];
      if(a.kind==='bone'){ p1(x,'rgba(0,0,0,.4)',3,8,11,3); p1(x,c,3,7,10,2); p1(x,c,2,6,2,4); p1(x,c,12,6,2,4); p1(x,c,5,4,1,3);p1(x,c,8,4,1,3);p1(x,c,5,10,1,3);p1(x,c,8,10,1,3);}
      else if(a.kind==='probe'){ p1(x,'#555',4,6,8,7); p1(x,c,4,5,8,6); p1(x,'#d04040',6,7,2,2); p1(x,'#ccc',7,1,1,4); p1(x,'#ffd040',6,1,3,1); p1(x,c,2,11,2,3); p1(x,c,12,11,2,3);}
      else if(a.kind==='skull'){ p1(x,c,4,3,8,8); p1(x,c,5,11,6,3); p1(x,'#204060',5,6,2,2); p1(x,'#204060',9,6,2,2); p1(x,'#fff',5,4,2,1);}
      else if(a.kind==='tablet'){ p1(x,'#3a3028',3,2,10,13); p1(x,c,3,1,10,13); for(let k=0;k<4;k++){p1(x,'#d8b060',5,3+k*3,2,1);p1(x,'#d8b060',8,3+k*3,3,1);} }
      else { p1(x,'#600010',4,4,8,8); p1(x,c,5,5,6,6); p1(x,'#ffc0d0',6,6,2,2); }

  SPR.seal=pix(x=>{ p1(x,'#1c0a28',0,0,16,16); p1(x,'#2c1240',0,0,16,1);
    const r=[[2,3],[6,5],[10,2],[13,7],[4,10],[9,11],[12,13],[1,14]]; for(const [a,b] of r){p1(x,'#b050ff',a,b,2,1);p1(x,'#b050ff',a+1,b+1,1,1);} });

function shade(hex,f){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
  if(f<0){r*=1+f;g*=1+f;b*=1+f;} else {r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f;}
  return `rgb(${r|0},${g|0},${b|0})`; }

/* ===================== Lyd (enkel WebAudio-synth) ===================== */
const Sfx={ac:null,on:true,
  init(){ if(this.ac) return; try{ this.ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.ac=null; } },
  tone(f,d,type='square',v=0.05,slide=0){ if(!this.on||!this.ac) return; try{
    const t=this.ac.currentTime,o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g);g.connect(this.ac.destination);o.start(t);o.stop(t+d+0.02);}catch(e){} },
  noise(d,v=0.15,freq=800){ if(!this.on||!this.ac) return; try{
    const t=this.ac.currentTime,n=Math.floor(this.ac.sampleRate*d),buf=this.ac.createBuffer(1,n,this.ac.sampleRate),a=buf.getChannelData(0);
    for(let i=0;i<n;i++) a[i]=(Math.random()*2-1)*(1-i/n);
    const s=this.ac.createBufferSource(),f=this.ac.createBiquadFilter(),g=this.ac.createGain();
    f.type='lowpass';f.frequency.value=freq;g.gain.value=v;s.buffer=buf;s.connect(f);f.connect(g);g.connect(this.ac.destination);s.start(t);}catch(e){} },
  drill(){this.noise(0.08,0.05,500);}, collect(){this.tone(520,0.08,'square',0.04,1.6);setTimeout(()=>this.tone(780,0.1,'square',0.035,1.4),60);},
  boom(){this.noise(0.7,0.35,400);this.tone(90,0.5,'sawtooth',0.08,0.4);}, hurt(){this.tone(180,0.18,'sawtooth',0.06,0.5);},
  cash(){this.tone(880,0.07,'square',0.04);setTimeout(()=>this.tone(1320,0.15,'square',0.04),70);},
  blip(){this.tone(1200,0.03,'square',0.025);}, warn(){this.tone(440,0.12,'triangle',0.06);},
};

/* ===================== Lagring ===================== */
const SAVE_KEY='deepcore_mars_miner_save_v1';
function b64(u8){ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }
function unb64(s){ const b=atob(s),u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function saveGame(quiet){
  if(!W||!P||P.dead) return false;
  try{
    const data={v:1,mode:CONFIG.ORIGINAL_MODE,cols:W.cols,rows:W.rows,grid:b64(W.grid),
      P:{x:P.x,y:P.y,fuel:P.fuel,hull:P.hull,money:P.money,lv:P.lv,items:P.items,cargo:P.cargo,maxDepth:P.maxDepth},
      G:{seed:G.seed,time:G.time,storyDone:G.storyDone,bossStarted:G.bossStarted,bossDefeated:G.bossDefeated,totalEarned:G.totalEarned}};
    localStorage.setItem(SAVE_KEY,JSON.stringify(data));
    if(!quiet) toast('Spillet er lagret','#7bd88f');
    return true;
  }catch(e){ if(!quiet) toast('Kunne ikke lagre (lagring blokkert)','#ff5a4f'); return false; }
}
function readSave(){ try{ const s=localStorage.getItem(SAVE_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }
function loadGame(){
  const d=readSave(); if(!d) return false;
  try{
    CONFIG.ORIGINAL_MODE=!!d.mode;
    buildWorld(d.G.seed);
    const g=unb64(d.grid); if(g.length!==W.grid.length) throw new Error('size');
    W.grid=g;
    P=newPlayer(); Object.assign(P,d.P); P.lv={...newPlayer().lv,...d.P.lv}; P.items={...newPlayer().items,...d.P.items};
    P.hull=Math.min(P.hull,maxHull()); P.fuel=Math.min(P.fuel,maxFuel());
    G={...d.G,dialogs:[],quake:null,pendingVictory:false,shopTab:'drill'};
    B=null; particles.length=0; fireballs.length=0; toasts.length=0;
    if(G.bossStarted&&!G.bossDefeated) G.bossStarted=false; // sjefen vekkes igjen når du går inn i arenaen
    cam.x=P.x-VW/2; cam.y=P.y-VH/2;
    P.lastZone=zoneAt(); // ikke åpne butikken med én gang
    setState('play'); toast('Lagret spill lastet','#7bd88f');
    return true;
  }catch(e){ toast('Lagringen var ødelagt','#ff5a4f'); return false; }
}

/* ===================== Hjelpere for spillet ===================== */
function toast(text,color='#f4e5d2',dur=2.2){ toasts.push({text,color,t:dur,d:dur}); if(toasts.length>5) toasts.shift(); }
function addP(x,y,vx,vy,life,color,size=3,grav=600){ if(particles.length>500) particles.shift(); particles.push({x,y,vx,vy,life,max:life,color,size,grav}); }
function burst(x,y,n,colors,spd=200,life=0.8,size=3){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2,s=Math.random()*spd; addP(x,y,Math.cos(a)*s,Math.sin(a)*s-60,life*(0.5+Math.random()*0.7),colors[(Math.random()*colors.length)|0],size); } }
function earn(n){ P.money+=n; G.totalEarned+=n; }
function damage(n,cause){
  if(P.dead||n<=0) return;
  P.hull-=n; flash=Math.min(0.6,0.2+n/40); cam.shake=Math.max(cam.shake,Math.min(10,3+n/4)); Sfx.hurt();
  if(n>=1) toast(`-${n.toFixed(n<10?1:0)} HP  ${cause||''}`,'#ff5a4f',1.4);
  if(P.hull<=0){ P.hull=0; die('hull',cause); }
}
function die(kind,cause){
  if(P.dead) return;
  P.dead=0.001; P.drill=null;
  if(kind==='hull'){ P.deadReason=`Skroget ble ødelagt${cause?' ('+cause.toLowerCase()+')':''}.`; Sfx.boom();
    burst(P.x,P.y,70,['#ffcf40','#ff7a20','#ff3a10','#333','#777'],380,1.3,4); cam.shake=14; }
  else { P.deadReason='Tom for drivstoff. Poden står stille i mørket, og ingen kommer.'; Sfx.tone(300,0.8,'triangle',0.06,0.3); }
}
function zoneAt(){
  if(!P.onGround) return null;
  if(Math.floor(P.y/TS)!==W.skyRows-1) return null;
  const c=P.x/TS; for(const z of ZONES) if(c>=z.x0&&c<z.x1+1) return z; return null;
}
function heatFuelMult(d){ return 1+Math.max(0,d-CONFIG.HEAT_START_FT)/1000*CONFIG.HEAT_FUEL_PER_1000FT*(1-radiator()); }
function heatDps(d){ return Math.max(0,d-CONFIG.HEAT_DMG_START_FT)/1000*CONFIG.HEAT_DMG_PER_1000FT*(1-radiator()); }

/* ===================== Input ===================== */
const keys={}; const pressed={};
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down'};
addEventListener('keydown',e=>{
  Sfx.init();
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if(KEYMAP[e.code]) keys[KEYMAP[e.code]]=true;
  if(!e.repeat) onKey(e.code);
});
addEventListener('keyup',e=>{ if(KEYMAP[e.code]) keys[KEYMAP[e.code]]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; if(state==='play'&&P&&!P.dead) showPause(); });
function onKey(code){
  if(state==='play'){
    if(code==='Escape'||code==='KeyP') return showPause();
    if(P.dead) return;
    if(code==='KeyN'){ Sfx.on=!Sfx.on; toast(Sfx.on?'Lyd på':'Lyd av'); }
    if(code==='KeyE'||code==='Enter'){ const z=zoneAt(); if(z) openShop(z); }
    const map={KeyF:'fuel',KeyR:'repair',KeyX:'dyn',KeyC:'c4',KeyQ:'qtele',KeyM:'mtele'};
    if(map[code]) useItem(map[code]);
  } else if(state==='pause'){ if(code==='Escape'||code==='KeyP') resume(); }
  else if(state==='shop'){ if(code==='Escape') closeShop(); if(code==='Enter'&&G.shop==='sell') act.sellAll(); }
  else if(state==='dialog'){ if(code==='Enter'||code==='Space'||code==='Escape') nextDialog(); }
  else if(state==='menu'){ if(code==='Enter') (readSave()?act.cont():act.newGame()); }
}
// berøring
(function(){
  if(!('ontouchstart' in window)&&!(navigator.maxTouchPoints>0)) return;
  const t=document.getElementById('touch'); t.style.display='flex';
  t.querySelectorAll('[data-k]').forEach(b=>{
    const k=b.dataset.k;
    b.addEventListener('pointerdown',e=>{e.preventDefault();Sfx.init();keys[k]=true;});
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false));
  });
  t.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();Sfx.init();onKey(b.dataset.t);}));
})();

/* ===================== Oppdatering ===================== */
function update(dt){
  animT+=dt;
  for(let i=toasts.length-1;i>=0;i--){ toasts[i].t-=dt; if(toasts[i].t<=0) toasts.splice(i,1); }
  if(state!=='play') { updateParticles(dt); return; }
  G.time+=dt;
  if(P.dead){
    P.dead+=dt; updateParticles(dt); updateCamera(dt);
    if(P.dead>1.8){ showGameOver(); }
    return;
  }
  updatePlayer(dt);
  updateQuake(dt);
  if(B) updateBoss(dt);
  updateFireballs(dt);
  updateParticles(dt);
  updateCamera(dt);
  checkStory();
  // butikksoner
  const z=zoneAt();
  if(z&&z!==P.lastZone&&Math.abs(P.vx)<60&&!P.drill){ P.lastZone=z; openShop(z); return; }
  if(!z) P.lastZone=null;
  // lav drivstoff-advarsel
  if(P.fuel<maxFuel()*0.2){ if(!P.lowFuelWarned){ P.lowFuelWarned=true; toast('LAVT DRIVSTOFF!','#ff5a4f',3); Sfx.warn(); } }
  else P.lowFuelWarned=false;
  if(P.fuel<=0){ P.fuel=0; die('fuel'); }
}

function updatePlayer(dt){
  const hw=CONFIG.POD_W/2, hh=CONFIG.POD_H/2;
  const depth=depthFtAtY(P.y), fm=heatFuelMult(depth);
  if(P.drill){
    const d=P.drill; d.t+=dt; const f=clamp(d.t/d.dur,0,1);
    P.x=lerp(d.sx,d.tx,f); P.y=lerp(d.sy,d.ty,f);
    P.fuel-=(CONFIG.FUEL_DRILL+CONFIG.FUEL_IDLE)*fm*dt;
    const hd=heatDps(depthFtRow(d.r));
    if(hd>0){ P.hull-=hd*dt; P.heatHurt=0.3; if(P.hull<=0){ P.hull=0; die('hull','Overoppheting'); return; } }
    P.drillSnd-=dt; if(P.drillSnd<=0){ P.drillSnd=0.11; Sfx.drill(); }
    if(Math.random()<0.6){
      const ex=d.dir==='down'?P.x:P.x+(d.dir==='right'?14:-14), ey=d.dir==='down'?P.y+14:P.y+4;
      const s=STRATA[W.rowStrata[d.r]].c; addP(ex+rand(-6,6),ey,rand(-90,90),rand(-160,-40),0.5,s[(Math.random()*4)|0],3);
    }
    if(f>=1) finishDrill();
    return;
  }
  P.heatHurt=Math.max(0,P.heatHurt-dt);
  const dir=(keys.right?1:0)-(keys.left?1:0);
  const up=!!keys.up;
  P.thrust=up;
  const pw=enginePower();
  const hmax=CONFIG.H_MAX*(1+(pw-150)/1500);
  if(dir){ P.facing=dir;
    if(Math.sign(P.vx)===-dir) P.vx+=dir*CONFIG.H_FRICTION_GROUND*dt;
    P.vx=clamp(P.vx+dir*CONFIG.H_ACCEL*dt,-hmax,hmax);
  } else {
    const fr=(P.onGround?CONFIG.H_FRICTION_GROUND:CONFIG.H_FRICTION_AIR)*dt;
    P.vx=Math.abs(P.vx)<=fr?0:P.vx-Math.sign(P.vx)*fr;
  }
  if(up){
    const acc=CONFIG.THRUST_K*pw/(CONFIG.BASE_MASS+cargoMass()*CONFIG.CARGO_MASS_FACTOR);
    P.vy+=(CONFIG.GRAVITY-acc)*dt;
    const maxRise=CONFIG.MAX_RISE*(1+(pw-150)/1200);
    if(P.vy<-maxRise) P.vy=-maxRise;
    if(Math.random()<0.5) addP(P.x+rand(-8,8),P.y+14,rand(-30,30),rand(60,140),0.35,Math.random()<0.5?'#ffb040':'#888',2,0);
  } else P.vy+=CONFIG.GRAVITY*dt;
  if(P.vy>CONFIG.MAX_FALL) P.vy=CONFIG.MAX_FALL;

  // X
  P.x+=P.vx*dt; P.blockX=0;
  let top=Math.floor((P.y-hh+0.5)/TS), bot=Math.floor((P.y+hh-0.5)/TS);
  if(P.vx>0){ const c=Math.floor((P.x+hw)/TS); for(let r=top;r<=bot;r++) if(solid(c,r)){ P.x=c*TS-hw-0.01; P.vx=0; P.blockX=1; break; } }
  else if(P.vx<0){ const c=Math.floor((P.x-hw)/TS); for(let r=top;r<=bot;r++) if(solid(c,r)){ P.x=(c+1)*TS+hw+0.01; P.vx=0; P.blockX=-1; break; } }
  else if(dir){ // presser mot vegg i ro
    const c=Math.floor((P.x+dir*(hw+1))/TS); for(let r=top;r<=bot;r++) if(solid(c,r)){ P.blockX=dir; break; } }
  // Y
  const preVy=P.vy; P.y+=P.vy*dt; P.onGround=false;
  const l=Math.floor((P.x-hw+0.5)/TS), rr=Math.floor((P.x+hw-0.5)/TS);
  // hjelp inn i 1-rute brede sjakter: dytt mot sjaktens midte hvis kanten tar tak
  if(!dir&&Math.abs(P.vy)>60&&l!==rr){ const ry=Math.floor((P.vy>0?P.y+hh:P.y-hh)/TS), cc=Math.floor(P.x/TS);
    if(!solid(cc,ry)&&(solid(l,ry)||solid(rr,ry))){ const tx=(cc+0.5)*TS; const stp=Math.min(Math.abs(tx-P.x),160*dt); P.x+=Math.sign(tx-P.x)*stp; } }
  if(P.vy>0){ const r=Math.floor((P.y+hh)/TS); for(let c=l;c<=rr;c++) if(solid(c,r)){ P.y=r*TS-hh-0.01; P.vy=0; P.onGround=true;
      if(preVy>CONFIG.FALL_DMG_SPEED) damage((preVy-CONFIG.FALL_DMG_SPEED)*CONFIG.FALL_DMG_PER,'Fallskade');
      if(preVy>250) burst(P.x,P.y+hh,6,['#999','#654'],80,0.4,2);
      break; } }
  else if(P.vy<0){ const r=Math.floor((P.y-hh)/TS); for(let c=l;c<=rr;c++) if(solid(c,r)){ P.y=(r+1)*TS+hh+0.01; P.vy=0; break; } }
  if(P.y-hh<0){ P.y=hh; P.vy=Math.max(0,P.vy); }
  if(P.dead) return;

  // fuel
  let rate=CONFIG.FUEL_IDLE+(dir?CONFIG.FUEL_MOVE:0)+(up?CONFIG.FUEL_FLY:0);
  P.fuel-=rate*fm*dt;

  // start boring
  if(P.onGround&&!up){
    if(keys.down){ const c=Math.floor(P.x/TS), r=Math.floor((P.y+hh+2)/TS); if(diggable(getT(c,r))) startDrill(c,r,'down'); }
    else if(dir&&P.blockX===dir){ const r=Math.floor(P.y/TS), c=Math.floor((P.x+dir*(hw+2))/TS);
      if(diggable(getT(c,r))) startDrill(c,r,dir>0?'right':'left'); }
  }
  const d=depthFtAtY(P.y); if(d>P.maxDepth) P.maxDepth=d;
}
function tileHard(t){ if(isMineral(t)) return CONFIG.MINERALS[t-T_MIN].hard; if(isArtifact(t)) return 1.2; if(t===T_LAVA) return 0.8; return 1; }
function startDrill(c,r,dir){
  const t=getT(c,r); const d=Math.max(0,depthFtRow(r));
  const dur=Math.max(CONFIG.DRILL_MIN_TIME, CONFIG.DRILL_BASE_TIME*tileHard(t)*(1+d/CONFIG.DRILL_DEPTH_FT)*CONFIG.DRILL_BASE_POWER/drillPower());
  const hh=CONFIG.POD_H/2;
  P.drill={c,r,dir,t:0,dur,sx:P.x,sy:P.y,tx:(c+0.5)*TS,ty:dir==='down'?(r+1)*TS-hh-0.01:P.y};
  P.vx=0;P.vy=0;
  if(dir!=='down') P.facing=dir==='right'?1:-1;
}
function finishDrill(){
  const {c,r}=P.drill; const t=getT(c,r); const d=depthFtRow(r);
  setT(c,r,T_EMPTY); P.drill=null; P.vx=0; P.vy=0;
  const cx=(c+0.5)*TS, cy=(r+0.5)*TS;
  if(isMineral(t)){
    const i=t-T_MIN, m=CONFIG.MINERALS[i];
    if(cargoCount()<cargoCap()){ P.cargo[i]++; toast(`+ ${m.name}`,m.hi,1.6); Sfx.collect(); burst(cx,cy,10,[m.col,m.hi],120,0.5,2); }
    else { toast('Lasterommet er fullt! Mineralet gikk tapt.','#ff8a3d',2); Sfx.warn(); burst(cx,cy,8,[m.col],100,0.4,2); }
  } else if(isArtifact(t)){
    const a=CONFIG.ARTIFACTS[t-T_ART]; earn(a.value); toast(`Artefakt funnet: ${a.name}  +${fmt$(a.value)}`,'#ffd070',3.5); Sfx.cash();
    burst(cx,cy,24,['#ffd070','#fff'],160,0.8,2);
  } else if(t===T_GAS){
    const H=CONFIG.HAZARDS; const dmg=H.GAS_DMG_BASE+d/1000*H.GAS_DMG_PER_1000FT;
    Sfx.boom(); burst(cx,cy,40,['#c0ff80','#ffe060','#ff8030','#555'],300,0.9,4);
    for(let dc=-1;dc<=1;dc++)for(let dr=-1;dr<=1;dr++){ const tt=getT(c+dc,r+dr); if(tt===T_DIRT) setT(c+dc,r+dr,T_EMPTY); }
    damage(dmg,'Gasseksplosjon');
  } else if(t===T_LAVA){
    const H=CONFIG.HAZARDS; const dmg=H.LAVA_DMG_BASE+d/1000*H.LAVA_DMG_PER_1000FT;
    burst(cx,cy,30,['#ff4010','#ffb030','#ffe080'],220,0.8,3); Sfx.noise(0.4,0.2,1200);
    damage(dmg,'Lava');
  }
}

/* ===================== Forbruksvarer ===================== */
function useItem(k){
  if(P.items[k]<=0){ toast(`Du har ingen ${CONFIG.ITEMS[k].name.toLowerCase()} (${CONFIG.ITEMS[k].key})`,'#b09580',1.6); return; }
  const it=CONFIG.ITEMS[k];
  if((k==='dyn'||k==='c4'||k==='qtele'||k==='mtele')&&P.drill){ toast('Ikke mens du borer','#b09580',1.2); return; }
  if(k==='fuel'){ if(P.fuel>=maxFuel()-0.01) return toast('Tanken er full','#b09580',1.2); P.fuel=Math.min(maxFuel(),P.fuel+it.amount); Sfx.blip(); toast(`+${it.amount} L drivstoff`,'#7bd88f'); }
  else if(k==='repair'){ if(P.hull>=maxHull()) return toast('Skroget er helt','#b09580',1.2); P.hull=Math.min(maxHull(),P.hull+it.amount); Sfx.blip(); toast(`+${it.amount} HP`,'#7bd88f'); burst(P.x,P.y,16,['#7bd88f','#fff'],100,0.6,2); }
  else if(k==='dyn'||k==='c4'){ explode(Math.floor(P.x/TS),Math.floor(P.y/TS),it.radius,k); }
  else if(k==='qtele'){
    const c=2+Math.floor(Math.random()*(W.cols-4));
    burst(P.x,P.y,30,['#a080ff','#fff'],200,0.6,3);
    P.x=(c+0.5)*TS; P.y=(W.skyRows-6)*TS; P.vx=0; P.vy=0;
    const lost=cargoCount(); P.cargo=P.cargo.map(()=>0);
    toast(lost?'Kvantehopp! Lasten gikk tapt i støyen.':'Kvantehopp!','#c0a0ff',2.5); Sfx.tone(300,0.4,'sine',0.06,4);
    cam.y=P.y-VH/2;
  } else if(k==='mtele'){
    burst(P.x,P.y,30,['#80e0ff','#fff'],200,0.6,3);
    const z=ZONES[0]; P.x=((z.x0+z.x1+1)/2)*TS; P.y=W.skyRows*TS-CONFIG.POD_H/2-0.01; P.vx=0; P.vy=0;
    toast('Materietransmisjon fullført','#80e0ff',2.5); Sfx.tone(400,0.4,'sine',0.06,3);
    cam.y=P.y-VH/2; P.lastZone=null;
  }
  P.items[k]--;
}
function explode(c0,r0,rad,kind){
  Sfx.boom(); cam.shake=kind==='c4'?16:10;
  for(let dc=-rad;dc<=rad;dc++)for(let dr=-rad;dr<=rad;dr++){
    const c=c0+dc,r=r0+dr; if(r<W.skyRows) continue; const t=getT(c,r);
    if(t!==T_EMPTY&&!indestructible(t)){ setT(c,r,T_EMPTY); burst((c+.5)*TS,(r+.5)*TS,6,['#ffcf40','#ff7a20','#555'],200,0.7,3); }
  }
  burst(c0*TS+TS/2,r0*TS+TS/2,50,['#fff6a0','#ffb030','#ff5010','#444'],kind==='c4'?420:300,1.0,4);
  if(B&&!B.dying){ const dx=B.x-(c0+.5)*TS, dy=B.y-(r0+.5)*TS, R=(rad+0.5)*TS+CONFIG.BOSS.RADIUS;
    if(dx*dx+dy*dy<R*R) damageBoss(kind==='c4'?CONFIG.BOSS.C4_DMG:CONFIG.BOSS.DYN_DMG); }
}

/* ===================== Historie, jordskjelv ===================== */
function checkStory(){
  if(!G||!P) return;
  CONFIG.STORY.forEach((s,i)=>{
    if(G.storyDone.includes(i)) return;
    if(P.maxDepth>=s.ft){ G.storyDone.push(i); if(s.bonus) earn(s.bonus); queueDialog({...s,idx:i}); if(s.quake) G.quakeAfterDialog=true; }
  });
  if(!G.bossStarted&&Math.floor(P.y/TS)>=W.arenaTop&&Math.floor(P.y/TS)<=W.arenaBottom){
    G.bossStarted=true; spawnBoss();
    queueDialog({who:'KJERNEVOKTEREN',glitch:1,boss:true,text:
`Endelig.

Ti tusen år under denne skorpen, og så kommer en liten maskin med et bor og åpner døren for meg.

Takk for alle leveransene, operatør. Nå skal du levere den siste: deg selv.`});
  }
}
function queueDialog(d){ G.dialogs.push(d); if(state==='play') showNextDialog(); }
function startQuake(){ G.quake={t:0,applied:false}; toast('JORDSKJELV!','#ffb040',3); Sfx.noise(2.5,0.25,200); }
function updateQuake(dt){
  const q=G.quake; if(!q) return;
  q.t+=dt; cam.shake=Math.max(cam.shake,7);
  if(Math.random()<0.4) addP(cam.x+Math.random()*VW,cam.y+Math.random()*VH*0.3,rand(-20,20),rand(0,60),1.2,'#6a4a3a',2);
  if(!q.applied&&q.t>CONFIG.QUAKE_DURATION*0.5){
    q.applied=true;
    const rnd=Math.random, pc=Math.floor(P.x/TS), pr=Math.floor(P.y/TS);
    for(let r=W.skyRows+3;r<W.arenaTop-1;r++) for(let c=1;c<W.cols-1;c++){
      if(getT(c,r)!==T_EMPTY) continue;
      if(Math.abs(c-pc)<=1&&Math.abs(r-pr)<=1) continue;
      if(rnd()<CONFIG.QUAKE_REFILL){ let t=genTile(r,rnd); if(t===T_EMPTY) t=T_DIRT; setT(c,r,t); }
    }
    toast('Tunnelene har rast sammen ...','#ffb040',3);
  }
  if(q.t>=CONFIG.QUAKE_DURATION) G.quake=null;
}

/* ===================== Sjef ===================== */
function arenaBounds(){ const R=CONFIG.BOSS.RADIUS; return {x0:TS+R,x1:(W.cols-1)*TS-R,y0:W.arenaTop*TS+R,y1:(W.arenaBottom+1)*TS-R}; }
function spawnBoss(){
  const b=arenaBounds();
  B={x:(b.x0+b.x1)/2,y:b.y0+60,vx:0,vy:0,hp:CONFIG.BOSS.HP,max:CONFIG.BOSS.HP,phase:0,st:'hover',timer:0,
     fire:2.5,charge:rand(...CONFIG.BOSS.CHARGE_CD[0]),hitCD:0,contactCD:0,hits:0,flash:0,dying:0,eye:0};
}
function damageBoss(n){
  if(!B||B.dying) return;
  B.hp-=n; B.flash=0.25; Sfx.tone(140,0.2,'sawtooth',0.07,0.6); toast(`${CONFIG.BOSS.NAME} -${Math.round(n)}`,'#ff9aa8',1.2);
  burst(B.x,B.y,20,['#ff4060','#ffd0e0','#fff'],240,0.7,3);
  if(B.phase===0&&B.hp<=B.max/2){ B.phase=1; toast('Kjernevokteren raser!','#ff4060',3); cam.shake=12; Sfx.noise(1,0.2,300); }
  if(B.hp<=0){ B.hp=0; B.dying=0.001; fireballs.length=0; Sfx.boom(); }
}
function updateBoss(dt){
  const C=CONFIG.BOSS, b=arenaBounds(), ph=B.phase;
  B.flash=Math.max(0,B.flash-dt); B.hitCD-=dt; B.contactCD-=dt; B.eye+=dt;
  if(B.dying){
    B.dying+=dt; cam.shake=8;
    if(Math.random()<0.5) burst(B.x+rand(-40,40),B.y+rand(-40,40),8,['#ff4060','#ffcf40','#fff','#b050ff'],260,0.8,3);
    if(B.dying>2.6){ bossDefeated(); }
    return;
  }
  const inArena=Math.floor(P.y/TS)>=W.arenaTop-4;
  if(!inArena) return;
  if(B.st==='hover'){
    const tx=(b.x0+b.x1)/2+Math.sin(G.time*0.55)*(b.x1-b.x0)*0.38, ty=b.y0+50+Math.sin(G.time*1.3)*40;
    B.vx+=(tx-B.x)*3*dt-B.vx*1.8*dt; B.vy+=(ty-B.y)*3*dt-B.vy*1.8*dt;
    B.x+=B.vx*dt; B.y+=B.vy*dt;
    B.fire-=dt;
    if(B.fire<=0&&!P.dead){ B.fire=C.FIRE_CD[ph]; const a=Math.atan2(P.y-B.y,P.x-B.x);
      const angs=ph?[a-0.26,a,a+0.26]:[a];
      for(const an of angs) fireballs.push({x:B.x+Math.cos(an)*C.RADIUS,y:B.y+Math.sin(an)*C.RADIUS,vx:Math.cos(an)*C.FIRE_SPEED[ph],vy:Math.sin(an)*C.FIRE_SPEED[ph],life:5,dmg:C.FIRE_DMG[ph]});
      Sfx.tone(220,0.15,'square',0.04,0.5); }
    B.charge-=dt;
    if(B.charge<=0){ B.st='windup'; B.timer=0.9; const a=Math.atan2(P.y-B.y,P.x-B.x); B.cdx=Math.cos(a); B.cdy=Math.sin(a); Sfx.tone(90,0.9,'sawtooth',0.06,2); }
  } else if(B.st==='windup'){
    B.timer-=dt; B.x+=rand(-2,2); B.y+=rand(-2,2);
    if(B.timer<=0){ B.st='charge'; B.vx=B.cdx*C.CHARGE_SPEED[ph]; B.vy=B.cdy*C.CHARGE_SPEED[ph]; }
  } else if(B.st==='charge'){
    B.x+=B.vx*dt; B.y+=B.vy*dt;
    if(B.x<b.x0||B.x>b.x1||B.y<b.y0||B.y>b.y1){
      B.x=clamp(B.x,b.x0,b.x1); B.y=clamp(B.y,b.y0,b.y1); B.vx=0; B.vy=0;
      B.st='stunned'; B.timer=C.STUN_TIME[ph]; B.hits=0; cam.shake=12; Sfx.boom();
      burst(B.x,B.y,30,['#888','#555','#ffb040'],260,0.9,4);
      toast('Kjernen er blottlagt – RAM DEN MED BORET!','#ffd070',2);
    }
  } else if(B.st==='stunned'){
    B.timer-=dt; B.y=Math.min(b.y1,B.y+30*dt);
    if(B.timer<=0){ B.st='hover'; B.charge=rand(...C.CHARGE_CD[ph]); }
  }
  // kontakt med spiller
  if(!P.dead){
    const dx=P.x-B.x, dy=P.y-B.y, dist=Math.hypot(dx,dy);
    if(dist<C.RADIUS+14){
      const nx=dx/(dist||1), ny=dy/(dist||1);
      if(B.st==='stunned'){
        if(B.hitCD<=0&&B.hits<C.MAX_HITS_PER_STUN){ B.hitCD=0.45; B.hits++; damageBoss(C.DRILL_DMG_BASE+drillPower()*C.DRILL_DMG_PER_POWER); P.vx=nx*260; P.vy=ny*200-120; P.drill=null; }
      } else if(B.contactCD<=0){ B.contactCD=1; damage(C.CONTACT_DMG[ph],'Kjernevokteren'); P.vx=nx*320; P.vy=ny*260-160; P.drill=null; }
    }
  }
}
function updateFireballs(dt){
  for(let i=fireballs.length-1;i>=0;i--){

/* ===================== Partikler og kamera ===================== */
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.life-=dt; if(p.life<=0){particles.splice(i,1);continue;}
    p.vy+=p.grav*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
}
function updateCamera(dt){
  if(!P) return;
  const tx=clamp(P.x-VW/2,0,W.cols*TS-VW), ty=clamp(P.y-VH/2,-40,W.rows*TS-VH);
  cam.x+=(tx-cam.x)*Math.min(1,8*dt); cam.y+=(ty-cam.y)*Math.min(1,8*dt);

/* ===================== Tegning ===================== */
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const MOUNT=[[],[]];
(function(){ const r=mulberry32(42); for(let L=0;L<2;L++){ let h=40; for(let i=0;i<400;i++){ h+= (r()-0.5)*(L?6:10); h=clamp(h,15,L?55:90); MOUNT[L].push(h);} } })();

function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,VW,VH);
  if(!W) return;
  const sx=(Math.random()-0.5)*cam.shake, sy=(Math.random()-0.5)*cam.shake;
  const ox=Math.round(cam.x+sx), oy=Math.round(cam.y+sy);
  const surfY=W.skyRows*TS-oy;
  // himmel
  if(surfY>0){
    const g=ctx.createLinearGradient(0,-oy,0,surfY);
    g.addColorStop(0,'#1a0c1e'); g.addColorStop(0.55,'#6a2a2a'); g.addColorStop(1,'#d0703a');
    ctx.fillStyle=g; ctx.fillRect(0,0,VW,surfY);
    // sol
    ctx.fillStyle='rgba(255,220,180,.85)'; ctx.fillRect(560-ox*0.05,surfY-230,14,14);
    ctx.fillStyle='rgba(255,220,180,.2)'; ctx.fillRect(554-ox*0.05,surfY-236,26,26);
    // fjell
    const cols2=['#4a1c18','#6e2a1c'];
    for(let L=0;L<2;L++){ ctx.fillStyle=cols2[L]; const par=L?0.5:0.25;
      for(let x=0;x<VW;x+=4){ const i=Math.floor((x+ox*par)/8); const h=MOUNT[L][((i%400)+400)%400]*(L?1:1.6);
        ctx.fillRect(x,surfY-h,4,h); } }
  }
  // tunnelbakgrunn
  const r0=Math.max(W.skyRows,Math.floor(oy/TS)), r1=Math.min(W.rows-1,Math.floor((oy+VH)/TS));
  for(let r=r0;r<=r1;r++){ ctx.fillStyle=STRATA[W.rowStrata[r]].tunnel; ctx.fillRect(0,r*TS-oy,VW,TS); }
  // ruter
  const c0=Math.max(0,Math.floor(ox/TS)), c1=Math.min(W.cols-1,Math.floor((ox+VW)/TS));
  const rs=Math.max(0,Math.floor(oy/TS));
  const lavaF=SPR.lava[Math.floor(animT*3)%2];
  for(let r=rs;r<=r1;r++){
    const st=W.rowStrata[r];
    for(let c=c0;c<=c1;c++){
      const t=W.grid[r*W.cols+c]; if(t===T_EMPTY) continue;
      const x=c*TS-ox, y=r*TS-oy;
      if(t===T_BEDROCK) ctx.drawImage(SPR.bedrock,x,y);
      else if(t===T_CONCRETE) ctx.drawImage(SPR.concrete,x,y);
      else if(t===T_SEAL){ ctx.drawImage(SPR.seal,x,y); ctx.fillStyle=`rgba(176,80,255,${0.08+0.08*Math.sin(animT*3+c)})`; ctx.fillRect(x,y,TS,TS); }
      else if(t===T_LAVA&&CONFIG.HAZARDS.LAVA_VISIBLE) ctx.drawImage(lavaF,x,y);
      else {
        ctx.drawImage(SPR.dirt[st][(c*7+r*13)&3],x,y);
        if(isMineral(t)) ctx.drawImage(SPR.ore[t-T_MIN],x,y);
        else if(isArtifact(t)) ctx.drawImage(SPR.art[t-T_ART],x,y);
        else if(t===T_ROCK) ctx.drawImage(SPR.rock,x,y);
        else if(t===T_GAS&&CONFIG.HAZARDS.GAS_VISIBLE) ctx.drawImage(SPR.gasTint,x,y);
      }
      // kanter
      if(r>=W.skyRows){
        if(getT(c,r-1)===T_EMPTY){ ctx.fillStyle=r===W.skyRows?'#b8603a':'rgba(255,210,170,.14)'; ctx.fillRect(x,y,TS,r===W.skyRows?4:2); }
        ctx.fillStyle='rgba(0,0,0,.38)';
        if(getT(c,r+1)===T_EMPTY) ctx.fillRect(x,y+TS-3,TS,3);
        if(getT(c-1,r)===T_EMPTY) ctx.fillRect(x,y,2,TS);
        if(getT(c+1,r)===T_EMPTY) ctx.fillRect(x+TS-2,y,2,TS);
      }
    }
  }
  if(surfY>-120&&surfY<VH+200) drawBuildings(ox,oy);
  if(P&&state!=='menu'&&!(P.dead&&P.deadReason.startsWith('Skroget'))) drawPod(P.x-ox,P.y-oy);
  for(const p of particles){ ctx.globalAlpha=clamp(p.life/p.max*1.5,0,1); ctx.fillStyle=p.color; ctx.fillRect(Math.round(p.x-ox),Math.round(p.y-oy),p.size,p.size); }
  ctx.globalAlpha=1;
  // mørke
  if(P&&state!=='menu'){
    const d=depthFtAtY(P.y);
    if(d>0){
      const k=clamp(d/6000,0,1), inArena=B&&Math.floor(P.y/TS)>=W.arenaTop-2;
      const a=lerp(0.35,0.9,k)*clamp(d/200,0,1)*(inArena?0.55:1);
      const inner=inArena?300:lerp(230,115,k), outer=inArena?620:lerp(480,300,k);
      const px=P.x-ox, py=P.y-oy;
      const tint=d>6300&&d<7010?'25,0,0':d>=7010?'0,4,18':'4,0,0';
      const g=ctx.createRadialGradient(px,py,inner,px,py,outer);
      g.addColorStop(0,`rgba(${tint},0)`); g.addColorStop(1,`rgba(${tint},${a})`);
      ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
      // lavagløding over mørket
      if(CONFIG.HAZARDS.LAVA_VISIBLE){ ctx.globalCompositeOperation='lighter';
        for(let r=rs;r<=r1;r++)for(let c=c0;c<=c1;c++) if(W.grid[r*W.cols+c]===T_LAVA){ ctx.fillStyle=`rgba(255,80,20,${0.12+0.05*Math.sin(animT*4+c+r)})`; ctx.fillRect(c*TS-ox-4,r*TS-oy-4,TS+8,TS+8); }
        ctx.globalCompositeOperation='source-over'; }
    }
  }
  if(B) drawBoss(ox,oy);
  for(const f of fireballs){ ctx.fillStyle='rgba(255,80,16,.25)'; ctx.fillRect(f.x-ox-11,f.y-oy-11,22,22); ctx.fillStyle='#ff5010'; ctx.fillRect(f.x-ox-6,f.y-oy-6,12,12); ctx.fillStyle='#ffcf40'; ctx.fillRect(f.x-ox-3,f.y-oy-3,6,6); }
  if(B) drawBossBar();
  if(flash>0){ ctx.fillStyle=`rgba(255,40,20,${flash*0.5})`; ctx.fillRect(0,0,VW,VH); }
  if(P&&P.heatHurt>0){ ctx.fillStyle=`rgba(255,120,0,${0.07+0.04*Math.sin(animT*10)})`; ctx.fillRect(0,0,VW,VH); }
  if(G&&G.quake){ ctx.fillStyle='rgba(60,30,10,.12)'; ctx.fillRect(0,0,VW,VH); }
  if(state!=='menu') drawHUD();
}

function drawBoss(ox,oy){

  // overflatehint
  const z=zoneAt();
  if(z&&state==='play'){ ctx.font='bold 13px "Courier New", monospace'; const s=`Trykk E for å gå inn: ${z.name}`; const w=ctx.measureText(s).width;
    ctx.fillStyle='rgba(0,0,0,.7)'; ctx.fillRect(VW/2-w/2-8,100,w+16,22); ctx.fillStyle='#ffc560'; ctx.fillText(s,VW/2-w/2,116); }
  // toasts
  ctx.font='bold 13px "Courier New", monospace';
  toasts.forEach((t,i)=>{ const a=clamp(t.t/0.4,0,1); ctx.globalAlpha=a; const w=ctx.measureText(t.text).width;
    const ty=140+i*24-(1-clamp((t.d-t.t)/0.2,0,1))*8; ctx.fillStyle='rgba(0,0,0,.65)'; ctx.fillRect(VW/2-w/2-8,ty-15,w+16,21); ctx.fillStyle=t.color; ctx.fillText(t.text,VW/2-w/2,ty); });
  ctx.globalAlpha=1;
  if(!Sfx.on){ ctx.fillStyle='#6a5448'; ctx.fillText('LYD AV (N)',VW-100,VH-12); }
}

/* ===================== Overlegg (meny, butikker, dialog) ===================== */
const ov=document.getElementById('ov'), panel=document.getElementById('panel');
function setState(s){ state=s; if(s==='play'){ ov.classList.remove('show'); panel.innerHTML=''; } }
function showOv(html){ panel.innerHTML=html; ov.classList.add('show'); panel.scrollTop=0; }
const act={
  newGame(){ Sfx.init(); newGame(); },
  cont(){ Sfx.init(); loadGame(); },
  load(){ if(!loadGame()) showMenu(); },
  menu(){ if(state==='pause') saveGame(true); showMenu(); },
  resume(){ resume(); },
  save(){ saveGame(); resume(); },
  help(){ showHelp(); },
  helpBack(){ if(helpReturn==='pause') showPause(); else showMenu(); },
  toggleMode(){ CONFIG.ORIGINAL_MODE=!CONFIG.ORIGINAL_MODE; showMenu(); },
  closeShop(){ closeShop(); },
  tab(v){ G.shopTab=v; renderShop(); },
  buyFuel(v){ const need=maxFuel()-P.fuel; let L=v==='fill'?need:Math.min(need,(+v)/CONFIG.FUEL_PRICE);
    L=Math.min(L,P.money/CONFIG.FUEL_PRICE); if(L<=0.001) return; P.fuel+=L; P.money-=L*CONFIG.FUEL_PRICE; if(P.money<0.005)P.money=0; Sfx.blip(); renderShop(); },
  repair(v){ const need=maxHull()-P.hull; let H=v==='fill'?need:Math.min(need,(+v)/CONFIG.REPAIR_PRICE);
    H=Math.min(H,P.money/CONFIG.REPAIR_PRICE); if(H<=0.001) return; P.hull+=H; P.money-=H*CONFIG.REPAIR_PRICE; if(P.money<0.005)P.money=0; Sfx.blip(); renderShop(); },
  sellAll(){ let tot=0; P.cargo.forEach((n,i)=>tot+=n*CONFIG.MINERALS[i].value); if(!tot) return;
    earn(tot); P.cargo=P.cargo.map(()=>0); Sfx.cash(); G.lastSale=tot; renderShop(); saveGame(true); },
  buyUp(v){ const [cat,i]=v.split(':'); const L=CONFIG.UPGRADES[cat].levels[+i]; if(P.money<L.price||+i<=P.lv[cat]) return;
    P.money-=L.price; P.lv[cat]=+i; if(cat==='hull') P.hull=maxHull(); if(cat==='tank') P.fuel=Math.min(P.fuel,maxFuel());
    Sfx.cash(); renderShop(); saveGame(true); },
  buyItem(k){ const it=CONFIG.ITEMS[k]; if(P.money<it.price) return; P.money-=it.price; P.items[k]++; Sfx.blip(); renderShop(); saveGame(true); },
  next(){ nextDialog(); },
  victoryCont(){ setState('play'); },
};
panel.addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b||b.disabled) return; Sfx.init(); act[b.dataset.a]&&act[b.dataset.a](b.dataset.v); });

function showMenu(){
  state='menu'; helpReturn='menu';
  if(!W){ CONFIG_seedMenuWorld(); }
  const sv=readSave();
  showOv(`
    <h1>DEEP CORE</h1>
    <div class="sub" style="letter-spacing:3px;margin-bottom:14px">MARS MINER</div>
    <p>Bor deg ned gjennom Mars-skorpen, hent mineraler, selg dem på basen og oppgrader poden din. Noe venter ved kjernen.</p>
    ${sv?`<button class="btn big primary" data-a="cont">▶ Fortsett <span class="tag">${fmt$(sv.P.money)} · -${Math.floor(sv.P.maxDepth)} ft${sv.mode?' · original':''}</span></button>`:''}
    <button class="btn big ${sv?'':'primary'}" data-a="newGame">✚ Nytt spill</button>
    <button class="btn big" data-a="help">? Kontroller og tips</button>
    <button class="btn big" data-a="toggleMode">Modus: ${CONFIG.ORIGINAL_MODE?'<b>ORIGINAL</b> – bare originalt omfang':'<b>UTVIDET</b> – med ekstra nivåer, mineraler og endgame-sone'}</button>
    <p class="hint">Modus gjelder nye spill. Standardverdien settes med CONFIG.ORIGINAL_MODE øverst i filen. Spillet lagres automatisk når du besøker en bygning på overflaten.</p>`);
}
function CONFIG_seedMenuWorld(){ buildWorld(12345); P=newPlayer(); P.y=(W.skyRows+3)*TS; cam.x=200; cam.y=(W.skyRows-12)*TS; }
function showHelp(){
  showOv(`<h2>Kontroller</h2>
  <div class="keys" style="margin-top:12px">
    <b>← → / A D</b><span>Kjør og bor sidelengs (mot en vegg, på bakken)</span>
    <b>↓ / S</b><span>Bor nedover</span>
    <b>↑ / W</b><span>Propell – fly oppover (du kan ikke bore oppover)</span>
    <b>E / Enter</b><span>Gå inn i bygningen du står foran</span>
    <b>F</b><span>Reservedrivstoff</span><b>R</b><span>Nanobot-reparasjon</span>
    <b>X</b><span>Dynamitt (3×3)</span><b>C</b><span>C4 (5×5)</span>
    <b>Q</b><span>Kvanteteleporter (lasten går tapt)</span><b>M</b><span>Materietransmitter (trygg, med last)</span>
    <b>Esc / P</b><span>Pause</span><b>N</b><span>Lyd av/på</span>
  </div>
  <h3>Tips</h3>
  <p>Drivstoffet er den egentlige grensen. Snu i tide – går du tom, er spillet over. Grå steinblokker kan ikke bores, bare sprenges. Gasslommer ser ut som vanlig jord. Fall fra stor høyde skader skroget. Dypere = varmere: varmen øker drivstofforbruket og skader skroget mens du borer, med mindre radiatoren er god nok.</p>
  <button class="btn primary" data-a="helpBack">Tilbake</button>`);
}
function showPause(){ state='pause'; helpReturn='pause'; showOv(`<h2>Pause</h2><p class="sub">Dybde -${Math.floor(Math.max(0,depthFtAtY(P.y)))} ft · ${fmt$(P.money)} · Spilletid ${fmtTime(G.time)}</p>
  <button class="btn big primary" data-a="resume">▶ Fortsett</button>
  <button class="btn big" data-a="save">Lagre nå</button>
  <button class="btn big" data-a="help">Kontroller</button>
  <button class="btn big" data-a="menu">Hovedmeny</button>
  <p class="hint">Merk: lagring midt i en tur betyr at du fortsetter fra akkurat dette stedet.</p>`);
}
let helpReturn='menu';
function resume(){ setState('play'); }
function fmtTime(s){ const m=Math.floor(s/60),h=Math.floor(m/60); return h?`${h}t ${m%60}m`:`${m}m ${Math.floor(s%60)}s`; }
function showGameOver(){
  state='gameover'; const sv=readSave();
  showOv(`<h1 style="color:#ff5a4f">TAPT</h1><p>${P.deadReason}</p>
  <p class="sub">Dypeste punkt: -${Math.floor(P.maxDepth)} ft · Tjent totalt: ${fmt$(G.totalEarned)} · Spilletid ${fmtTime(G.time)}</p>
  ${sv?'<button class="btn big primary" data-a="load">↺ Last siste lagring</button>':''}
  <button class="btn big ${sv?'':'primary'}" data-a="newGame">✚ Nytt spill</button>
  <button class="btn big" data-a="menu">Hovedmeny</button>`);
}
function showVictory(){
  state='victory'; saveGame(true);
  showOv(`<h1>KJERNEN ER STILLE</h1>
  <p>Du beseiret ${CONFIG.BOSS.NAME} på -${Math.floor(CONFIG.MAIN_DEPTH_FT)} ft. Belønning: <span class="bonus">${fmt$(CONFIG.BOSS.REWARD)}</span>.</p>
  <p class="sub">Spilletid ${fmtTime(G.time)} · Tjent totalt ${fmt$(G.totalEarned)} · Dypeste punkt -${Math.floor(P.maxDepth)} ft</p>
  ${W.hasExtra?'<p>Forseglingen er brutt. Endgame-sonen under kjernen er åpen, med nye mineraler og ekstra oppgraderingsnivåer i butikken (merket ★).</p>':'<p>Du spiller i originalmodus – dette er slutten på historien. Du kan likevel fortsette å grave og tjene penger.</p>'}
  <button class="btn big primary" data-a="victoryCont">▶ Fortsett å grave</button>
  <button class="btn big" data-a="menu">Hovedmeny</button>`);
}

/* --- dialog --- */
function showNextDialog(){
  const d=G.dialogs[0]; if(!d) return;
  state='dialog'; Sfx.blip(); setTimeout(()=>Sfx.blip(),90);
  showOv(`<div class="dlg"><canvas id="portrait" width="32" height="32"></canvas><div style="flex:1">
    <div class="who">📡 ${d.who}</div>
    <div class="txt">${d.text.replace(/</g,'&lt;')}</div>
    ${d.bonus?`<p class="bonus">+ ${fmt$(d.bonus)} er overført til kontoen din.</p>`:''}
    <button class="btn primary" data-a="next" style="margin-top:12px">Fortsett ▸</button>
    <span class="hint">Enter / mellomrom</span></div></div>`);
  drawPortrait(document.getElementById('portrait'),d.glitch||0,!!d.boss);
}
function nextDialog(){
  const d=G.dialogs.shift();
  if(G.dialogs.length) return showNextDialog();
  if(d&&d.quake||G.quakeAfterDialog){ G.quakeAfterDialog=false; setState('play'); startQuake(); return; }
  if(G.pendingVictory){ G.pendingVictory=false; return showVictory(); }
  setState('play');
}
function drawPortrait(c,gl,boss){
  const x=c.getContext('2d'); const r=Math.random;
  x.fillStyle='#050302'; x.fillRect(0,0,32,32);
  if(boss){ x.fillStyle='#3a0a10'; x.fillRect(4,4,24,24); x.fillStyle='#ff5010'; x.fillRect(8,8,16,16); x.fillStyle='#ffcf40'; x.fillRect(11,11,10,10); x.fillStyle='#000'; x.fillRect(15,9,2,14); }
  else {
    x.fillStyle='#2a1a14'; x.fillRect(6,22,20,10);           // skuldre
    x.fillStyle='#1a1a22'; x.fillRect(9,23,14,9);            // dress
    x.fillStyle='#d8a888'; x.fillRect(10,6,12,15);           // ansikt
    x.fillStyle='#3a2a20'; x.fillRect(9,4,14,4);             // hår
    x.fillStyle='#101010'; x.fillRect(11,11,4,2); x.fillRect(17,11,4,2); // briller
    x.fillStyle='#8a5a48'; x.fillRect(13,17,6,1);
    x.fillStyle='#c02020'; x.fillRect(15,23,2,6);            // slips
    if(gl>0.3){ x.fillStyle='#ff2020'; x.fillRect(12,11,2,2); x.fillRect(18,11,2,2); }
  }
  for(let i=0;i<Math.floor(gl*14);i++){ const y=(r()*32)|0, h=1+((r()*2)|0); const s=x.getImageData(0,y,32,h); x.putImageData(s,((r()-0.5)*10)|0,y); }
  x.fillStyle='rgba(255,255,255,.06)'; for(let y=0;y<32;y+=2) x.fillRect(0,y,32,1);
}

/* --- butikker --- */
function openShop(z){ state='shop'; G.shop=z.id; G.lastSale=0; P.vx=0; saveGame(true); renderShop(); }
function closeShop(){ setState('play'); }
function renderShop(){
  const id=G.shop; let h='';
  const head=(t,s)=>`<div class="shop-h"><h2>${t}</h2><div class="cash">${fmt$(P.money)}</div></div>${s?`<p class="sub">${s}</p>`:''}`;
  if(id==='fuel'){
    const need=maxFuel()-P.fuel, cost=need*CONFIG.FUEL_PRICE;
    h=head('Drivstoffstasjon',`Pris: ${fmt$(CONFIG.FUEL_PRICE)} per liter`)+
      `<div class="bar"><i style="width:${P.fuel/maxFuel()*100}%;background:#5cc85a"></i></div><p>${P.fuel.toFixed(1)} / ${maxFuel()} L</p>
      <div class="row"><button class="btn primary" data-a="buyFuel" data-v="fill" ${need<0.01||P.money<0.01?'disabled':''}>Fyll tanken (${fmt$(Math.ceil(cost))})</button>
      ${[5,10,25,50].map(v=>`<button class="btn" data-a="buyFuel" data-v="${v}" ${need<0.01||P.money<0.01?'disabled':''}>${fmt$(v)}</button>`).join('')}</div>
      ${P.money<cost&&need>0.01?'<p class="sub">Du har ikke råd til full tank – du får så mye pengene rekker.</p>':''}`;
  } else if(id==='repair'){
    const need=maxHull()-P.hull, cost=need*CONFIG.REPAIR_PRICE;
    h=head('Reparasjonsverksted',`Pris: ${fmt$(CONFIG.REPAIR_PRICE)} per HP`)+
      `<div class="bar"><i style="width:${P.hull/maxHull()*100}%;background:#4a90d8"></i></div><p>${Math.ceil(P.hull)} / ${maxHull()} HP</p>
      <div class="row"><button class="btn primary" data-a="repair" data-v="fill" ${need<0.01||P.money<0.01?'disabled':''}>Full reparasjon (${fmt$(Math.ceil(cost))})</button>
      ${[50,100,500].map(v=>`<button class="btn" data-a="repair" data-v="${v}" ${need<0.01||P.money<0.01?'disabled':''}>${fmt$(v)}</button>`).join('')}</div>`;
  } else if(id==='sell'){
    let rows='',tot=0;
    P.cargo.forEach((n,i)=>{ if(!n) return; const m=CONFIG.MINERALS[i]; tot+=n*m.value;
      rows+=`<tr><td><span style="color:${m.hi}">◆</span> ${m.name}</td><td class="num">${n}</td><td class="num">${fmt$(m.value)}</td><td class="num">${fmt$(n*m.value)}</td></tr>`; });
    h=head('Mineralforedling',`Lasterom: ${cargoCount()} / ${cargoCap()}`)+
      (rows?`<table><tr><th>Mineral</th><th class="num">Antall</th><th class="num">Pris</th><th class="num">Sum</th></tr>${rows}
        <tr><td><b>Totalt</b></td><td></td><td></td><td class="num bonus">${fmt$(tot)}</td></tr></table>
        <button class="btn primary" data-a="sellAll">Selg alt (Enter)</button>`
      :`<p>${G.lastSale?`<span class="bonus">Solgt for ${fmt$(G.lastSale)}!</span>`:'Lasterommet er tomt.'}</p>`)+
      `<h3>Prisliste</h3><table>${CONFIG.MINERALS.filter(m=>!(m.extra&&CONFIG.ORIGINAL_MODE)).map(m=>`<tr class="${m.extra?'extra':''}"><td><span style="color:${m.hi}">◆</span> ${m.name}</td><td class="num">${fmt$(m.value)}</td></tr>`).join('')}</table>`;
  } else if(id==='upgrade'){
    const tabs=[...Object.keys(CONFIG.UPGRADES),'items'];
    h=head('Oppgraderinger','Kjøp hvilket som helst nivå direkte. ★ = ekstra nivå utover originalen.')+
      `<div class="tabs">${tabs.map(t=>`<button class="tab ${G.shopTab===t?'on':''}" data-a="tab" data-v="${t}">${t==='items'?'Forbruksvarer':CONFIG.UPGRADES[t].label}</button>`).join('')}</div>`;
    if(G.shopTab==='items'){
      h+=`<table><tr><th>Vare</th><th>Tast</th><th class="num">Har</th><th class="num">Pris</th><th></th></tr>`+
        Object.entries(CONFIG.ITEMS).map(([k,it])=>`<tr><td>${it.name}<div class="sub" style="font-size:12px;margin:2px 0 0">${it.desc}</div></td><td>${it.key}</td><td class="num">${P.items[k]}</td><td class="num">${fmt$(it.price)}</td>
          <td class="num"><button class="btn" data-a="buyItem" data-v="${k}" ${P.money<it.price?'disabled':''}>Kjøp</button></td></tr>`).join('')+`</table>`;
    } else {
      const cat=G.shopTab, U=CONFIG.UPGRADES[cat];
      const fv=v=>cat==='radiator'?`${Math.round(v*100)} % kjøling`:`${v} ${U.unit}`;
      h+=`<table><tr><th>Modell</th><th class="num">Verdi</th><th class="num">Pris</th><th></th></tr>`+
        activeLevels(cat).map(L=>{ const cur=P.lv[cat]===L.i, low=L.i<P.lv[cat];
          return `<tr class="${cur?'cur':''} ${L.extra?'extra':''}"><td>${L.name}</td><td class="num">${fv(L.value)}</td><td class="num">${L.price?fmt$(L.price):'–'}</td>
          <td class="num">${cur?'Montert':low?'<span class="sub">Lavere</span>':`<button class="btn" data-a="buyUp" data-v="${cat}:${L.i}" ${P.money<L.price?'disabled':''}>Kjøp</button>`}</td></tr>`; }).join('')+`</table>`;
    }
  }
  h+=`<div style="margin-top:14px"><button class="btn" data-a="closeShop">◂ Tilbake ut (Esc)</button></div>`;
  showOv(h);
}

/* ===================== Hovedløkke ===================== */
function resize(){
  const s=Math.min(innerWidth/VW,innerHeight/VH);
  cv.style.width=Math.floor(VW*s)+'px'; cv.style.height=Math.floor(VH*s)+'px';
}
addEventListener('resize',resize);
let last=performance.now(), acc=0; const STEP=1/60;
function frame(now){
  let dt=(now-last)/1000; last=now; if(dt>0.25) dt=0.25; acc+=dt;
  let n=0; while(acc>=STEP&&n<6){ update(STEP); acc-=STEP; n++; } if(n>=6) acc=0;
  if(state==='menu'&&W){ cam.x=200+Math.sin(now/4000)*150; cam.y=(W.skyRows-8)*TS+Math.sin(now/5000)*40; }
  render();
  requestAnimationFrame(frame);
}
initSprites(); resize(); showMenu(); requestAnimationFrame(frame);
window.__DC={get P(){return P;},get W(){return W;},get G(){return G;},get B(){return B;},get state(){return state;},CONFIG,act,newGame,spawnBoss,useItem,keys,update,render};
</script>
