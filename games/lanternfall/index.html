<body>
<div id="wrap"><canvas id="c" tabindex="0" aria-label="Lanternfall game screen. Keyboard or gamepad required."></canvas></div>
<script>
'use strict';
// =====================================================================
//  LANTERNFALL — Requiem of the Paper Moon
//  A vertical danmaku shoot-'em-up. Single file, canvas + Web Audio.
//  Sections: CONFIG · UTIL · SAVE · INPUT · AUDIO · GFX · ENTITIES ·
//            PLAYER · BOSS · PATTERNS · STAGES · UI/SCENES · MAIN LOOP
// =====================================================================

// ============================== CONFIG ===============================
const W = 640, H = 480;                 // logical screen (4:3)
const FX = 32, FY = 16, FW = 384, FH = 448; // play field
const TAU = Math.PI * 2, PI = Math.PI, STEP = 1000 / 60;
const MAXSPD = 5.5;        // absolute bullet speed cap (px / frame)
const POC_Y = FH * 0.25;   // point-of-collection line
const P_HIT = 2.4;         // player hitbox radius
const GRAZE_R = 16;        // graze margin beyond the hitbox
const DEATHBOMB = 8;       // deathbomb window (frames)
const SKEY = 'lanternfall.save.v1';

// Central difficulty table. Every pattern reads these through dn/dr/lv,
// and shoot() applies the speed multiplier, so nothing is hard-coded.
const DIFFS = [
  { name: 'Dusk', sub: 'Easy', density: 0.5, speed: 0.75, rate: 0.6, lives: 4, lvl: 0, hpm: 0.8, col: '#93e0a6',
    desc: 'A gentle night for learning. Each pattern shows its idea with fewer, slower bullets.' },
  { name: 'Twilight', sub: 'Normal', density: 1.0, speed: 1.0, rate: 1.0, lives: 3, lvl: 1, hpm: 1.0, col: '#8fc4ff',
    desc: 'The festival as it was meant to be danced. Fair, complete, and very clearable.' },
  { name: 'Midnight', sub: 'Hard', density: 1.5, speed: 1.15, rate: 1.3, lives: 3, lvl: 2, hpm: 1.1, col: '#c9a0ff',
    desc: 'Second rings and extra aimed streams join every pattern.' },
  { name: 'Eclipse', sub: 'Lunatic', density: 2.0, speed: 1.3, rate: 1.6, lives: 3, lvl: 3, hpm: 1.2, col: '#ff7d98',
    desc: 'The moon swallows the light. Every layer, at full density.' },
  { name: 'Extra', sub: 'Extra', density: 1.8, speed: 1.25, rate: 1.5, lives: 3, lvl: 4, hpm: 1.25, col: '#ffd36b',
    desc: 'Behind the Moon\u2019s Paper. One stage, one secret, no continues.' },
];
let D = DIFFS[1];
function setDiff(i) { D = DIFFS[i]; }
const dn = (b, mn = 1) => Math.max(mn, Math.round(b * D.density));   // bullet counts
const dr = f => Math.max(1, Math.round(f / D.rate));                  // fire intervals
const lv = (...a) => a[Math.min(D.lvl, a.length - 1)];               // per-difficulty layers

// =============================== UTIL ================================
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => 0.5 - 0.5 * Math.cos(PI * clamp(t, 0, 1));
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const d2 = (ax, ay, bx, by) => { const x = ax - bx, y = ay - by; return x * x + y * y; };
const fmt = n => Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hexA(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function shade(h, k = 0.45) { const n = parseInt(h.slice(1), 16); const f = v => Math.min(255, Math.round(v * k)).toString(16).padStart(2, '0'); return '#' + f(n >> 16 & 255) + f(n >> 8 & 255) + f(n & 255); }

// Coroutine runner: tasks are generators; `yield n` waits n frames.
class Runner {
  constructor() { this.l = []; }
  add(g) { if (g) this.l.push({ g, w: 0 }); return g; }
  step() {
    const l = this.l;
    for (let i = 0; i < l.length; i++) {
      const t = l[i];
      if (t.w > 0) { t.w--; continue; }
      let r;
      try { r = t.g.next(); } catch (e) { console.error(e); r = { done: true }; }
      if (r.done) { l.splice(i, 1); i--; } else t.w = Math.max(0, (r.value | 0) - 1);
    }
  }
  clear() { this.l.length = 0; }
}
// Run generator g for at most n frames, honouring its waits.
function* timed(g, n) {
  let w = 0;
  for (let i = 0; i < n; i++) {
    if (w > 0) { w--; yield 1; continue; }
    const r = g.next(); if (r.done) return;
    w = Math.max(0, (r.value | 0) - 1); yield 1;
  }
}

// =============================== SAVE ================================
const DEFKEYS = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', shoot: 'KeyZ', bomb: 'KeyX', focus: 'ShiftLeft', pause: 'Escape' };
const Save = {
  d: null, ok: true,
  defaults() {
    return { opt: { bgm: 0.6, sfx: 0.6, mute: false, shake: true, pLives: 3, keys: Object.assign({}, DEFKEYS) },
      scores: {}, spells: {}, extra: false, reached: {}, clears: {}, time: 0, heard: { title: 1 } };
  },
  load() {
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (e) { this.ok = false; }
    const d = this.defaults();
    if (raw && typeof raw === 'object') {
      for (const k in raw) if (k !== 'opt') d[k] = raw[k];
      if (raw.opt) { Object.assign(d.opt, raw.opt); d.opt.keys = Object.assign({}, DEFKEYS, raw.opt.keys || {}); }
    }
    this.d = d;
  },
  save() { try { localStorage.setItem(SKEY, JSON.stringify(this.d)); } catch (e) { this.ok = false; } },
  reset() { this.d = this.defaults(); this.save(); }
};
function spellRec(id, di) { const k = id + '|' + di; return Save.d.spells[k] || (Save.d.spells[k] = { t: 0, c: 0 }); }
function hiScore(di, ci) { const l = Save.d.scores[di + '|' + ci]; return l && l.length ? l[0].s : 1000000; }
function saveScore() {
  if (!G || (G.mode !== 'normal' && G.mode !== 'extra') || G.scoreSaved) return;
  G.scoreSaved = true;
  const k = G.di + '|' + G.ci, l = Save.d.scores[k] || (Save.d.scores[k] = []);
  const dt = new Date();
  l.push({ s: G.score, st: G.clearedAll ? 'All Clear' : (G.si >= 6 ? 'Extra' : 'Stage ' + (G.si + 1)), d: dt.getFullYear() + '/' + (dt.getMonth() + 1) + '/' + dt.getDate(), c: G.cont });
  l.sort((a, b) => b.s - a.s); l.length = Math.min(l.length, 5);
  Save.save();
}

// =============================== INPUT ===============================
const Input = {
  codes: new Set(), held: {}, pressed: {}, rep: {}, rebind: null, padPrev: {},
  A: ['up', 'down', 'left', 'right', 'shoot', 'bomb', 'focus', 'pause'],
  norm(c) { return c === 'ShiftRight' ? 'ShiftLeft' : c === 'ControlRight' ? 'ControlLeft' : c; },
  init() {
    addEventListener('keydown', e => {
      const c = this.norm(e.code); Snd.unlock();
      if (this.rebind) { e.preventDefault(); const f = this.rebind; this.rebind = null; f(c); return; }
      const ks = Save.d.opt.keys;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'F2', 'Tab'].includes(e.code) || Object.values(ks).includes(c)) e.preventDefault();
      if (e.repeat) return;
      this.codes.add(c); this.pressed['k:' + c] = true;
      for (const a of this.A) if (ks[a] === c) this.pressed[a] = true;
      if (c === 'Enter' || c === 'Space') this.pressed.ok = true;
    });
    addEventListener('keyup', e => this.codes.delete(this.norm(e.code)));
    addEventListener('blur', () => this.codes.clear());
    addEventListener('pointerdown', () => Snd.unlock());
  },
  poll() {
    const k = Save.d.opt.keys; let p = {};
    try {
      const gps = navigator.getGamepads ? navigator.getGamepads() : [];
      for (const g of gps) {
        if (!g) continue;
        const b = i => !!(g.buttons[i] && g.buttons[i].pressed), ax = g.axes || [];
        p = { up: b(12) || ax[1] < -0.5, down: b(13) || ax[1] > 0.5, left: b(14) || ax[0] < -0.5, right: b(15) || ax[0] > 0.5,
          shoot: b(0), bomb: b(1), focus: b(2) || b(4) || b(5) || b(6) || b(7), pause: b(9) };
        if (b(0) || b(9)) Snd.unlock();
        break;
      }
    } catch (e) { }
    for (const a of this.A) {
      const h = this.codes.has(k[a]) || !!p[a];
      if (p[a] && !this.padPrev[a]) this.pressed[a] = true;
      this.held[a] = h; this.rep[a] = h ? (this.rep[a] || 0) + 1 : 0;
    }
    this.padPrev = p;
  },
  nav(a) { const r = this.rep[a] || 0; return !!this.pressed[a] || (r > 20 && r % 5 === 0); },
  ok() { return !!(this.pressed.shoot || this.pressed.ok); },
  back() { return !!this.pressed.bomb; },
  key(c) { return !!this.pressed['k:' + c]; },
  end() { this.pressed = {}; }
};

// =============================== AUDIO ===============================
const SCALES = { hira: [0, 2, 3, 7, 8], insen: [0, 1, 5, 7, 10], penta: [0, 2, 4, 7, 9], minor: [0, 2, 3, 5, 7, 8, 10],
  dorian: [0, 2, 3, 5, 7, 9, 10], phryg: [0, 1, 3, 5, 7, 8, 10], major: [0, 2, 4, 5, 7, 9, 11] };
const TRACKS = [
  { id: 'title', name: 'Night of Rising Lanterns', desc: 'Title theme. The festival begins, quiet and expectant, a thousand wishes on strings of light.', bpm: 88, root: 57, scale: 'hira', prog: [0, 3, 1, 4], seed: 7, lead: 'triangle', drum: 1 },
  { id: 's1', name: 'Festival Lantern Road', desc: 'Stage 1. Paper stalls, taiko far away, and a road that should be glowing upward.', bpm: 128, root: 62, scale: 'penta', prog: [0, 3, 4, 2], seed: 21, lead: 'square', drum: 2 },
  { id: 'b1', name: 'A Thousand Cranes Fold the Wind', desc: 'Tsumugi\u2019s theme. Mischief with sharp creases.', bpm: 150, root: 64, scale: 'insen', prog: [0, 3, 2, 4], seed: 33, lead: 'square', drum: 2 },
  { id: 's2', name: 'Riverside of Floating Wishes', desc: 'Stage 2. Lanterns drift on dark water, their reflections doubled and trembling.', bpm: 116, root: 59, scale: 'dorian', prog: [0, 5, 3, 4], seed: 45, lead: 'triangle', drum: 2 },
  { id: 'b2', name: 'The Maiden Who Keeps What Was Lost', desc: 'Mizuho\u2019s theme. Cool, flowing, a little lonely.', bpm: 142, root: 61, scale: 'minor', prog: [0, 5, 2, 6], seed: 58, lead: 'sawtooth', drum: 2 },
  { id: 's3', name: 'Moth-Silk Bamboo Grove', desc: 'Stage 3. Moonlight threads between the stalks; every rustle is a wingbeat.', bpm: 120, root: 58, scale: 'hira', prog: [0, 2, 3, 1], seed: 66, lead: 'triangle', drum: 2 },
  { id: 'b3', name: 'Tailor of the Moonlit Loom', desc: 'Sayo\u2019s theme. Precise stitches over a restless rhythm.', bpm: 148, root: 60, scale: 'phryg', prog: [0, 1, 5, 3], seed: 77, lead: 'square', drum: 2 },
  { id: 's4', name: 'The Clockless Shrine', desc: 'Stage 4. Bells that will not ring, incense that will not rise.', bpm: 110, root: 57, scale: 'insen', prog: [0, 3, 4, 1], seed: 88, lead: 'triangle', drum: 1 },
  { id: 'b4', name: 'A Festival That Never Ends', desc: 'Tokine\u2019s theme. A beautiful moment held far too long.', bpm: 156, root: 62, scale: 'minor', prog: [0, 3, 6, 4], seed: 99, lead: 'square', drum: 2 },
  { id: 's5', name: 'Ink-Wash Cloud Sea', desc: 'Stage 5. Brushstroke clouds roll like waves above the world.', bpm: 124, root: 55, scale: 'dorian', prog: [0, 6, 3, 4], seed: 111, lead: 'sawtooth', drum: 2 },
  { id: 'b5', name: 'Ten-Thousand-Year Inkstone', desc: 'Suzuri\u2019s theme. Heavy, ancient, and very patient.', bpm: 136, root: 52, scale: 'phryg', prog: [0, 1, 3, 4], seed: 123, lead: 'sawtooth', drum: 2 },
  { id: 's6', name: 'The Paper Moon', desc: 'Stage 6. A cracked moon close enough to touch, glowing like a lantern with no flame.', bpm: 132, root: 60, scale: 'hira', prog: [0, 3, 4, 2], seed: 135, lead: 'square', drum: 2 },
  { id: 'b6', name: 'Requiem of the Paper Moon ~ Oborozuki', desc: 'Final boss theme. Grief folded into something grand.', bpm: 160, root: 63, scale: 'minor', prog: [0, 5, 3, 4], seed: 147, lead: 'square', drum: 2 },
  { id: 'ex', name: 'Behind the Moon\u2019s Paper', desc: 'Extra stage. The blank side of the sky.', bpm: 140, root: 56, scale: 'insen', prog: [0, 2, 4, 1], seed: 159, lead: 'triangle', drum: 2 },
  { id: 'exb', name: 'The Festival\u2019s First Page', desc: 'Shirotae\u2019s theme. Everything, written all at once.', bpm: 168, root: 65, scale: 'phryg', prog: [0, 1, 4, 3], seed: 171, lead: 'sawtooth', drum: 2 },
  { id: 'end', name: 'Morning Over Lantern Road', desc: 'Ending theme. The last lantern rises, and the sky turns gold.', bpm: 84, root: 60, scale: 'major', prog: [0, 3, 4, 0], seed: 183, lead: 'triangle', drum: 0 },
];
// Procedural composer: seeded motifs over a 4-chord progression, 8 bars.
function buildTrack(d) {
  const R = mulberry32(d.seed), sc = SCALES[d.scale], L = sc.length, len = 128;
  const deg = i => { const o = Math.floor(i / L); return d.root + sc[((i % L) + L) % L] + 12 * o; };
  const A = () => new Array(len).fill(0);
  const mel = A(), mlen = A(), bass = A(), arp = A(), drum = A();
  const motif = () => {
    const m = []; let c = (R() * 3) | 0;
    for (let s = 0; s < 32; s++) {
      const on = s % 4 === 0 ? R() < 0.8 : s % 2 === 0 ? R() < 0.4 : R() < 0.1;
      if (on) { c += [-2, -1, -1, 0, 1, 1, 2, 3][(R() * 8) | 0]; c = clamp(c, -1, L + 3); m.push(c); } else m.push(null);
    }
    if (m[0] === null) m[0] = 0; return m;
  };
  const ma = motif(), mb = motif();
  const phr = [ma, mb, ma, mb.map((v, i) => i < 16 ? v : (i === 16 ? 0 : null))];
  for (let p = 0; p < 4; p++) { const ch = d.prog[p]; for (let s = 0; s < 32; s++) if (phr[p][s] !== null) mel[p * 32 + s] = deg(ch + phr[p][s]) + 12; }
  let last = -1;
  for (let i = 0; i < len; i++) if (mel[i]) { if (last >= 0) mlen[last] = Math.min(i - last, 6); last = i; }
  if (last >= 0) mlen[last] = Math.min(len - last, 8);
  for (let i = 0; i < len; i++) {
    const p = (i / 32) | 0, ch = d.prog[p], s = i % 16;
    if (d.drum >= 1 ? [0, 3, 8, 11].includes(s) : s === 0) bass[i] = deg(ch) - 12;
    if (s % 2 === 0) arp[i] = deg(ch + [0, 2, 4, 2][(s / 2) % 4]) + (d.drum ? 12 : 0);
    let dm = 0;
    if (d.drum >= 1) { if (s === 0 || s === 8) dm |= 1; if (s % 4 === 2) dm |= 4; }
    if (d.drum >= 2) { if (s === 4 || s === 12) dm |= 2; if (s === 6 && p % 2) dm |= 1; if (s % 2 === 0) dm |= 4; }
    drum[i] = dm;
  }
  return { id: d.id, bpm: d.bpm, lead: d.lead, len, mel, mlen, bass, arp, drum, blen: d.drum ? 1.8 : 14 };
}
const Snd = {
  ctx: null, m: null, bg: null, fx: null, nb: null, cur: null, want: null, step: 0, next: 0, last: {}, frame: 0,
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => { }); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const c = this.ctx = new AC();
      this.m = c.createGain(); this.m.connect(c.destination);
      this.bg = c.createGain(); this.bg.connect(this.m);
      this.fx = c.createGain(); this.fx.connect(this.m);
      const len = c.sampleRate; this.nb = c.createBuffer(1, len, c.sampleRate);
      const dd = this.nb.getChannelData(0); for (let i = 0; i < len; i++) dd[i] = Math.random() * 2 - 1;
      this.apply(); setInterval(() => this.tick(), 25);
      if (this.want) { const w = this.want; this.want = null; this.play(w); }
    } catch (e) { this.ctx = null; }
  },
  apply() { if (!this.ctx) return; const o = Save.d.opt; this.m.gain.value = o.mute ? 0 : 0.9; this.bg.gain.value = o.bgm * 0.5; this.fx.gain.value = o.sfx * 0.7; },
  play(id) {
    Save.d.heard[id] = 1;
    if (!this.ctx) { this.want = id; return; }
    if (this.cur && this.cur.id === id) return;
    const tr = TRACKS.find(t => t.id === id); if (!tr) return;
    this.cur = buildTrack(tr); this.step = 0; this.next = this.ctx.currentTime + 0.08;
  },
  stop() { this.cur = null; this.want = null; },
  tick() {
    const c = this.ctx; if (!c || !this.cur) return;
    const tr = this.cur, sd = 60 / tr.bpm / 4;
    if (this.next < c.currentTime) this.next = c.currentTime + 0.02;
    while (this.next < c.currentTime + 0.14) { this.playStep(tr, this.step, this.next, sd); this.step = (this.step + 1) % tr.len; this.next += sd; }
  },
  tone(f, t, dur, type, vol, dest, f2) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(t, dur, vol, dest, ft, ff) {
    const c = this.ctx, s = c.createBufferSource(); s.buffer = this.nb;
    const f = c.createBiquadFilter(); f.type = ft || 'lowpass'; f.frequency.value = ff || 4000;
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  },
  playStep(tr, s, t, sd) {
    const B = this.bg, m = tr.mel[s];
    if (m > 0) { this.tone(mf(m), t, sd * tr.mlen[s] * 0.92, tr.lead, tr.lead === 'sawtooth' ? 0.06 : 0.09, B); this.tone(mf(m + 12), t, sd * tr.mlen[s] * 0.5, 'sine', 0.025, B); }
    if (tr.bass[s] > 0) this.tone(mf(tr.bass[s]), t, sd * tr.blen, 'triangle', 0.16, B);
    if (tr.arp[s] > 0) this.tone(mf(tr.arp[s]), t, sd * 0.8, 'square', 0.018, B);
    const dm = tr.drum[s];
    if (dm & 1) this.tone(140, t, 0.14, 'sine', 0.26, B, 40);
    if (dm & 2) this.noise(t, 0.12, 0.12, B, 'bandpass', 1800);
    if (dm & 4) this.noise(t, 0.03, 0.04, B, 'highpass', 7000);
  },
  sfx(n) {
    const c = this.ctx; if (!c) return;
    const thr = { shot: 4, graze: 3, eshot: 4, item: 2, hit: 3, cancel: 8, tick: 2, edie: 2, pop: 3 }[n];
    if (thr) { if (this.frame - (this.last[n] === undefined ? -99 : this.last[n]) < thr) return; this.last[n] = this.frame; }
    const t = c.currentTime, X = this.fx, seq = (notes, base, gap, dur, type, vol) => notes.forEach((s, i) => this.tone(mf(base + s), t + i * gap, dur, type, vol, X));
    switch (n) {
      case 'shot': this.tone(1200, t, 0.035, 'square', 0.02, X, 700); break;
      case 'graze': this.tone(2300, t, 0.04, 'triangle', 0.05, X, 1800); break;
      case 'eshot': this.tone(620, t, 0.05, 'sine', 0.035, X, 320); break;
      case 'item': this.tone(1400, t, 0.05, 'sine', 0.04, X, 2000); break;
      case 'hit': this.tone(300, t, 0.03, 'square', 0.015, X, 200); break;
      case 'edie': this.noise(t, 0.14, 0.16, X, 'lowpass', 2600); this.tone(520, t, 0.11, 'square', 0.04, X, 120); break;

function drawSpellBG(kind, a, f, col) {

  ctx.fillStyle = `rgba(3,2,10,${0.62 * a})`; ctx.fillRect(0, 0, FW, FH);
  ctx.save(); ctx.globalAlpha = a * 0.2; ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.2;
  const cx = FW / 2, cy = FH * 0.38;
  switch (kind) {
    case 'cranes': ctx.translate(cx, cy); ctx.rotate(f * 0.002); for (let r = 40; r < 420; r += 44) { ctx.beginPath(); for (let i = 0; i <= 8; i++) { const an = i * TAU / 8 + r * 0.01; ctx.lineTo(Math.cos(an) * r, Math.sin(an) * r); } ctx.stroke(); } break;

    case 'clock': ctx.translate(cx, cy); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 170, 0, TAU); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, 120, 0, TAU); ctx.stroke(); for (let i = 0; i < 12; i++) { const an = i * TAU / 12 - f * 0.001; ctx.beginPath(); ctx.moveTo(Math.cos(an) * 125, Math.sin(an) * 125); ctx.lineTo(Math.cos(an) * 165, Math.sin(an) * 165); ctx.stroke(); } ctx.rotate(-f * 0.006); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -150); ctx.stroke(); ctx.rotate(-f * 0.02); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(100, 0); ctx.stroke(); break;

  }
  ctx.restore();
}

const MS = { mode: 'normal', di: 1, ci: 0, si: 0, sp: null };
function* runWaves(list) { for (const [w, name, o] of list) { for (let i = 0; i < w && !G.jump; i++) yield 1; if (G.jump) return; G.waveRun.add(WAVES[name](o)); } }
function* stageScript(si) {
  const S = STAGES[si]; G.si = si; G.sg = 0; G.sp = 0; G.jump = false;
  Snd.play(S.music); G.stTitle = { t: 0, name: S.name, sub: S.sub }; G.pocShow = 220;
  if (G.mode === 'normal') { const r = Save.d.reached; r[G.di] = Math.max(r[G.di] || 1, si + 1); Save.save(); }
  for (let i = 0; i < 120 && !G.jump; i++) yield 1;
  yield* runWaves(S.a); yield* waitClear(300);
  yield* midboss(BOSS[S.boss]);
  if (!G.jump) { yield 90; yield* runWaves(S.b); yield* waitClear(600); }
  G.waveRun.clear(); G.jump = false;
  yield* bossFight(BOSS[S.boss]);
}
function stageClearBonus() {
  const m = [0.5, 1, 1.5, 2, 2][G.di], sb = 1e6 * (G.si + 1), gb = G.sg * 1000, pb = G.sp * 5000, pw = Math.floor(G.power * 100) * 1000;
  const total = Math.round((sb + gb + pb + pw) * m / 10) * 10; addScore(total);
  G.clear = { t: 0, sb, gb, pb, pw, m, total, graze: G.sg, pts: G.sp, power: G.power };
}
function* mainScript() {
  const last = G.mode === 'extra' ? 6 : G.mode === 'practice' ? G.si : 5;
  for (let si = G.si; si <= last; si++) { yield* stageScript(si); yield 40; stageClearBonus(); while (G.clear) yield 1; }
  if (G.mode === 'practice') { G.end = { t: 0, txt: 'Practice complete', back: 'title' }; return; }
  G.clearedAll = true; saveScore();
  const k = G.di + '|' + G.ci; Save.d.clears[k] = (Save.d.clears[k] || 0) + 1;
  if (G.mode === 'extra') { Save.save(); goEnding('extra'); return; }
  if (G.cont === 0) { Save.d.extra = true; Save.save(); goEnding('good'); } else { Save.save(); goEnding('bad'); }
}
function* spellScript() {

  const ph = def.spells[MS.sp.k]; yield 30;
  const b = spawnBoss(def, [ph], false); b.auto = true;

}

  G = { mode: MS.mode, di: MS.di, ci: MS.ci, si: ex ? 6 : pr ? MS.si : 0, score: 0, hi: hiScore(MS.di, MS.ci),
    lives: pr ? Save.d.opt.pLives : D.lives, bombs: 3, lf: 0, bf: 0,

    graze: 0, sg: 0, sp: 0, pointMax: 10000, cont: 0, f: 0, noFire: 0, shake: 0, flash: 0, autoCollect: 0,
    card: null, decl: null, bonusMsg: null, stTitle: null, dlg: null, clear: null, boss: null, paused: null, over: null, end: null,
    banners: [], extIdx: 0, deaths: 0, bombsUsed: 0, stageRun: new Runner(), waveRun: new Runner(), spellBgA: 0, pocShow: 0, tint: 0,

function doContinue() { G.cont++; G.score = G.cont; G.lives = D.lives; G.bombs = 3; G.lf = 0; G.bf = 0; G.over = null; P.state = 'dead'; P.rsp = 20; }
function stepGame() {
  G.f++;
  if (G.noFire > 0) G.noFire--; if (G.autoCollect > 0) G.autoCollect--; if (G.flash > 0) G.flash = Math.max(0, G.flash - 0.03);
  if (G.shake > 0) G.shake--; if (G.tint > 0) G.tint--; if (G.pocShow > 0) G.pocShow--;
  updAmbient(G.si);
  if (G.dlg) updDlg();
  updPlayer();
  G.stageRun.step(); G.waveRun.step();
  if (G.boss) updBoss(G.boss);
  updEnemies(); updShots(); updBullets(); updLasers(); updItems(); updParts();
  if (P.bombT > 0) updBomb();
  for (let i = pops.length - 1; i >= 0; i--) if (++pops[i].t > 40) pops.splice(i, 1);
  for (let i = G.banners.length - 1; i >= 0; i--) if (++G.banners[i].t > 120) G.banners.splice(i, 1);
  if (G.decl) { G.decl.t++; if (!G.card) G.decl = null; }
  if (G.bonusMsg && ++G.bonusMsg.t > 150) G.bonusMsg = null;
  if (G.stTitle && ++G.stTitle.t > 260) G.stTitle = null;
  if (G.card && G.boss) { G.lastBg = G.boss.def.bg; G.lastCol = G.boss.def.color; }
  G.spellBgA = clamp(G.spellBgA + (G.card ? 0.03 : -0.03), 0, 1);
  if (G.clear) { G.clear.t++; if ((G.clear.t > 60 && Input.ok()) || G.clear.t > 480) G.clear = null; }
  if (G.overPending > 0 && --G.overPending === 0) { G.over = { i: 0, t: 0 }; Snd.sfx('back'); }
  Save.d.time += 1 / 60; if (G.f % 900 === 0) Save.save();
}
// Ambient embers and petals (drawn in the background layer).
const AMB = []; for (let i = 0; i < 28; i++) AMB.push({ x: Math.random() * FW, y: Math.random() * FH, vx: 0, vy: 0, ph: Math.random() * TAU, s: 1 + Math.random() * 2 });
function updAmbient(si) { for (const a of AMB) { a.ph += 0.02; a.x += Math.sin(a.ph) * 0.3; a.y += si === 5 || si === 0 ? -0.4 * a.s : 0.5 * a.s; if (a.y < -10) a.y = FH + 10; if (a.y > FH + 10) a.y = -10; if (a.x < 0) a.x += FW; if (a.x > FW) a.x -= FW; } }

// ============================== RENDERING =============================
function drawAmbient() {
  const ci = [CI.orange, CI.cyan, CI.violet, CI.gold, CI.white, CI.orange, CI.white][Math.min(G.si, 6)];
  for (const a of AMB) glowAt(a.x, a.y, a.s * 3, ci, 0.22);
}
function drawBullets(ox, oy) {
  const n = bullets.length;
  for (let i = 0; i < n; i++) {
    const b = bullets[i], sp = SPRA[b.si], s = sp.s, bt = b.bt;
    let sc = 1, al = 1;
    if (b.t < b.fade) { const k = b.t / b.fade; sc = 1 + (1 - k) * 1.2; al = k; }
    let c = 1, sn = 0;
    if (bt.rot) { c = b.c; sn = b.s; if (b.spd < 0) { c = -c; sn = -sn; } }
    else if (bt.spin) { const a = b.t * 0.08; c = Math.cos(a); sn = Math.sin(a); }
    else if (bt.sway) { const a = Math.sin(b.t * 0.05 + b.x * 0.01) * 0.25; c = Math.cos(a); sn = Math.sin(a); }
    const k = K * sc;
    if (al !== 1) ctx.globalAlpha = al;
    ctx.setTransform(k * c, k * sn, -k * sn, k * c, K * (ox + b.x), K * (oy + b.y));
    ctx.drawImage(sp.c, -s / 2, -s / 2, s, s);
    if (al !== 1) ctx.globalAlpha = 1;
  }
  setT(ox, oy);
}
function drawShots(ox, oy) {
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.6;
  for (const s of pshots) { const sp = SHOTS[s.kind], c = Math.cos(s.ang), sn = Math.sin(s.ang); ctx.setTransform(K * c, K * sn, -K * sn, K * c, K * (ox + s.x), K * (oy + s.y)); ctx.drawImage(sp.c, -sp.w / 2, -sp.h / 2, sp.w, sp.h); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; setT(ox, oy);
}
function drawItems() {
  ctx.lineWidth = 1.5;
  for (const it of items) {
    const sp = ITS[it.type];
    if (it.mag && (it.px !== it.x || it.py !== it.y)) { ctx.strokeStyle = it.type === 'cs' ? 'rgba(255,224,128,0.35)' : 'rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.moveTo(it.x, it.y); ctx.lineTo(it.x + (it.px - it.x) * 3, it.y + (it.py - it.y) * 3); ctx.stroke(); }
    if (it.y < -4) { ctx.globalAlpha = 0.6; ctx.drawImage(sp.c, it.x - sp.w / 2, 2, sp.w, sp.h); ctx.globalAlpha = 1; continue; }
    ctx.drawImage(sp.c, it.x - sp.w / 2, it.y - sp.h / 2, sp.w, sp.h);
  }
}
function drawParts() {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const k = p.t / p.life; ctx.globalAlpha = 1 - k;
    if (p.kind === 1) { ctx.strokeStyle = COLS[CN[p.ci]][0]; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.1, p.size * easeOut(k)), 0, TAU); ctx.stroke(); }
    else { const s = p.size * (1 - k * 0.6); ctx.drawImage(GLOW[p.ci].c, p.x - s, p.y - s, s * 2, s * 2); }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
function drawLasers() {
  ctx.lineCap = 'round';
  for (const L of lasers) {
    const f = laserF(L), c = Math.cos(L.ang), s = Math.sin(L.ang), ex = L.x + c * L.len, ey = L.y + s * L.len, col = COLS[L.col];
    const line = (w, st) => { ctx.strokeStyle = st; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(L.x, L.y); ctx.lineTo(ex, ey); ctx.stroke(); };
    if (L.t < L.warn) { line(1.2, hexA(col[0], 0.35 + 0.25 * Math.sin(L.t * 0.4))); continue; }
    ctx.globalCompositeOperation = 'lighter';
