<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loot Loop — Roll & Survive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7e2f4; --bg2:#d9d1ee; --panel:#fbf9ff; --panel2:#efeafb; --line:#c8bde6; --text:#1d1636; --muted:#5f5683;
  --gold:#b98514; --goldhi:#f4c14f; --teal:#0f9e88; --rose:#d93a5e; --shadow:rgba(40,20,90,.15);
  --c0:#7d8796; --c1:#2f9e4f; --c2:#2a7fd8; --c3:#8a44e0; --c4:#d98a00; --c5:#e0325f;
  --display:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif; --body:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17122b; --bg2:#1f1838; --panel:#221a3f; --panel2:#2b2150; --line:#3d3170; --text:#f1e9d8; --muted:#a79cc9;
    --gold:#f4c14f; --goldhi:#ffe08a; --teal:#3ee6c8; --rose:#ff5f7e; --shadow:rgba(0,0,0,.4);
    --c0:#b4bdcb; --c1:#5fd17a; --c2:#4aa3ff; --c3:#b97bff; --c4:#ffb02e; --c5:#ff4f7b; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17122b; --bg2:#1f1838; --panel:#221a3f; --panel2:#2b2150; --line:#3d3170; --text:#f1e9d8; --muted:#a79cc9;
  --gold:#f4c14f; --goldhi:#ffe08a; --teal:#3ee6c8; --rose:#ff5f7e; --shadow:rgba(0,0,0,.4);
  --c0:#b4bdcb; --c1:#5fd17a; --c2:#4aa3ff; --c3:#b97bff; --c4:#ffb02e; --c5:#ff4f7b; color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;overflow-x:hidden;
  background-image:radial-gradient(circle at 20% 0%, var(--bg2), transparent 55%);}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.disp{font-family:var(--display)}
/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#logo{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.5px;margin-right:auto;display:flex;align-items:center;gap:8px;line-height:1}
#logo b{color:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 8px;font-size:13px;white-space:nowrap}
.chip .v{font-family:var(--display);font-size:17px;font-weight:600}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;font-size:17px;display:grid;place-items:center}
.iconbtn.off{opacity:.45}
/* ---------- layout ---------- */
#hub{display:grid;grid-template-columns:minmax(320px,430px) 1fr;gap:18px;padding:18px;max-width:1400px;margin:0 auto}
@media (max-width:860px){#hub{grid-template-columns:1fr;padding:12px}#top{position:static}#logo{font-size:22px}.chip{font-size:12px}}
#altar{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 24px var(--shadow)}
#objective{padding:12px 14px;display:flex;gap:10px;align-items:flex-start;border-left:5px solid var(--teal);border-radius:12px}
#objective .ob-i{font-size:22px;line-height:1}
#objective p{margin:0;font-size:14px}
#objective strong{display:block;font-family:var(--display);font-size:16px;font-weight:600;margin-bottom:1px}
/* ---------- the die ---------- */
#dieBox{padding:22px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;overflow:hidden}
#dieWrap{position:relative;width:220px;height:220px;display:grid;place-items:center}
#ring{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(var(--goldhi) calc(var(--p,0)*1turn), color-mix(in srgb,var(--line) 70%,transparent) 0);
  -webkit-mask:radial-gradient(circle, transparent 62%, #000 63%, #000 70%, transparent 71%);mask:radial-gradient(circle, transparent 62%, #000 63%, #000 70%, transparent 71%)}
#ring.full{animation:ringPulse 1.4s ease-in-out infinite}
@keyframes ringPulse{50%{filter:drop-shadow(0 0 10px var(--goldhi))}}
#die{width:150px;height:150px;border:none;background:none;padding:0;position:relative;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .08s}
#die:active{transform:scale(.93)}
#die svg{width:100%;height:100%;filter:drop-shadow(0 10px 14px var(--shadow));display:block}
#die.spin svg{animation:dieSpin .55s cubic-bezier(.3,1.4,.5,1)}
@keyframes dieSpin{0%{transform:rotate(0) scale(1)}40%{transform:rotate(200deg) scale(.82)}100%{transform:rotate(360deg) scale(1)}}
#die.tap svg{animation:dieTap .16s}
@keyframes dieTap{50%{transform:scale(.9) rotate(-6deg)}}
.floaty{position:absolute;pointer-events:none;font-family:var(--display);font-weight:700;color:var(--gold);font-size:18px;animation:floatUp .9s ease-out forwards;text-shadow:0 2px 0 var(--shadow)}
@keyframes floatUp{to{transform:translateY(-60px);opacity:0}}
#chargeInfo{text-align:center}
#chargeCount{font-family:var(--display);font-size:42px;font-weight:700;line-height:1}
#chargeSub{color:var(--muted);font-size:13px}
.rollrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.btn{border:none;border-radius:12px;padding:11px 18px;font-weight:700;font-size:15px;background:var(--panel2);border:1px solid var(--line);transition:transform .08s, filter .15s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--gold);color:#241a05;border-color:transparent;font-family:var(--display);font-size:20px;padding:10px 26px;box-shadow:0 4px 0 color-mix(in srgb,var(--gold) 60%,#000)}
.btn.gold{background:linear-gradient(180deg,var(--goldhi),var(--gold));color:#241a05;border-color:transparent}
.btn.teal{background:var(--teal);color:#05221d;border-color:transparent;font-family:var(--display);font-size:22px;padding:12px 30px;box-shadow:0 4px 0 color-mix(in srgb,var(--teal) 55%,#000)}
.btn.small{padding:6px 11px;font-size:13px;border-radius:9px}
[hidden]{display:none!important}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
/* buffs */
#buffs{padding:12px 14px}
#buffs h3,.sec h3{margin:0 0 8px;font-family:var(--display);font-size:18px;font-weight:600}
#buffRow{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.buff{position:relative;aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font-size:28px;display:grid;place-items:center;overflow:hidden;padding:0}
.buff .cdv{position:absolute;inset:auto 0 0 0;background:color-mix(in srgb,var(--bg) 75%,transparent);height:var(--cd,0%);transition:height .25s linear}
.buff .bt{position:absolute;bottom:3px;left:0;right:0;font-size:11px;font-weight:700;font-family:var(--display)}
.buff.active{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset}
.buff.ready{border-color:var(--gold)}
.buff.locked{filter:grayscale(1);opacity:.4}
.buff .em{position:relative}
/* reveal */
#reveal{padding:12px;min-height:120px}
#revealGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.rcard{border-radius:12px;padding:8px 4px 6px;text-align:center;background:var(--panel2);border:2px solid var(--rc);position:relative;animation:flip .5s cubic-bezier(.3,1.3,.5,1) backwards}
.rcard .ic{font-size:30px;line-height:1.15}
.rcard .nm{font-size:11px;font-weight:600;line-height:1.15;margin-top:3px}
.rcard .tg{font-family:var(--display);font-size:12px;color:var(--rc);font-weight:700}
.rcard.hi{box-shadow:0 0 18px var(--rc), 0 0 0 1px var(--rc) inset}
@keyframes flip{from{transform:rotateY(90deg) scale(.6);opacity:0}}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 8px}
/* ---------- panel / tabs ---------- */
#panel{display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 14px;font-weight:600;display:flex;gap:6px;align-items:center}
.tab.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.tab.lock{opacity:.5}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--rose)}
.pane{display:none;padding:16px}
.pane.on{display:block}
.sec{margin-bottom:18px}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
/* item icon tiles */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fbtn{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 12px;font-size:13px}
.fbtn.on{border-color:var(--teal);color:var(--teal);font-weight:700}
#collGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tile{position:relative;border-radius:14px;background:var(--panel2);border:2px solid var(--rc);padding:10px 6px 8px;text-align:center;min-height:118px}
.tile.unk{border-style:dashed;border-color:var(--line);opacity:.65}
.tile .ic{font-size:36px;line-height:1.1}
.tile.unk .ic{filter:brightness(0) opacity(.35)}
.tile .nm{font-size:12px;font-weight:600;line-height:1.2;margin-top:4px}
.tile .lv{font-family:var(--display);font-size:13px;color:var(--rc);font-weight:700}
.badge{position:absolute;top:5px;left:5px;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;color:#fff;font-weight:700}
.prog{height:4px;background:var(--line);border-radius:3px;margin:5px 6px 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--rc)}
.powerbox{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);margin-bottom:14px}
.powerbox .big{font-family:var(--display);font-size:34px;font-weight:700;color:var(--gold);line-height:1}
.powerbox p{margin:0;font-size:13px;color:var(--muted);max-width:52ch}
/* upgrades */
.ulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.urow{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}
.urow .ui{font-size:26px;width:36px;text-align:center}
.urow .ut{flex:1;min-width:0}
.urow .un{font-weight:700;font-size:14px}
.urow .ud{font-size:12px;color:var(--muted)}
.urow .ul{font-family:var(--display);font-size:13px;color:var(--teal)}
/* expedition */
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mapc{border-radius:14px;padding:12px;border:2px solid var(--line);background:var(--panel2);text-align:left;position:relative;min-height:110px}
.mapc .mi{font-size:32px}
.mapc .mn{font-family:var(--display);font-size:17px;font-weight:600;line-height:1.1}
.mapc .ms{font-size:12px;color:var(--muted)}
.mapc.on{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset}
.mapc.lock{opacity:.5}
.diffs{display:flex;flex-wrap:wrap;gap:6px}
.dbtn{width:44px;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);font-family:var(--display);font-size:18px;font-weight:700;position:relative}
.dbtn.on{background:var(--rose);color:#fff;border-color:var(--rose)}
.dbtn.clr::after{content:"✓";position:absolute;top:-6px;right:-5px;font-size:11px;background:var(--teal);color:#05221d;border-radius:50%;width:16px;height:16px;display:grid;place-items:center}
.dbtn:disabled{opacity:.3}
.heroes{display:flex;flex-wrap:wrap;gap:8px}
.hero{display:flex;gap:8px;align-items:center;padding:8px 12px 8px 8px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);text-align:left}
.hero .hi{font-size:28px}
.hero.on{border-color:var(--rc);box-shadow:0 0 0 2px var(--rc) inset}
.hero .hn{font-weight:700;font-size:13px}
.hero .hs{font-size:11px;color:var(--muted)}
.kitlist{display:flex;flex-wrap:wrap;gap:6px}
.kit{border-radius:10px;border:2px solid var(--rc);background:var(--panel2);padding:4px 9px;font-size:13px;display:flex;align-items:center;gap:5px;opacity:.6}
.kit.on{opacity:1;box-shadow:0 0 0 2px var(--rc) inset}
.threat{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 0}
.threat b{color:var(--text);font-family:var(--display);font-size:16px}
/* milestones */
.mrow{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px}
.mrow .mt{flex:1}
.mrow.done{opacity:.5}
.bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--teal)}
/* ---------- modals ---------- */
.modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(10,6,24,.72);padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.modal.on{display:grid}
.mbox{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:640px;width:100%;max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mbox h2{font-family:var(--display);font-size:30px;margin:0 0 6px;line-height:1.05}
.mbox p{margin:0 0 12px;max-width:62ch}
.lvcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.lvc{border-radius:14px;border:2px solid var(--rc);background:var(--panel2);padding:14px 10px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.lvc:hover{box-shadow:0 0 0 2px var(--rc) inset}
.lvc .ic{font-size:40px;line-height:1.1}
.lvc .nm{font-weight:700;font-size:14px}
.lvc .tg{font-family:var(--display);font-size:13px;color:var(--rc)}
.lvc .ds{font-size:12px;color:var(--muted)}
.lvc .key{font-family:var(--display);font-size:11px;color:var(--muted)}
.rew{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}
.rew div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.rew b{display:block;font-family:var(--display);font-size:24px}
.rew span{font-size:12px;color:var(--muted)}
.unlocks{margin:8px 0 14px;padding:0;list-style:none}
.unlocks li{padding:7px 10px;border-radius:10px;background:color-mix(in srgb,var(--teal) 15%,transparent);margin-bottom:6px;font-weight:600;font-size:14px}
/* run */
#runWrap{position:fixed;inset:0;z-index:40;display:none;background:#000}
#runWrap.on{display:block}
#game{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#pauseBtn{position:absolute;right:12px;top:calc(56px + env(safe-area-inset-top,0px));z-index:2;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.2)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:tin .3s ease-out;text-align:center}
@keyframes tin{from{transform:translateY(12px);opacity:0}}
.lockmsg{padding:30px 14px;text-align:center;color:var(--muted)}
.lockmsg .big{font-size:40px}
.detail{display:flex;gap:16px;align-items:center;margin-bottom:10px}
.detail .ic{font-size:64px;width:96px;height:96px;display:grid;place-items:center;border-radius:20px;border:3px solid var(--rc);background:var(--panel2)}
.tagline{font-family:var(--display);color:var(--rc);font-size:15px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:13px}
.stats b{font-family:var(--display);font-size:15px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>
<header id="top">
  <div id="logo"><span aria-hidden="true">🎲</span><span>Loot<b>Loop</b></span></div>
  <div class="chips" id="chips"></div>
  <button class="iconbtn" id="musBtn" title="Music" aria-label="Toggle music">🎵</button>
  <button class="iconbtn" id="sfxBtn" title="Sound effects" aria-label="Toggle sound effects">🔊</button>
  <button class="iconbtn" id="setBtn" title="Stats & settings" aria-label="Stats and settings">⚙️</button>
</header>

<main id="hub">
  <section id="altar">
    <div class="card" id="objective"><span class="ob-i" aria-hidden="true">🧭</span><p><strong id="obT">Click the die</strong><span id="obD"></span></p></div>
    <div class="card" id="dieBox">
      <div id="dieWrap">
        <div id="ring"></div>
        <button id="die" aria-label="Charge the Wishing Die">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <defs>
              <linearGradient id="dg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1c2"/><stop offset=".5" stop-color="#f4c14f"/><stop offset="1" stop-color="#b47a10"/></linearGradient>
              <linearGradient id="dg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2a6e"/><stop offset="1" stop-color="#1a1238"/></linearGradient>
            </defs>
            <polygon points="60,4 110,32 110,88 60,116 10,88 10,32" fill="url(#dg)" stroke="#7a4f05" stroke-width="3"/>
            <polygon points="60,4 110,32 60,58 10,32" fill="#fff4d0" opacity=".35"/>
            <polygon points="60,58 110,32 110,88 60,116" fill="#000" opacity=".12"/>
            <circle cx="60" cy="62" r="25" fill="url(#dg2)" stroke="#7a4f05" stroke-width="2"/>
            <text id="dieFace" x="60" y="71" text-anchor="middle" font-family="Pixelify Sans, monospace" font-size="26" font-weight="700" fill="#ffe08a">?</text>
          </svg>
        </button>
      </div>
      <div id="chargeInfo"><div id="chargeCount" class="disp">0</div><div id="chargeSub">charges</div></div>
      <div class="rollrow">
        <button class="btn primary" id="roll1">Roll</button>
        <button class="btn" id="roll10" hidden>Roll ×10</button>
        <button class="btn gold" id="rollG" hidden>Golden roll</button>
      </div>
      <label class="toggle" id="autoWrap" hidden><input type="checkbox" id="autoChk"> Auto-roll when charges are ready</label>
    </div>
    <div class="card" id="buffs" hidden><h3>Buffs</h3><div id="buffRow"></div></div>
    <div class="card" id="reveal"><div id="revealGrid"><div class="empty">Your pulls appear here.</div></div></div>
  </section>

  <section id="panel">
    <nav id="tabs" role="tablist"></nav>
    <div class="card pane" id="pane-coll"></div>
    <div class="card pane" id="pane-exp"></div>
    <div class="card pane" id="pane-upg"></div>
    <div class="card pane" id="pane-ms"></div>
  </section>
</main>

<div id="runWrap">
  <canvas id="game"></canvas>
  <button class="iconbtn" id="pauseBtn" aria-label="Pause">⏸</button>
</div>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toasts"></div>
<div id="saProbe" style="position:fixed;top:0;left:0;width:0;padding-top:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none"></div>
<script>
'use strict';
/* ================= utilities ================= */
const $=s=>document.querySelector(s);
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function fmt(n){n=+n||0;if(Math.abs(n)<1000)return(Math.abs(n)<10&&n%1?n.toFixed(1):Math.floor(n).toString());const u=['k','M','B','T','Qa'];let i=-1;while(Math.abs(n)>=1000&&i<u.length-1){n/=1000;i++}return n.toFixed(n<10?2:n<100?1:0)+u[i]}
function fmtT(s){s=Math.max(0,Math.floor(s));const m=Math.floor(s/60),x=s%60;return m+':'+(x<10?'0':'')+x}
function fmtDur(s){s=Math.ceil(s);if(s<60)return s+'s';if(s<3600)return Math.floor(s/60)+'m'+(s%60?' '+s%60+'s':'');return Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m'}

/* ================= state & saving ================= */
const SAVE_KEY='lootloop_save_v1';
function freshState(){return{v:1,charges:0,progress:0,golden:0,essence:0,items:{},upg:{},cleared:{},totalRolls:0,pity:0,buffs:{},blessing:false,ms:[],
 settings:{music:true,sfx:true},runs:0,wins:0,lastSave:Date.now(),auto:false,sel:{map:0,diff:1,char:'rookie',kit:[]},introSeen:false,permLuck:0,
 stats:{kills:0,bestTime:0,legend:0},flags:{},seenTabs:{}}}
let state=freshState();
function loadLocal(){try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const s=JSON.parse(raw);return s}}catch(e){}return null}
function adopt(s){const f=freshState();state=Object.assign(f,s);state.settings=Object.assign(f.settings,s.settings||{});state.sel=Object.assign(f.sel,s.sel||{});state.stats=Object.assign(f.stats,s.stats||{});state.flags=s.flags||{};state.seenTabs=s.seenTabs||{}}
function save(){state.lastSave=Date.now();try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){}cloud.dirty=true}
/* cloud save via the artifact db (per-viewer, private); localStorage remains the instant copy */
const cloud={db:null,ref:null,dirty:false,busy:false,last:0};
async function cloudInit(){
 try{
  if(!window.claude||!window.claude.use)return;
  const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  if(!db||!user)return;
  const uid=await user.id(); if(!uid)return;
  cloud.db=db; cloud.ref=db.doc('data/users/'+uid+'/save');
  const snap=await cloud.ref.get();
  if(snap&&snap.exists){const d=snap.data();
   if(d&&d.json&&(d.t||0)>(state.lastSave||0)+2000){try{const s=JSON.parse(d.json);adopt(s);applyOffline(true);refreshAll();toast('☁️ Synced your progress from the cloud')}catch(e){}}
  }
  cloud.dirty=true;
 }catch(e){cloud.ref=null}
}
async function cloudPush(force){
 if(!cloud.ref||cloud.busy||!cloud.dirty)return;
 const now=Date.now(); if(!force&&now-cloud.last<20000)return;
 cloud.busy=true;cloud.dirty=false;cloud.last=now;
 try{await cloud.ref.set({json:JSON.stringify(state),t:state.lastSave})}catch(e){cloud.dirty=true}
 cloud.busy=false;
}

/* ================= audio ================= */
const AU={ctx:null,master:null,mus:null,sfx:null,noise:null,song:null,step:0,next:0,timer:null,last:{}};
function audioInit(){
 if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
 const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
 const ctx=new C();AU.ctx=ctx;
 AU.master=ctx.createGain();AU.master.gain.value=.8;
 const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
 AU.master.connect(comp);comp.connect(ctx.destination);
 AU.mus=ctx.createGain();AU.mus.gain.value=state.settings.music?.55:0;AU.mus.connect(AU.master);
 AU.sfx=ctx.createGain();AU.sfx.gain.value=state.settings.sfx?.7:0;AU.sfx.connect(AU.master);
 const len=ctx.sampleRate*1;const b=ctx.createBuffer(1,len,ctx.sampleRate);const d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=b;
 AU.next=ctx.currentTime+.1;
 AU.timer=setInterval(schedule,25);
 if(!AU.song)setSong('idle');
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f,dur,type='square',vol=.15,slide=null,at=0,dest){
 const ctx=AU.ctx;if(!ctx)return;const t=(at||ctx.currentTime);
 const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(dest||AU.sfx);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,vol=.1,freq=3000,at=0,dest,type='bandpass'){
 const ctx=AU.ctx;if(!ctx)return;const t=at||ctx.currentTime;
 const s=ctx.createBufferSource();s.buffer=AU.noise;const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;
 const g=ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 s.connect(f);f.connect(g);g.connect(dest||AU.sfx);s.start(t,Math.random()*.5);s.stop(t+dur+.02);
}
function sfx(name,arg){
 if(!AU.ctx||!state.settings.sfx)return;
 const now=AU.ctx.currentTime,thr={hit:.045,gem:.04,kill:.035,zap:.06,shoot:.07,coin:.05,boom:.09,slash:.06}[name]||0;
 if(thr){if(now-(AU.last[name]||0)<thr)return;AU.last[name]=now}
 switch(name){
  case 'click':tone(420+(arg||0)*500,.06,'triangle',.18);break;
  case 'charge':tone(880,.08,'square',.08);tone(1320,.14,'triangle',.12,null,now+.07);break;
  case 'roll':noise(.35,.12,1800,0,null,'highpass');for(let i=0;i<5;i++)tone(300+i*90,.05,'square',.05,null,now+i*.05);break;
  case 'reveal':{const r=arg||0,base=[60,64,67,72,76,79,84];for(let i=0;i<=r+1;i++)tone(mf(base[i]+(r>=4?12:0)),.22+i*.02,r>=3?'sawtooth':'triangle',.09+r*.015,null,now+i*.07);if(r>=4){noise(1.2,.08,6000,now+.3,null,'highpass');tone(mf(96),.8,'sine',.08,null,now+.45)}break}
  case 'buy':tone(988,.07,'square',.08);tone(1318,.12,'square',.08,null,now+.06);break;
  case 'deny':tone(180,.12,'square',.08,120);break;
  case 'buff':noise(.5,.1,800,0,null,'lowpass');tone(300,.5,'sawtooth',.06,1200);break;
  case 'shoot':tone(700,.04,'square',.025,300);break;
  case 'hit':noise(.04,.07,2500);break;
  case 'kill':tone(240,.09,'square',.05,70);break;
  case 'gem':tone(1100+Math.random()*300,.05,'sine',.06,1800);break;
  case 'coin':tone(1500,.05,'square',.04);tone(2000,.07,'square',.04,null,now+.04);break;
  case 'hurt':tone(160,.18,'sawtooth',.14,60);noise(.12,.1,600);break;
  case 'level':[72,76,79,84].forEach((m,i)=>tone(mf(m),.16,'square',.08,null,now+i*.06));break;
  case 'boom':noise(.5,.2,300,0,null,'lowpass');tone(110,.4,'sine',.2,35);break;

  if(it.rel)for(const k in it.rel)d[k]+=it.rel[k]*L;
  arr.push({p:RAR[it.r].p*(1+.1*(L-1)),n});}
 arr.sort((a,b)=>b.p-a.p);let left=100,P=0;for(const a of arr){const t=Math.min(left,a.n);P+=t*a.p;left-=t;if(!left)break}
 d.power=P;d.luck+=.02*Math.sqrt(P);d.speed+=.03*Math.sqrt(P);d.cap=Math.round(d.cap);

 x.globalAlpha=1;TILES[m.id]=c;return c}

const CELL=90,grid=new Map();

 for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){const a=grid.get(gk(cx,cy));if(!a)continue;
  for(let i=0;i<a.length;i++){const e=a[i];if(e.dead)continue;const dx=e.x-x,dy=e.y-y,rr=r+e.r;if(dx*dx+dy*dy<rr*rr){if(fn(e)===true)return}}}}
function nearest(x,y,maxD){let best=null,bd=maxD*maxD;for(const e of R.enemies){if(e.dead)continue;const d=(e.x-x)**2+(e.y-y)**2;if(d<bd){bd=d;best=e}}return best}
function enemiesNear(x,y,r){const out=[];for(const e of R.enemies){if(!e.dead&&(e.x-x)**2+(e.y-y)**2<r*r)out.push(e)}return out}
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d};

 const tf=1+T/60*.35;
 const hp=type==='mini'?650*R.hpM:type==='boss'?2600*R.hpM:b.hp*9*R.hpM*tf;
 const e={type,x,y,hp,maxHp:hp,spd:b.spd*(1+Math.min(.35,R.th*.02))*rnd(.92,1.08),dmg:b.dmg*R.dmgM*(1+T/RUN_LEN*.5),r:b.r,xp:b.xp,icon:R.map.en[type],
  kvx:0,kvy:0,flash:0,slow:0,st:rnd(1,2.5),orbT:0,dead:false,big:type==='mini'||type==='boss',elite:type==='elite',at:3,phase:0,dash:0,dx:0,dy:0,bob:Math.random()*6};
 if(type==='boss')R.boss=e;
 R.enemies.push(e);return e;
}
function chooseType(T){const w=[['walker',1],['runner',T>25?.55:0],['brute',T>70?.2+T/900:0],['shooter',T>100?.22:0]];
 let s=w.reduce((a,b)=>a+b[1],0)*Math.random();for(const [k,v] of w){s-=v;if(s<=0)return k}return 'walker'}
function spawnLogic(dt){
 const T=R.t;let rate=(.7+T/60*.95)*R.spawnM;if(R.bossOn)rate*=.45;
 R.spawnAcc=Math.min(6,R.spawnAcc+rate*dt);
 while(R.spawnAcc>=1){R.spawnAcc--;if(R.enemies.length>=MAXE)break;spawnEnemy(chooseType(T))}
 if(T>=R.swarmT){R.swarmT+=40;const a=Math.random()*TAU,d=Math.hypot(VW,VH)/2+60,cx=R.p.x+Math.cos(a)*d,cy=R.p.y+Math.sin(a)*d;
  const n=Math.min(30,8+Math.floor(T/15));for(let i=0;i<n&&R.enemies.length<MAXE+30;i++)spawnEnemy('swarm',cx+rnd(-70,70),cy+rnd(-70,70))}
 if(T>=R.nextElite){R.nextElite+=55;spawnEnemy('elite')}
 if(!R.miniDone&&T>=150){R.miniDone=true;spawnEnemy('mini');R.banner={t:`⚠ A champion approaches`,life:3};sfx('boss')}
 if(!R.bossOn&&T>=RUN_LEN){R.bossOn=true;spawnEnemy('boss');R.banner={t:`☠ ${R.map.boss} has arrived`,life:4};sfx('boss');setSong('boss')}
}
function fireE(x,y,a,spd,dmg,r){R.ebullets.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,dmg,r,life:5})}
function bossAI(e,dx,dy){
 e.phase=(e.phase+1)%3;const enr=e.hp<e.maxHp*.4;
 if(e.phase===0){const n=enr?26:18;for(let i=0;i<n;i++)fireE(e.x,e.y,i/n*TAU+R.t,165,e.dmg*.5,8);e.at=2.4}
 else if(e.phase===1){e.dash=.75;e.dx=dx;e.dy=dy;e.at=2.2;addText(e.x,e.y-e.r-10,'!','#ff5f7e',30)}
 else{for(let i=0;i<7;i++){const a=i/7*TAU;spawnEnemy('runner',e.x+Math.cos(a)*70,e.y+Math.sin(a)*70)}e.at=2.8}
 if(enr)e.at*=.7;
}
function updateEnemies(dt){
 const p=R.p,S=R.S,far=Math.hypot(VW,VH)*.75+220;
 for(const e of R.enemies){
  if(e.dead)continue;
  e.flash-=dt;if(e.slow>0)e.slow-=dt;
  let sp=e.spd*(e.slow>0?.5:1)*(1-S.slowWorld);
  let dx=p.x-e.x,dy=p.y-e.y;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;let mx=dx,my=dy;
  if(e.type==='shooter'){if(d<240){mx=-dx*.6-dy*.5;my=-dy*.6+dx*.5}e.st-=dt;if(e.st<=0&&d<520){e.st=rnd(2.2,3);fireE(e.x,e.y,Math.atan2(dy,dx),170,e.dmg*.8,6)}}
  else if(e.type==='mini'){e.at-=dt;if(e.at<=0){e.at=3.2;for(let i=0;i<10;i++)fireE(e.x,e.y,i/10*TAU+R.t,150,e.dmg*.6,7)}}
  else if(e.type==='boss'){e.at-=dt;if(e.at<=0)bossAI(e,dx,dy)}
  if(e.dash>0){e.dash-=dt;sp*=3.6;mx=e.dx;my=e.dy}
  e.x+=(mx*sp+e.kvx)*dt;e.y+=(my*sp+e.kvy)*dt;
  const k=Math.exp(-9*dt);e.kvx*=k;e.kvy*=k;
  if(d<e.r+p.r-3)hurt(e.dmg);
  if(d>far&&!e.big){const a=Math.atan2(p.fy,p.fx)+rnd(-1,1),dd=Math.hypot(VW,VH)/2+40;e.x=p.x+Math.cos(a)*dd;e.y=p.y+Math.sin(a)*dd}
 }
}
function separate(){
 for(const a of grid.values()){const n=a.length;if(n<2||n>40)continue;
  for(let i=0;i<n;i++){const e=a[i];for(let j=i+1;j<n;j++){const f=a[j];const dx=f.x-e.x,dy=f.y-e.y,rr=(e.r+f.r)*.8,d2=dx*dx+dy*dy;
   if(d2<rr*rr&&d2>.01){const d=Math.sqrt(d2),push=(rr-d)*.25,ux=dx/d,uy=dy/d;
    const we=e.big?.1:1,wf=f.big?.1:1;e.x-=ux*push*we;e.y-=uy*push*we;f.x+=ux*push*wf;f.y+=uy*push*wf}}}}
}
function hitEnemy(e,dmg,kx=0,ky=0,kb=0){
 if(e.dead)return;const S=R.S,p=R.p;const crit=Math.random()<S.crit;let d=dmg*(crit?2:1);
 if(S.berserk)d*=1+S.berserk*(1-p.hp/S.maxHp);
 e.hp-=d;e.flash=.08;
 if(kb){const f=e.big?.05:e.elite?.35:1;e.kvx+=kx*kb*f;e.kvy+=ky*kb*f}
 if(S.lifesteal)p.hp=Math.min(S.maxHp,p.hp+Math.min(2,d*S.lifesteal));
 if(R.texts.length<90)addText(e.x+rnd(-8,8),e.y-e.r,fmt(Math.round(d)),crit?'#ffd23f':'#ffffff',crit?18:13);
 sfx('hit');
 if(e.hp<=0)kill(e);
}
function kill(e){
 e.dead=true;R.kills++;const S=R.S,p=R.p;
 if(e.xp)addPick('xp',e.x,e.y,e.xp);
 const coins=e.type==='elite'?4:e.type==='mini'?15:e.type==='boss'?40:(Math.random()<.09?1:0);
 for(let i=0;i<coins;i++)addPick('gold',e.x+rnd(-20,20),e.y+rnd(-20,20),1);
 if(Math.random()<(e.elite?.3:.006))addPick('heart',e.x+8,e.y,1);
 if(Math.random()<.0015||e.type==='mini')addPick('magnet',e.x-8,e.y,1);
 if(e.elite||e.type==='mini')addPick('chest',e.x,e.y+10,1);
 if(S.healOnKill)p.hp=Math.min(S.maxHp,p.hp+S.healOnKill);
 burst(e.x,e.y,e.big?'#ffd23f':R.map.ebul,e.big?26:e.elite?14:5);
 sfx('kill');
 if(e.type==='mini'){R.golden+=1;addText(e.x,e.y-50,'🌟 +1 golden roll','#ffd23f',20);R.shake+=6}
 if(e.type==='boss'){R.golden+=3;R.winT=1.8;R.boss=null;R.banner={t:`🏆 ${R.map.boss} defeated!`,life:3};sfx('boom');R.shake+=14;
  for(const o of R.enemies)if(!o.dead){o.dead=true;burst(o.x,o.y,R.map.ebul,3)}R.ebullets.length=0}
}
function hurt(dmg){
 const p=R.p,S=R.S;if(p.inv>0||R.over||R.winT>0)return;
 if(Math.random()<S.dodge){p.inv=.25;addText(p.x,p.y-26,'dodge','#9fe8ff',14);return}
 const d=Math.max(1,dmg-S.armor);p.hp-=d;p.inv=.55;R.shake=Math.min(12,R.shake+5);sfx('hurt');addText(p.x,p.y-28,'-'+Math.round(d),'#ff5f7e',16);
 if(p.hp<=0){
  if(S.revive&&!R.revived){R.revived=true;p.hp=S.maxHp*S.reviveHp;p.inv=2.5;R.banner={t:'🌅 Phoenix revive!',life:2.5};sfx('boom');
   R.fx.push({k:'ring',x:p.x,y:p.y,r:0,max:300,life:.6,m:.6,col:'#ffb02e'});
   for(const e of enemiesNear(p.x,p.y,300)){if(!e.big)hitEnemy(e,e.maxHp*.6,0,0,0)}}
  else{p.hp=0;endRun(false)}
 }
}
/* ---- pickups ---- */
function addPick(type,x,y,v){R.pickups.push({type,x,y,v,mag:false,dead:false})}
function gainXp(v){R.xp+=(v+R.bankXp)*R.S.xp;R.bankXp=0;while(R.xp>=R.xpNext){R.xp-=R.xpNext;R.level++;R.xpNext=xpReq(R.level);R.pending++}sfx('gem')}
function updatePickups(dt){
 const p=R.p,S=R.S;
 if(R.pickups.length>450){let n=0;for(const k of R.pickups){if(k.type==='xp'&&!k.mag&&Math.hypot(k.x-p.x,k.y-p.y)>600){R.bankXp+=k.v;k.dead=true;if(++n>80)break}}}
 for(const k of R.pickups){if(k.dead)continue;const dx=p.x-k.x,dy=p.y-k.y,d=Math.hypot(dx,dy)||1;
  if(!k.mag&&d<S.pickup)k.mag=true;
  if(k.mag){const sp=Math.max(420,d*7);k.x+=dx/d*Math.min(d,sp*dt);k.y+=dy/d*Math.min(d,sp*dt)}
  if(d<p.r+10){k.dead=true;
   if(k.type==='xp')gainXp(k.v);
   else if(k.type==='gold'){R.gold+=S.gold;sfx('coin')}
   else if(k.type==='heart'){p.hp=Math.min(S.maxHp,p.hp+S.maxHp*.3);addText(p.x,p.y-30,'+HP','#5fd17a',16);sfx('level')}
   else if(k.type==='chest'){R.chests++;sfx('chest')}
   else if(k.type==='magnet'){for(const o of R.pickups)if(o.type==='xp'||o.type==='gold')o.mag=true;sfx('buff')}}}
}
/* ---- weapons ---- */
function shoot(x,y,a,spd,o){R.bullets.push(Object.assign({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,hit:new Set(),dead:false,age:0},o))}
function explode(x,y,r,dmg){query(x,y,r,e=>{const dx=e.x-x,dy=e.y-y,d=Math.hypot(dx,dy)||1;hitEnemy(e,dmg,dx/d,dy/d,130)});
 R.fx.push({k:'ring',x,y,r:0,max:r,life:.3,m:.3,col:'#ffb35c'});burst(x,y,'#ff8a2a',6);sfx('boom')}
function faceAng(){return Math.atan2(R.p.fy,R.p.fx)}
function fireWeapon(w,s){
 const p=R.p,S=R.S;
 switch(w.id){
  case 'sling':case 'bow':case 'firewand':{const t=nearest(p.x,p.y,720);if(!t){w.t=.15;return}const a0=Math.atan2(t.y-p.y,t.x-p.x);
   for(let i=0;i<s.n;i++)shoot(p.x,p.y,a0+(i-(s.n-1)/2)*.16,s.spd,{dmg:s.dmg,pierce:w.id==='firewand'?1:s.pierce,size:s.size,col:w.def.b.col,kind:w.id,area:s.area,life:1.6});sfx('shoot');break}
  case 'dagger':{const a0=faceAng();for(let i=0;i<s.n;i++)shoot(p.x,p.y,a0+(i-(s.n-1)/2)*.12+rnd(-.05,.05),s.spd,{dmg:s.dmg,pierce:s.pierce,size:s.size,col:w.def.b.col,kind:'dagger',life:1});sfx('shoot');break}
  case 'boomerang':{const t=nearest(p.x,p.y,700);const a0=t?Math.atan2(t.y-p.y,t.x-p.x):faceAng();
   for(let i=0;i<s.n;i++)shoot(p.x,p.y,a0+(i-(s.n-1)/2)*.4,s.spd,{dmg:s.dmg,pierce:999,size:s.size,col:w.def.b.col,kind:'boom',life:2.2,ret:.55,rehit:new Map(),spin:0});break}
  case 'sword':{const t=nearest(p.x,p.y,s.area*1.7);const base=t?Math.atan2(t.y-p.y,t.x-p.x):faceAng();w.cnt=0;for(let i=0;i<s.n+1;i++){R.zones.push({k:'slash',delay:i*.13,ang:base+((w.cnt++)%2?Math.PI:0),r:s.area,dmg:s.dmg,life:.22,m:.22,done:false,x:p.x,y:p.y})}break}
  case 'flask':{const list=enemiesNear(p.x,p.y,380);for(let i=0;i<s.n;i++){const t=list.length?pick(list):{x:p.x+rnd(-200,200),y:p.y+rnd(-200,200)};
   R.zones.push({k:'lob',sx:p.x,sy:p.y,x:t.x,y:t.y,t:0,fl:.55,r:s.area,dmg:s.dmg,life:s.dur,m:s.dur,tick:0})}break}
  case 'aura':{query(p.x,p.y,s.area,e=>{const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy)||1;hitEnemy(e,s.dmg,dx/d,dy/d,40)});break}
  case 'lightning':{const list=enemiesNear(p.x,p.y,480);if(!list.length){w.t=.2;return}for(let i=0;i<s.n;i++){const t=pick(list);
   query(t.x,t.y,s.area,e=>hitEnemy(e,s.dmg,0,0,0));R.fx.push({k:'bolt',x:t.x,y:t.y,life:.25,m:.25,seed:Math.random()})}sfx('zap');break}
  case 'turret':{for(let i=0;i<s.n;i++){R.turrets.push({x:p.x+rnd(-50,50),y:p.y+rnd(-50,50),life:s.dur,t:0,rate:s.rate*S.cd,dmg:s.dmg})}while(R.turrets.length>8)R.turrets.shift();break}
  case 'frost':{R.zones.push({k:'nova',x:p.x,y:p.y,rad:0,max:s.area,dmg:s.dmg,hit:new Set(),t:0,life:.6,m:.6});sfx('slash');break}
  case 'beam':{const t=nearest(p.x,p.y,700);const a0=t?Math.atan2(t.y-p.y,t.x-p.x):faceAng();
   for(let i=0;i<s.n;i++){const a=a0+(i-(s.n-1)/2)*.35,x2=p.x+Math.cos(a)*s.area,y2=p.y+Math.sin(a)*s.area,wd=10*Math.sqrt(S.area);
    for(const e of R.enemies){if(!e.dead&&segDist(e.x,e.y,p.x,p.y,x2,y2)<e.r+wd)hitEnemy(e,s.dmg,Math.cos(a),Math.sin(a),60)}
    R.fx.push({k:'beam',x1:p.x,y1:p.y,x2,y2,w:wd*2,life:.28,m:.28})}sfx('zap');break}
  case 'meteor':{const list=enemiesNear(p.x,p.y,520);for(let i=0;i<s.n;i++){const t=list.length?pick(list):{x:p.x+rnd(-300,300),y:p.y+rnd(-300,300)};
   R.zones.push({k:'meteor',x:t.x+rnd(-20,20),y:t.y+rnd(-20,20),t:0,delay:.8,r:s.area,dmg:s.dmg,done:false,life:1,m:.3})}break}
  case 'blackhole':{const n=Math.min(3,1+Math.floor(w.lvl/4)+Math.floor(S.proj/2));for(let i=0;i<n;i++){const t=nearest(p.x+rnd(-150,150),p.y+rnd(-150,150),420);
   const x=t?t.x:p.x+p.fx*200,y=t?t.y:p.y+p.fy*200;R.zones.push({k:'hole',x,y,life:s.dur,m:s.dur,r:s.area,dmg:s.dmg,tick:0})}sfx('portal');break}
 }
}
function updateWeapons(dt){
 const p=R.p,S=R.S;
 for(const w of R.weapons){const s=wStats(w);
  if(w.id==='orbs'){w.ang+=dt*(2.6+w.lvl*.12);w.pos.length=0;const sz=13*Math.sqrt(S.area);
   for(let i=0;i<s.n;i++){const a=w.ang+i/s.n*TAU,x=p.x+Math.cos(a)*s.area,y=p.y+Math.sin(a)*s.area;w.pos.push(x,y);
    query(x,y,sz,e=>{if(e.orbT>R.t)return;e.orbT=R.t+.45;hitEnemy(e,s.dmg,(e.x-p.x)/s.area,(e.y-p.y)/s.area,170)})}continue}
  if(w.id==='aura')w.rad=s.area;
  w.t-=dt;if(w.t>0)continue;w.t=s.cd;fireWeapon(w,s);
 }
}
function updateBullets(dt){
 const p=R.p;
 for(const b of R.bullets){if(b.dead)continue;b.age+=dt;
  if(b.kind==='boom'){b.spin+=dt*18;if(b.age>b.ret){const dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy)||1;b.vx+=(dx/d*620-b.vx)*Math.min(1,dt*5);b.vy+=(dy/d*620-b.vy)*Math.min(1,dt*5);if(d<22){b.dead=true;continue}}}
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
  if(b.life<=0){b.dead=true;if(b.kind==='firewand')explode(b.x,b.y,b.area,b.dmg);continue}
  const sp=Math.hypot(b.vx,b.vy)||1;
  query(b.x,b.y,b.size,e=>{
   if(b.kind==='boom'){const last=b.rehit.get(e);if(last!==undefined&&R.t-last<.4)return;b.rehit.set(e,R.t);hitEnemy(e,b.dmg,b.vx/sp,b.vy/sp,70);return}
   if(b.hit.has(e))return;b.hit.add(e);
   if(b.kind==='firewand'){b.dead=true;explode(b.x,b.y,b.area,b.dmg);return true}
   hitEnemy(e,b.dmg,b.vx/sp,b.vy/sp,90);if(--b.pierce<=0){b.dead=true;return true}});
 }
 for(const b of R.ebullets){if(b.dead)continue;b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0){b.dead=true;continue}
  if(Math.hypot(b.x-p.x,b.y-p.y)<b.r+p.r-2){b.dead=true;hurt(b.dmg)}}
}
function updateZones(dt){
 const p=R.p;
 for(const z of R.zones){
  switch(z.k){
   case 'slash':z.x=p.x;z.y=p.y;if(z.delay>0){z.delay-=dt;continue}
    if(!z.done){z.done=true;query(p.x,p.y,z.r,e=>{const a=Math.atan2(e.y-p.y,e.x-p.x),d=Math.hypot(e.x-p.x,e.y-p.y);if(Math.abs(angDiff(a,z.ang))<1.2||d<e.r+20)hitEnemy(e,z.dmg,Math.cos(a),Math.sin(a),150)});sfx('slash')}
    z.life-=dt;break;
   case 'lob':z.t+=dt;if(z.t>=z.fl){z.k='puddle';burst(z.x,z.y,'#9dff5c',6)}break;
   case 'puddle':z.life-=dt;z.tick-=dt;if(z.tick<=0){z.tick=.4;query(z.x,z.y,z.r,e=>{hitEnemy(e,z.dmg,0,0,0);e.slow=Math.max(e.slow,.3)})}break;
   case 'nova':z.t+=dt;z.rad=z.max*Math.min(1,z.t/.45);query(z.x,z.y,z.rad,e=>{if(z.hit.has(e))return;z.hit.add(e);e.slow=1.6;const dx=e.x-z.x,dy=e.y-z.y,d=Math.hypot(dx,dy)||1;hitEnemy(e,z.dmg,dx/d,dy/d,90)});z.life-=dt;break;
   case 'meteor':z.t+=dt;if(!z.done&&z.t>=z.delay){z.done=true;z.life=.3;explode(z.x,z.y,z.r,z.dmg);R.shake=Math.min(12,R.shake+3)}if(z.done)z.life-=dt;break;
   case 'hole':z.life-=dt;z.tick-=dt;
    query(z.x,z.y,z.r*1.5,e=>{if(e.big)return;const dx=z.x-e.x,dy=z.y-e.y,d=Math.hypot(dx,dy)||1;const pull=Math.min(d,(e.elite?60:150)*dt);e.x+=dx/d*pull;e.y+=dy/d*pull});
    if(z.tick<=0){z.tick=.25;query(z.x,z.y,z.r,e=>hitEnemy(e,z.dmg,0,0,0))}break;
  }
 }
 for(const t of R.turrets){t.life-=dt;t.t-=dt;if(t.t<=0){const e=nearest(t.x,t.y,320);if(e){t.t=t.rate;hitEnemy(e,t.dmg,0,0,0);R.fx.push({k:'line',x1:t.x,y1:t.y-14,x2:e.x,y2:e.y,life:.12,m:.12,col:'#7ff3ff',w:2.5});sfx('zap')}else t.t=.2}}
}
function burst(x,y,col,n){if(R.fx.length>380)return;for(let i=0;i<n;i++){const a=Math.random()*TAU,s=rnd(40,180);R.fx.push({k:'p',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.25,.55),m:.55,col,size:rnd(2,4.5)})}}
function addText(x,y,t,col,size){R.texts.push({x,y,t,col,size,life:.75})}
function updateFx(dt){
 for(const f of R.fx){f.life-=dt;if(f.k==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.92;f.vy*=.92}else if(f.k==='ring')f.r=f.max*(1-f.life/f.m)}
 for(const t of R.texts){t.life-=dt;t.y-=38*dt}
 R.shake=Math.max(0,R.shake-dt*30);
 if(R.banner){R.banner.life-=dt;if(R.banner.life<=0)R.banner=null}
 if(R.tip){R.tip.life-=dt;if(R.tip.life<=0)R.tip=null}

function cleanup(){

function runUpdate(dt){
 const p=R.p,S=R.S;
 R.t+=dt;
 let mx=0,my=0;
 if(keys.a||keys.arrowleft)mx-=1;if(keys.d||keys.arrowright)mx+=1;if(keys.w||keys.arrowup)my-=1;if(keys.s||keys.arrowdown)my+=1;
 if(joy.on){const dx=joy.x-joy.sx,dy=joy.y-joy.sy,d=Math.hypot(dx,dy);if(d>8){mx=dx/Math.max(d,50);my=dy/Math.max(d,50)}}
 const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}
 if(ml>0.05){p.x+=mx*S.speed*dt;p.y+=my*S.speed*dt;const l=Math.hypot(mx,my);p.fx=mx/l;p.fy=my/l;p.mv+=dt}
 p.hp=Math.min(S.maxHp,p.hp+S.regen*dt);p.inv-=dt;
 if(R.winT>0){R.winT-=dt;if(R.winT<=0){endRun(true);return}}
 else spawnLogic(dt);
 updateEnemies(dt);buildGrid();separate();
 updateWeapons(dt);updateBullets(dt);updateZones(dt);updatePickups(dt);updateFx(dt);cleanup();

}

function buildChoices(){

 for(const w of R.weapons)if(w.lvl<8)opts.push({k:'wup',id:w.id,wt:1.1});
 for(const p of R.passives)if(p.lvl<5)opts.push({k:'pup',id:p.id,wt:1});
 if(R.weapons.length<6)for(const it of ITEMS)if(it.cat==='weapon'&&owned(it.id)&&!R.weapons.find(w=>w.id===it.id))opts.push({k:'wnew',id:it.id,wt:1.25});
 if(R.passives.length<6)for(const it of ITEMS)if(it.cat==='passive'&&owned(it.id)&&!R.passives.find(p=>p.id===it.id))opts.push({k:'pnew',id:it.id,wt:1.1});
 const n=3+U('choice'),out=[];
 while(out.length<n&&opts.length){let s=opts.reduce((a,b)=>a+b.wt,0)*Math.random(),i=0;for(;i<opts.length-1;i++){s-=opts[i].wt;if(s<=0)break}out.push(opts.splice(i,1)[0])}

 while(out.length<n)out.push(fill.pop());

 for(const wp of R.weapons){g.fillStyle='rgba(0,0,0,.45)';g.fillRect(x-1,y-1,ic+2,ic+2);g.strokeStyle=RCOL[wp.def.r];g.lineWidth=2;g.strokeRect(x-1,y-1,ic+2,ic+2);g.drawImage(spr(wp.def.icon,48),x+1,y+1,ic-2,ic-2);
  g.font='700 10px "Pixelify Sans",monospace';g.textAlign='right';st(wp.lvl,x+ic+1,y+ic-2);x+=ic+6}
 x=10;y+=ic+6;
 for(const pp of R.passives){g.fillStyle='rgba(0,0,0,.45)';g.fillRect(x-1,y-1,ic+2,ic+2);g.strokeStyle=RCOL[pp.def.r];g.lineWidth=2;g.strokeRect(x-1,y-1,ic+2,ic+2);g.drawImage(spr(pp.def.icon,48),x+1,y+1,ic-2,ic-2);
  g.font='700 10px "Pixelify Sans",monospace';g.textAlign='right';st(pp.lvl,x+ic+1,y+ic-2);x+=ic+6}
 // boss bar
 const bb=R.boss||R.enemies.find(e=>e.type==='mini'&&!e.dead);
 if(bb&&!bb.dead){const bw=Math.min(520,w*.7),bx=(w-bw)/2,by=h-SAT*0-48-(parseFloat(getComputedStyle(document.documentElement).paddingBottom)||0);
  g.fillStyle='rgba(0,0,0,.6)';g.fillRect(bx-2,by-2,bw+4,14);g.fillStyle='#ff4f7b';g.fillRect(bx,by,bw*Math.max(0,bb.hp/bb.maxHp),10);
  g.textAlign='center';g.font='700 14px "Pixelify Sans",monospace';st(`${bb.icon} ${bb.type==='boss'?R.map.boss:'Champion'}`,w/2,by-12)}
 if(R.banner){g.globalAlpha=Math.min(1,R.banner.life);g.textAlign='center';g.font='700 26px "Pixelify Sans",monospace';st(R.banner.t,w/2,h*.3,'#ffe08a');g.globalAlpha=1}
 if(R.tip){g.globalAlpha=Math.min(1,R.tip.life);g.textAlign='center';g.font='600 14px "Sora",sans-serif';st(R.tip.t,w/2,h-90,'#fff');g.globalAlpha=1}
 if(joy.on){g.globalAlpha=.35;g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.arc(joy.sx,joy.sy,50,0,TAU);g.stroke();const dx=joy.x-joy.sx,dy=joy.y-joy.sy,d=Math.min(50,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);
  g.fillStyle='#fff';g.beginPath();g.arc(joy.sx+Math.cos(a)*d,joy.sy+Math.sin(a)*d,20,0,TAU);g.fill();g.globalAlpha=1}
}

/* ================= main loop & boot ================= */
let lastT=performance.now(),uiAcc=0,saveAcc=0,autoAcc=0;
function frame(ts){
 let dt=(ts-lastT)/1000;lastT=ts;if(!(dt>0))dt=0;dt=Math.min(.05,dt);
 idleTick(dt);
 if(R){if(!R.modal&&!R.over)runUpdate(dt);if(R)draw()}
 uiAcc+=dt;if(uiAcc>.1){uiAcc=0;if(!R){renderAltarLive();renderChips();renderObjective()}}
 autoAcc+=dt;if(!R&&state.auto&&U('auto')&&autoAcc>1.4&&state.charges>=1&&!rolling&&!$('#modal').classList.contains('on')){autoAcc=0;doRoll(U('multi')&&state.charges>=10?10:1)}
 saveAcc+=dt;if(saveAcc>5){saveAcc=0;save();cloudPush()}
 requestAnimationFrame(frame);
}
(function boot(){
 const s=loadLocal();if(s)adopt(s);
 applyOffline(false);resize();syncSoundBtns();
 if(state.totalRolls>=3&&state.runs===0)curTab='exp';
 refreshAll();
 if(!state.introSeen)showIntro();
 requestAnimationFrame(frame);
 cloudInit();
})();
</script></body></html>
