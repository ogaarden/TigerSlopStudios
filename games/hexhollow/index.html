:root { --bg:#07050e; --panel:#141028; --edge:#3a2a6a; --ink:#e8e0ff; --dim:#8a7ab8; --gold:#ffe07a; color-scheme: dark; }
html, body { height: 100%; }

#help { font-size: 8px; color: var(--dim); letter-spacing: .04em; text-align: center; line-height: 1.8; max-width: 90ch; }
#help b { color: var(--gold); font-weight: normal; }
#pad { display: none; width: 100%; max-width: 560px; justify-content: space-between; align-items: center; }
.coarse #pad { display: flex; }
.coarse #help { display: none; }

.btns { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 52px); gap: 6px; }

.b.big { border-color: #b04aff; }
.b:focus-visible { outline: 2px solid var(--gold); }

(function () {
  const coarse = matchMedia('(pointer: coarse)').matches;
  if (coarse) document.documentElement.classList.add('coarse');
  const cv = document.getElementById('game');
  function fit() {
    const padH = coarse ? 170 : 44;
    const aw = Math.min(innerWidth - 32, 1280), ah = innerHeight - padH - 16;
    let s = Math.min(aw / 320, ah / 240);
    if (s >= 2) s = Math.floor(s);
    s = Math.max(0.8, s);
    cv.style.width = Math.round(320 * s) + 'px'; cv.style.height = Math.round(240 * s) + 'px';
  }
  addEventListener('resize', fit); fit();
  document.querySelectorAll('#pad .b').forEach(b => {
    const k = b.dataset.k;
    const on = e => { e.preventDefault(); b.classList.add('on'); window.__touch && window.__touch(k, true); };
    const off = e => { e.preventDefault(); b.classList.remove('on'); window.__touch && window.__touch(k, false); };
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
  });
  cv.focus();
})();

});
function famBoss(name, w, h, frames, fam, back, front) {
  big(name, w, h, frames, (o, f) => { back(o, f); const [rows, pal] = FAM_ROWS[fam]; const cx = Math.floor(w / 2 - 8), cy = Math.floor(h / 2 - 8) + (front ? front.dy || 0 : 0);
    o.rows(rows, pal, cx, cy); for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const c = o.get(cx + x, cy + y); if (c === '#231a3a' || c === '#ff7a2a') o.p(cx + x, cy + y, '#ff2a4a'); } if (front && front.fn) front.fn(o, f, cx, cy); });
}

    for (let y = 0; y < 240; y += 2) for (let x = (y / 2) % 2; x < 320; x += 4) if (hash(x, y, 77) < y / 240 * 0.5) { g.fillStyle = A.bg2; g.fillRect(x, y, 1, 1); }
    const sil = (col, fn) => { g.fillStyle = col; fn(); };
    const o = PX(320, 240);
    if (area === 'hollow' || area === 'secret') {
      for (let i = 0; i < 7; i++) { const x = i * 48 + hash(i, 1) * 20, h = 70 + hash(i, 2) * 80; o.rect(x + 14, 240 - h, 8, h, A.bg2); o.ell(x + 18, 240 - h, 22 + hash(i, 3) * 10, 12, A.bg2); }
      for (let i = 0; i < 40; i++) o.p(hash(i, 5) * 320, hash(i, 6) * 160, '#3a4a70');
    } else if (area === 'fen') {
      for (let i = 0; i < 6; i++) { const x = i * 56 + hash(i, 1) * 20, h = 60 + hash(i, 2) * 100; o.rect(x + 16, 240 - h, 10, h, A.bg2); o.ell(x + 21, 240 - h, 26, 16, '#2a1e30'); for (let k = 0; k < 4; k++) o.ell(x + 10 + k * 7, 240 - h - 6 + (k % 2) * 4, 2, 2, '#3a2a40'); }
    } else if (area === 'library') {
      for (let x = 0; x < 320; x += 40) { o.rect(x + 4, 20, 32, 220, A.bg2); for (let y = 30; y < 240; y += 22) { o.rect(x + 4, y + 16, 32, 3, '#0a0c1c'); for (let b = 0; b < 8; b++) { const hh = 10 + hash(x + b, y) * 5; o.rect(x + 6 + b * 3.7, y + 16 - hh, 3, hh, ['#2a2050', '#3a1a30', '#1a3040', '#30301a'][Math.floor(hash(b, y, x) * 4)]); } } }
    } else if (area === 'forge') {
      for (let i = 0; i < 8; i++) { const x = hash(i, 1) * 320; for (let y = 0; y < 120 + hash(i, 2) * 80; y += 6) o.ell(x, y, 2, 3, '#2a1210'); }
      for (let x = 0; x < 320; x++) { const h = 20 + Math.sin(x * 0.05) * 8 + hash(x, 3) * 4; o.rect(x, 240 - h, 1, h, '#3a1408'); }
    } else if (area === 'candy') {
      for (let i = 0; i < 6; i++) { const x = i * 56 + 20, h = 80 + hash(i, 2) * 70; o.rect(x, 240 - h, 3, h, '#5a2a6a'); o.ell(x + 1, 240 - h - 10, 14, 14, '#5a2a70'); o.ell(x + 1, 240 - h - 10, 9, 9, '#6a3080'); o.ell(x + 1, 240 - h - 10, 4, 4, '#5a2a70'); }
      for (let i = 0; i < 30; i++) o.p(hash(i, 5) * 320, hash(i, 6) * 200, '#ff9ad0');
    } else if (area === 'sky') {
      for (let i = 0; i < 9; i++) { const x = hash(i, 1) * 320, y = 40 + hash(i, 2) * 170, r = 14 + hash(i, 3) * 16; for (let k = 0; k < 4; k++) o.ell(x + k * r * 0.7, y + (k % 2) * 4, r, r * 0.6, '#d8ecff'); }
    } else if (area === 'spire') {
      for (let i = 0; i < 90; i++) o.p(hash(i, 5) * 320, hash(i, 6) * 240, hash(i, 7) < 0.2 ? '#ffd84a' : '#6a5a9a');
      for (let i = 0; i < 5; i++) { const x = i * 70 + 10; const h = 60 + hash(i, 1) * 60; o.rect(x, 0, 24, h, '#140f24'); o.tri(x - 4, h, x + 28, h, x + 12, h + 30, '#140f24'); for (let w = 0; w < 3; w++) o.rect(x + 5 + w * 6, 10 + w * 12, 3, 5, '#3a2a5a'); }
    }
    g.drawImage(o.canvas(), 0, 0);
    return cache[area] = c;
  }
  return { get };
})();

// ===== GAME ENGINE =====
(() => {
'use strict';

addEventListener('keydown', e => { const a = KEYMAP[e.code]; AU.init(); if (a) { e.preventDefault(); press(a, true); } });
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) { e.preventDefault(); press(a, false); } });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ---------------- STATE ----------------
let S = null;          // persistent save data
let R = null;          // current room runtime
let P = null;          // player runtime
const G = {
  mode: 'title', t: 0, menuTab: 0, famSel: 0, titleSel: 0, cam: { x: 0, y: 0 }, shake: 0, flash: 0, flashCol: '#fff',
  toast: null, banner: null, dlg: null, fade: 0, fadeCb: null, fadeDir: 0, ending: null, deadT: 0, hint: null,
  flag: k => !!(S && S.flags[k]), has: a => !!(S && S.abil[a]), seals: () => S ? S.seals.length : 0, fams: () => S ? S.fams.length : 0,
  knickTalk: () => knickTalk(),
};
function freshSave() {
  return { room: 'H1', px: 0, py: 0, gdir: 1, hp: 6, maxhp: 6, exp: 0, fams: [], abil: {}, seals: [], items: {}, trinkets: [], flags: {}, visited: {}, time: 0, deaths: 0, saved: false };
}
const SAVEKEY = 'hexhollow_save_v1';
function hasSave() { try { return !!localStorage.getItem(SAVEKEY); } catch (e) { return false; } }
function writeSave() { try { localStorage.setItem(SAVEKEY, JSON.stringify(S)); } catch (e) { } }
function readSave() { try { const s = localStorage.getItem(SAVEKEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
let lastCheckpoint = null; // in-memory copy, used when storage is unavailable

// ---------------- LEVEL ----------------
const LV = [0, 12, 30, 52];
const level = () => S.exp >= LV[2] ? 3 : S.exp >= LV[1] ? 2 : 1;
function addExp(n) { const l0 = level(); S.exp = Math.min(LV[3], S.exp + n); if (level() > l0) { AU.sfx('lvup'); popText(cxOf(P), P.y - 8, 'LEVEL UP!', '#ffe04a'); } }
function loseExp(n) { const l0 = level(); S.exp = Math.max(0, S.exp - n); if (level() < l0) { AU.sfx('lvdown'); popText(cxOf(P), P.y - 8, 'LEVEL DOWN', '#ff6a8a'); } }

// ---------------- ROOM ----------------
const TILECH = new Set(['#', '.', '=', '^', 'v', 'C', 'X', 'F', 'B', 'L', 'U', 'H']);
const ENEMY = { a: 'hopper', b: 'bat', c: 'crawler', d: 'spitter', f: 'book', g: 'gumdrop', j: 'jelly', l: 'imp', q: 'roller', r: 'golemite', t: 'toad', u: 'chick', k: 'cloud', y: 'ghost', z: 'knight', x: 'hatbat' };
const SOLIDSET = new Set(['#', 'C', 'X', 'U', 'B', 'W', 'g']);
const Tt = (tx, ty) => (ty < 0 || ty >= R.H || tx < 0 || tx >= R.W) ? null : R.tiles[ty][tx];
function solidP(tx, ty) { const t = Tt(tx, ty); if (t === null) return false; if (SOLIDSET.has(t)) return true; if (t === 'F') return P.dashT <= 0; return false; }
function solidE(tx, ty) { const t = Tt(tx, ty); if (t === null) return true; return SOLIDSET.has(t) || t === 'F' || t === 'H'; }
function solidB(tx, ty) { const t = Tt(tx, ty); if (t === null) return true; return SOLIDSET.has(t) || t === 'F'; }

function loadRoom(id) {
  const def = ROOMS[id]; const W = def.w * CW, H = def.h * CH;
  R = { id, def, W, H, area: def.area, tiles: [], ents: [], enemies: [], gel: [], locks: [], boss: null, pb: [], eb: [], parts: [], pops: [], beams: [], haz: null, bossSpawn: null, bossPending: false, amb: [] };
  const cnt = { n: 0, $: 0, i: 0, D: 0, h: 0 };
  for (let y = 0; y < H; y++) {
    const row = [];
    for (let x = 0; x < W; x++) {
      const ch = def.map[y][x];
      if (TILECH.has(ch)) row.push(S.flags['t_' + id + '_' + x + '_' + y] ? '.' : ch);
      else { row.push('.'); spawnChar(ch, x, y, cnt); }
    }
    R.tiles.push(row);
  }
  computeWind(); redraw();
  if (R.bossSpawn && def.boss && !S.flags['boss_' + def.boss]) R.bossPending = true;
  if (!R.bossPending) AU.play(AREAS[R.area].music);
  if (G.lastArea !== def.area || !S.visited[id]) G.toast = { t: 150, text: def.name, small: true }; G.lastArea = def.area;
  S.visited[id] = true;
  for (let i = 0; i < 26; i++) R.amb.push({ x: rnd(0, W * TS), y: rnd(0, H * TS), vx: rnd(-0.2, 0.2), vy: rnd(-0.3, 0.3), ph: rnd(0, 6) });
}
function redraw() { R.cache = TILE.drawRoom(R.tiles, R.W, R.H, R.area); }
function computeWind() {
  R.wind = R.tiles.map(r => r.map(() => false));
  for (let y = 0; y < R.H; y++) for (let x = 0; x < R.W; x++) if (R.tiles[y][x] === 'U') {
    for (let yy = y - 1; yy >= 0; yy--) { const t = R.tiles[yy][x]; if (SOLIDSET.has(t) && t !== 'g') break; R.wind[yy][x] = true; }
  }
}
function spawnChar(ch, x, y, cnt) {
  const px = x * TS, py = y * TS, def = R.def, id = R.id;
  if (ch === 'p') return;

  if (ch === 'h') { const k = cnt.h++, key = 'cap_' + id + '_' + k; if (!S.flags[key]) R.ents.push({ kind: 'pickup', item: 'capsule', key, x: px, y: py, w: 16, h: 16 }); return; }
  if (ch === 'i') { const it = def.items[cnt.i++], key = 'item_' + it; if (!S.items[it]) R.ents.push({ kind: 'pickup', item: it, key, x: px, y: py, w: 16, h: 16 }); return; }
  if (ch === '$') { const tr = def.trinkets[cnt.$++]; if (!S.trinkets.includes(tr)) R.ents.push({ kind: 'trinket', id: tr, x: px, y: py, w: 16, h: 16 }); return; }
  if (ch === 'n') { const nid = def.npcs[cnt.n++], nd = NPCS[nid], img = SPR[nd.spr][0]; const w = img.width, h = img.height;
    R.ents.push({ kind: 'npc', id: nid, def: nd, x: px + 8 - w / 2, y: py + 16 - h, w, h, face: -1 }); return; }
  if (ch === 'D') { const d = def.doors[cnt.D++]; const big = d.need === 'seals'; const w = big ? 24 : 20, h = big ? 36 : 32;
    R.ents.push({ kind: 'door', d, x: px + 8 - w / 2, y: py + 16 - h, w, h, idx: cnt.D - 1 }); return; }
  if (ch === 'Z') { R.bossSpawn = { x: px + 8, y: py + 16 }; return; }
  if (ENEMY[ch]) R.enemies.push(makeEnemy(ENEMY[ch], px, py));
}

// ---------------- PHYSICS ----------------
function moveBox(o, solid) {
  let hitX = false, hitY = false, landed = false, bounce = false;
  o.x += o.vx;
  let y0 = Math.floor(o.y / TS), y1 = Math.floor((o.y + o.h - 0.01) / TS);
  if (o.vx > 0) { const tx = Math.floor((o.x + o.w - 0.01) / TS); for (let ty = y0; ty <= y1; ty++) if (solid(tx, ty)) { o.x = tx * TS - o.w; hitX = true; break; } }
  else if (o.vx < 0) { const tx = Math.floor(o.x / TS); for (let ty = y0; ty <= y1; ty++) if (solid(tx, ty)) { o.x = (tx + 1) * TS; hitX = true; break; } }
  const py = o.y; o.y += o.vy; const g = o.gdir || 1;
  const x0 = Math.floor(o.x / TS), x1 = Math.floor((o.x + o.w - 0.01) / TS);
  if (o.vy > 0) { const ty = Math.floor((o.y + o.h - 0.01) / TS); for (let tx = x0; tx <= x1; tx++) { const t = Tt(tx, ty);
      if (solid(tx, ty) || (t === '=' && g === 1 && !o.drop && py + o.h <= ty * TS + 0.5)) { o.y = ty * TS - o.h; hitY = true; if (g === 1) landed = true; for (let k = x0; k <= x1; k++) if (Tt(k, ty) === 'B') bounce = true; break; } } }
  else if (o.vy < 0) { const ty = Math.floor(o.y / TS); for (let tx = x0; tx <= x1; tx++) { const t = Tt(tx, ty);
      if (solid(tx, ty) || (t === '=' && g === -1 && !o.drop && py >= (ty + 1) * TS - 0.5)) { o.y = (ty + 1) * TS; hitY = true; if (g === -1) landed = true; for (let k = x0; k <= x1; k++) if (Tt(k, ty) === 'B') bounce = true; break; } } }
  if (hitY) o.vy = 0;
  return { hitX, hitY, landed, bounce };
}

// ---------------- PARTICLES ----------------
function part(x, y, vx, vy, col, life = 30, size = 2, grav = 0) { if (R.parts.length < 400) R.parts.push({ x, y, vx, vy, col, life, max: life, size, grav }); }
function burst(x, y, col, n = 10, spd = 2, life = 25, size = 2, grav = 0.05) { for (let i = 0; i < n; i++) { const a = rnd(0, Math.PI * 2), s = rnd(0.3, spd); part(x, y, Math.cos(a) * s, Math.sin(a) * s, col, life * rnd(0.6, 1.2), size, grav); } }
function popText(x, y, text, col) { R.pops.push({ x, y, text, col, t: 60 }); }
function shake(n) { G.shake = Math.max(G.shake, n); }

// ---------------- PLAYER ----------------
function newPlayer(x, y) { return { x, y, w: 10, h: 14, vx: 0, vy: 0, face: 1, gdir: 1, onGround: false, coyote: 0, jumpBuf: 0, djUsed: false, dashT: 0, dashReady: true,
  levT: 0, inv: 0, knockT: 0, shootCd: 0, flipCd: 0, dropT: 0, cut: false, anim: 0, safe: { x, y, g: 1 }, hist: [], lev: false, hazT: 0, dead: false }; }
function hurtPlayer(dmg, srcX) {
  if (P.inv > 0 || P.dead || G.mode !== 'play') return;
