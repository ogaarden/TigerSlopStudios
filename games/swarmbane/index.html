 const bo=S.en.find(e=>e.boss);$('bossb').hidden=!bo;if(bo){$('bossn').textContent=BUGS[bo.k].n;$('bossf').style.width=Math.max(0,bo.hp/bo.mhp*100)+'%'}}
const fmt=t=>(t/60|0)+':'+((t%60|0)+'').padStart(2,'0');
/* ================= SCREENS ================= */
const ov=$('ov');function show(h){ov.innerHTML=h;ov.hidden=false;const b=ov.querySelector('button');if(b)b.focus()}
function setPlayUI(on){$('hud').hidden=!on;$('bio').hidden=!on;$('pz').hidden=!on}
function menu(){mode='menu';S=null;setPlayUI(false);show(`<div class="card"><h1>Swarmbane</h1><p class="c">The forest floor has woken hungry. Hold the line against the giant bugs for ten minutes, then outlast the true swarm.</p>
<p class="c amb">⬢ ${META.amber} amber${META.best?'<span class="dim" style="color:var(--bone)"> — longest hunt '+fmt(META.best)+'</span>':''}</p>
<button class="big" id="mPlay">Start a hunt</button><button class="big" id="mArm">Armory</button><button class="big" id="mGuide">Field guide</button></div>`);
 $('mPlay').onclick=()=>{sfx('click');chars()};$('mArm').onclick=()=>{sfx('click');armory()};$('mGuide').onclick=()=>{sfx('click');guide()}}
function chars(){show(`<div class="card wide"><h2 class="c">Choose your hunter</h2><p class="c amb">⬢ ${META.amber} amber</p><div class="grid">${Object.entries(HEROES).map(([k,h])=>{const own=META.unl.includes(k);
 return`<div class="hero"><canvas data-h="${k}" width="192" height="192"></canvas><h3>${h.n}</h3><div class="dim">${h.t}</div><p>${h.d}</p>${own?`<button data-p="${k}">Hunt as ${h.n}</button>`:`<button data-u="${k}" ${META.amber<h.cost?'disabled':''}>Unlock for ⬢ ${h.cost}</button>`}</div>`}).join('')}</div><button class="big" id="back">Back</button></div>`);
 ov.querySelectorAll('canvas[data-h]').forEach(cn=>{const x=cn.getContext('2d');x.scale(4,4);x.translate(24,26);drawHero(x,HEROES[cn.dataset.h],0,0)});
 ov.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{hero=b.dataset.p;start()});
 ov.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const h=HEROES[b.dataset.u];if(META.amber>=h.cost){META.amber-=h.cost;META.unl.push(b.dataset.u);saveM();sfx('chest');chars()}});$('back').onclick=menu}
function armory(){const spent=MU.reduce((a,[k,,,,c])=>{let s=0;for(let i=0;i<up(k);i++)s+=c*(i+1);return a+s},0);
 show(`<div class="card wide"><h2 class="c">Armory</h2><p class="c">Permanent upgrades for every future hunt. <span class="amb">⬢ ${META.amber} amber</span></p>${MU.map(([k,n,d,mx,cst])=>{const r=up(k),cost=cst*(r+1);
 return`<div class="mrow"><div><b>${n}</b> <span class="pips">${'◆'.repeat(r)}${'◇'.repeat(mx-r)}</span><div class="dim">${d}</div></div><button data-k="${k}" ${r>=mx||META.amber<cost?'disabled':''}>${r>=mx?'Maxed':'⬢ '+cost}</button></div>`}).join('')}
 <div class="btns" style="margin-top:12px"><button id="refund" ${spent?'':'disabled'}>Refund all (⬢ ${spent})</button><button id="back">Back</button></div></div>`);
 ov.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const m=MU.find(u=>u[0]==b.dataset.k),r=up(m[0]),cost=m[4]*(r+1);if(META.amber>=cost&&r<m[3]){META.amber-=cost;META.up[m[0]]=r+1;saveM();sfx('coin');armory()}});
 $('refund').onclick=()=>{META.amber+=spent;META.up={};saveM();sfx('click');armory()};$('back').onclick=menu}
function guide(){show(`<div class="card wide"><h2 class="c">Field guide</h2><p>Move with WASD or the arrow keys, or drag anywhere on a touch screen. Weapons fire on their own. Press P or Esc to pause and M to mute.</p>
<p>Gather ichor gems to level up and pick boons: up to six weapons and six relics. Elites with a golden ring and bosses drop treasure chests. A chest evolves a maxed weapon if you also carry its paired relic.</p>
<p>After ten minutes the swarm awakens and grows far deadlier every second. When you fall, you earn amber for time survived, bugs slain, level, bosses and amber picked up. Spend it in the Armory.</p>
<h3>Biomes</h3>${BIO.map(b=>`<p><b>${b.n}.</b> ${b.e}</p>`).join('')}<h3>Evolutions</h3>${Object.values(WP).map(w=>`<p>${w.i} ${w.n} + ${PS[w.pair].i} ${PS[w.pair].n} → <b>${w.ev}</b></p>`).join('')}<button class="big" id="back">Back</button></div>`);$('back').onclick=menu}
function start(){initAudio();if(AC)AC.resume();newGame();mode='play';ov.hidden=true;setPlayUI(true);$('bion').textContent=BIO[0].n;$('bioe').textContent=BIO[0].e;inv();keys={};banner(HEROES[hero].n+' '+HEROES[hero].t,'Survive the swarm')}
function pauseUI(){if(mode!='play'||S.pause)return;S.pause=true;S.paused=1;show(`<div class="card"><h2 class="c">Paused</h2><p class="c">${fmt(S.t)} survived, level ${S.lvl}, ${S.kills} bugs slain</p>
<p>${Object.entries(S.w).map(([k,v])=>WP[k].i+' '+(v.lv>5?'<b>'+WP[k].ev+'</b>':WP[k].n+' '+v.lv)+(v.lv==5?' <span class="dim">(chest evolves it with '+PS[WP[k].pair].n+')</span>':'')).join('<br>')}</p>
<p>${Object.entries(S.p).map(([k,v])=>PS[k].i+' '+PS[k].n+' '+v.lv).join('<br>')||'<span class="dim">No relics yet</span>'}</p>
<button class="big" id="res">Resume</button><button class="big" id="quit">End the hunt</button></div>`);$('res').onclick=resume;$('quit').onclick=()=>{resume();endRun()}}
function resume(){if(!S||!S.paused)return;S.paused=0;S.pause=false;ov.hidden=true}
function endRun(){if(mode!='play')return;mode='dead';sfx('dead');const g1=Math.floor(S.t/4),g2=Math.floor(S.kills/15),g3=S.lvl*3,g4=S.bossK*40,g5=S.t>=600?150:0,g6=Math.floor(S.amb),gm=1+.1*up('greed'),tot=Math.round((g1+g2+g3+g4+g5+g6)*gm);
 META.amber+=tot;META.runs++;const rec=S.t>META.best;if(rec)META.best=S.t;saveM();setPlayUI(false);
 show(`<div class="card"><h2 class="c">${S.t>=600?'Fallen to the true swarm':'Devoured'}</h2><p class="c">${rec?'A new longest hunt! ':''}You lasted ${fmt(S.t)} and reached level ${S.lvl}.</p>
<div class="mrow"><span>Time survived</span><b>${g1}</b></div><div class="mrow"><span>${S.kills} bugs slain</span><b>${g2}</b></div><div class="mrow"><span>Level ${S.lvl}</span><b>${g3}</b></div><div class="mrow"><span>${S.bossK} bosses felled</span><b>${g4}</b></div>${g5?'<div class="mrow"><span>Ten-minute bonus</span><b>150</b></div>':''}<div class="mrow"><span>Amber gathered</span><b>${g6}</b></div>${gm>1?`<div class="mrow"><span>Greed bonus</span><b>×${gm.toFixed(1)}</b></div>`:''}
<p class="c amb" style="font-size:22px">+⬢ ${tot} amber (total ${META.amber})</p><button class="big" id="again">Hunt again</button><button class="big" id="arm">Armory</button><button class="big" id="mm">Main menu</button></div>`);
 $('again').onclick=()=>start();$('arm').onclick=armory;$('mm').onclick=menu}
/* ================= INPUT & LOOP ================= */
addEventListener('keydown',e=>{initAudio();const k=e.key.toLowerCase();if(window.onLvlKey){window.onLvlKey(e);return}keys[k]=1;if(k=='m')$('mute').click();if(mode=='play'&&(k=='p'||k=='escape')){S.paused?resume():pauseUI()}if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);addEventListener('blur',()=>{keys={};if(mode=='play')pauseUI()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode=='play')pauseUI()});
addEventListener('pointerdown',()=>{initAudio();if(AC&&AC.state=='suspended'&&!muted)AC.resume()},{capture:true});
cv.addEventListener('pointerdown',e=>{if(mode!='play')return;joy={x:e.clientX,y:e.clientY,dx:0,dy:0};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(joy){joy.dx=e.clientX-joy.x;joy.dy=e.clientY-joy.y}});['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>joy=null));
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(AC)AC[muted?'suspend':'resume']()};$('pz').onclick=()=>{S&&S.paused?resume():pauseUI()};
let lt=0;function loop(t){const dt=Math.min(.05,(t-lt)/1000||0);lt=t;mt+=dt;try{if(mode=='play'&&!S.pause)update(dt);render(mode=='menu'?mt:0)}catch(err){console.error(err)}requestAnimationFrame(loop)}
menu();requestAnimationFrame(loop);
</script></body></html>
