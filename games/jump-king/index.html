<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Jump King</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jacquard+12&family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
  /* Layout: ett tårnvindu i midten, statistikklinje over, trykkknapper under på mobil. Mørk middelalder-natt, bevisst ett tema. */
  :root {
    --night: #0e0c16;
    --panel: #17141f;
    --stone: #8d8aa3;
    --parch: #e9dcc0;
    --gold: #f2c14e;
    --ember: #e8743b;
    --dim: #7a7390;
    --font-display: 'Jacquard 12', 'Times New Roman', serif;
    --font-ui: 'Pixelify Sans', ui-monospace, 'Courier New', monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--night); color: var(--parch);
    font-family: var(--font-ui); margin: 0;
    display: flex; flex-direction: column; align-items: center;
    padding-inline: 16px; padding-block: 10px; box-sizing: border-box;
    overflow: hidden; user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  .hud {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline;
    gap: 6px 16px; width: 100%; max-width: 560px; padding-block: 2px 8px;
  }
  .hud h1 {
    font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 1;
    margin: 0; color: var(--gold); letter-spacing: 0.02em;
    text-shadow: 0 2px 0 #6b3d12;
  }
  .stats { display: flex; gap: 14px; font-size: 14px; color: var(--stone); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
  .stats b { color: var(--parch); font-weight: 600; }
  .stage { position: relative; flex: 1 1 auto; min-height: 0; display: flex; align-items: flex-start; justify-content: center; width: 100%; }
  canvas {
    display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    border: 3px solid #2c2638; border-radius: 4px; background: #000;
    box-shadow: 0 0 0 1px #000, 0 18px 50px -12px #000;
  }
  .keys { font-size: 13px; color: var(--dim); padding-block: 8px 0; text-align: center; max-width: 560px; }
  .keys kbd {
    font-family: var(--font-ui); background: var(--panel); border: 1px solid #3a3348;
    border-bottom-width: 3px; border-radius: 4px; padding: 0 6px; color: var(--parch);
  }
  .touch { display: none; gap: 10px; width: 100%; max-width: 560px; padding-block: 10px 4px; }
  .touch button {
    flex: 1; font-family: var(--font-ui); font-weight: 700; font-size: 17px;
    color: var(--parch); background: var(--panel); border: 2px solid #3a3348; border-bottom-width: 5px;
    border-radius: 10px; padding-block: 18px; touch-action: none;
  }
  .touch button.jump { flex: 1.6; color: var(--gold); border-color: #6b5320; }
  .touch button.on { transform: translateY(2px); border-bottom-width: 3px; background: #231e2d; }
  @media (pointer: coarse) { .touch { display: flex; } .keys { display: none; } }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>

<div class="hud">
  <h1>Jump King</h1>
  <div class="stats" aria-live="off">
    <span>Høyde <b id="sH">0 m</b></span>
    <span>Tid <b id="sT">0:00</b></span>
    <span>Hopp <b id="sJ">0</b></span>
    <span>Fall <b id="sF">0</b></span>
    <span>Død <b id="sD">0</b></span>
    <span>Juveler <b id="sG">0/7</b></span>
  </div>
</div>
<div class="stage" id="stage"><canvas id="cv" width="480" height="576" aria-label="Spillvindu"></canvas></div>
<div class="keys"><kbd>Space</kbd> hopp (hold = høyere) · <kbd>Shift</kbd>/<kbd>X</kbd> dash · hold <kbd>W</kbd>/<kbd>↑</kbd> + dash = dash opp · treff vegg + hopp = veggspark · <kbd>P</kbd> pause · <kbd>G</kbd> spøkelse · <kbd>N</kbd> musikk</div>
<div class="touch">
  <button id="bDash" type="button">DASH</button>
  <button id="bUp" type="button">DASH ↑</button>
  <button id="bJump" class="jump" type="button">HOPP</button>
</div>

<script>// Jump King – fysikk og brettlogikk (brukes både i nettleser og av løseren i Node)
(function (root) {
  const T = 24, PW = 14, PH = 20;
  const K = {
    run: 2.6, g: 0.45, jump: 8.8, cut: -2.6, maxFall: 10,
    dashF: 9, dashV: 7.2, dashUpX: 4.6, dashUpY: 6.4,
    kick: 8.4, spring: 13.8, belt: 1.5, clockP: 90, coyote: 5, buf: 6, wallT: 9,
    crumbleT: 30, crumbleGone: 170, crystalGone: 150, windAmp: 1.25
  };

  // Hver skjerm: 24 rader à 18 tegn (ytre vegger legges på automatisk). Øverste skjerm først.
  // . tomt  # stein  = smuldrestein  A rød (fast i fase 0)  B blå (fast i fase 1)
  // ^ pigger  * dash-krystall  S fjær  C sjekkpunkt  K kronen  P start
  // < > rullebånd   O o klokkeblokker (bytter hvert 1,5 s)   $ juvel
  const SCREENS = [
    { name: 'VII · Kronen', wind: false, rows: [
      '.....K............',
      '....#####.........',
      '..................',
      '..........^.......',
      '..........####....',

      '..................',

      '..*.#.............',
      '....#.............',

      '..*.#.............',
      '....#.............',
      '....#.............',
      '....#.............',
      '..................',
      '..................',
      '##########........'] },
    { name: 'VI · Klokketårnet', wind: false, rows: [
      '..................',
      '..................',
      '.........OOOOOO###',
      '..................',
      '..................',
      '########..........',
      '..................',

      '$.................',
      '...............###',

      '........###.......',
      '..................',

      '##<<<<<<..........',
      '..................',

    { name: 'V · Stormen', wind: true, rows: [

    { name: 'IV · Fjær og krystall', wind: false, rows: [
      '..................',

    { name: 'III · Rød og blå', wind: false, rows: [

      '###...............',

      '........#.......$.',

      '..................',

      '..................',

      'AAAAAAA...........',
      '..................',
      '..................',

      '.............#####'] },
    { name: 'II · Smuldrende murer', wind: false, rows: [
      '..................',
      '..................',
      '.........####.....',
      '..................',
      '...#..............',
      '...#####..........',
      '..................',

      '.$................',

    { name: 'I · Kjelleren', wind: false, rows: [
      '..................',
      '..................',
      '..............####',

      '........#.........',
      '........#####.....',
      '..................',
      '.$................',
      '...............###',
      '..................',
      '....#.............',
      '....#######.......',
      '..................',

      '..................',
      '.....#............',
      '.....######.......',
      '..................',
      '..................',
      '............######',
      '..................',
      '.P................',
      '##################'] }
  ];

  const SIGNS = [
    { s: 6, r: 19, c: 2, t: 'SPACE = hopp · hold for høyere' },
    { s: 6, r: 9, c: 1, t: 'SHIFT = dash · W+SHIFT = dash opp' },
    { s: 5, r: 21, c: 1, t: 'Smuldrestein tåler ikke vekt lenge' },
    { s: 4, r: 19, c: 13, t: 'Hvert hopp bytter rød og blå' },
    { s: 3, r: 20, c: 1, t: 'Krystaller gir ny dash og nytt veggspark' },
    { s: 2, r: 20, c: 13, t: 'Vinden snur…' },
    { s: 1, r: 18, c: 11, t: 'Båndet gir deg fart i hoppet' },
    { s: 1, r: 12, c: 1, t: 'Klokkene tikker hvert 1,5 sekund' },
    { s: 0, r: 16, c: 6, t: 'Hopp når du treffer veggen = veggspark' }
  ];

  function buildLevel() {
    const rows = [], wind = [], screenOf = [];
    SCREENS.forEach((s, si) => {
      if (s.rows.length !== 24) throw new Error('skjerm ' + s.name + ' har ' + s.rows.length + ' rader');
      s.rows.forEach((r, i) => {
        if (r.length !== 18) throw new Error('rad ' + i + ' i ' + s.name + ' er ' + r.length);
        rows.push('#' + r + '#'); wind.push(s.wind); screenOf.push(si);
      });
    });
    return { rows, wind, screenOf };
  }

  function Game(opts) {
    opts = opts || {};
    this.iron = !!opts.iron;
    this.gems = [];
    this.gemTotal = 0;
    const L = buildLevel();
    this.W = 20; this.H = L.rows.length; this.wind = L.wind; this.screenOf = L.screenOf;
    this.grid = L.rows.map(r => r.split(''));
    this.state = new Int16Array(this.W * this.H); // smuldre/krystall-tidtakere
    this.ghost = [];
    this.events = [];
    let px = 0, py = 0;
    for (let r = 0; r < this.H; r++) for (let c = 0; c < this.W; c++) {
      if (this.grid[r][c] === 'P') { px = c; py = r; this.grid[r][c] = '.'; }
      if (this.grid[r][c] === '$') this.gemTotal++;
    }
    this.start = { x: px * T + 5, y: (py + 1) * T - PH };
    this.goalY = 0;
    this.stats = { jumps: 0, falls: 0, deaths: 0, frames: 0 };
    this.reset(this.start);
  }

  Game.prototype.reset = function (pos) {
    this.x = pos.x; this.y = pos.y; this.vx = 0; this.vy = 0; this.dir = 1;
    this.grounded = false; this.coyote = 0; this.jumpBuf = 0; this.jumping = false;
    this.dashAvail = true; this.kickAvail = true; this.dashT = 0; this.dashUp = false;
    this.wallT = 0; this.phase = 0; this.boost = 0; this.t = this.t || 0; this.won = false;
    this.cp = this.cp || { x: pos.x, y: pos.y };
    this.lastGroundY = pos.y; this.maxY = pos.y; this.ghost = [];
    this.state.fill(0); this.active = [];
  };

  Game.prototype.clone = function () {
    const g = Object.create(Game.prototype);
    Object.assign(g, this);
    g.state = new Int16Array(this.state);
    g.ghost = this.ghost.slice(); g.active = this.active.slice(); g.gems = this.gems.slice();
    g.events = [];
    g.cp = { x: this.cp.x, y: this.cp.y };
    g.stats = Object.assign({}, this.stats);
    return g;
  };

  Game.prototype.ch = function (c, r) {
    if (c < 0 || c >= this.W) return '#';
    if (r < 0) return '.';
    if (r >= this.H) return '#';
    return this.grid[r][c];
  };
  Game.prototype.isGhost = function (c, r) {
    for (const g of this.ghost) if (g[0] === c && g[1] === r) return true;
    return false;
  };
  Game.prototype.solid = function (c, r) {
    const ch = this.ch(c, r);
    if (ch === '#') return true;
    if (ch === '=') return this.state[r * this.W + c] >= 0;
    if (ch === 'A') return this.phase === 0 && !this.isGhost(c, r);
    if (ch === 'B') return this.phase === 1 && !this.isGhost(c, r);
    if (ch === '<' || ch === '>') return true;
    if (ch === 'O') return this.clock() === 0 && !this.isGhost(c, r);
    if (ch === 'o') return this.clock() === 1 && !this.isGhost(c, r);
    return false;
  };
  Game.prototype.clock = function () { return Math.floor(this.t / K.clockP) & 1; };
  Game.prototype.ghostFor = function (want) {
    const c0 = Math.floor(this.x / T), c1 = Math.floor((this.x + PW - 0.01) / T);
    const r0 = Math.floor(this.y / T), r1 = Math.floor((this.y + PH - 0.01) / T);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++)
      if (this.ch(c, r) === want) this.ghost.push([c, r]);
  };
  Game.prototype.touch = function (c, r) {
    if (this.ch(c, r) === '=' && this.state[r * this.W + c] === 0) {
      this.state[r * this.W + c] = K.crumbleT; this.active.push(r * this.W + c); this.events.push(['crack', c, r]);
    }
  };
  Game.prototype.flip = function () {
    this.phase ^= 1;
    this.ghostFor(this.phase === 0 ? 'A' : 'B');
    this.events.push(['flip', this.phase]);
  };

  Game.prototype.moveX = function (d) {
    this.x += d;
    const r0 = Math.floor(this.y / T), r1 = Math.floor((this.y + PH - 0.01) / T);
    let hit = false;
    if (d > 0) {
      const c = Math.floor((this.x + PW - 0.01) / T);
      for (let r = r0; r <= r1; r++) if (this.solid(c, r)) { this.touch(c, r); hit = true; }
      if (hit) this.x = c * T - PW;
    } else if (d < 0) {
      const c = Math.floor(this.x / T);
      for (let r = r0; r <= r1; r++) if (this.solid(c, r)) { this.touch(c, r); hit = true; }
      if (hit) this.x = (c + 1) * T;
    }
    return hit;
  };
  Game.prototype.moveY = function (d) {
    const prevBottom = this.y + PH;
    this.y += d;
    const c0 = Math.floor(this.x / T), c1 = Math.floor((this.x + PW - 0.01) / T);
    if (d > 0) {
      const r = Math.floor((this.y + PH - 0.01) / T);
      let hit = false;
      for (let c = c0; c <= c1; c++) if (this.solid(c, r)) { this.touch(c, r); hit = true; }
      if (hit) { this.y = r * T - PH; return 1; }
    } else if (d < 0) {
      const r = Math.floor(this.y / T);
      let hit = false;
      for (let c = c0; c <= c1; c++) if (this.solid(c, r)) { this.touch(c, r); hit = true; }
      if (hit) { this.y = (r + 1) * T; return -1; }
    }
    return 0;
  };

  Game.prototype.windX = function () {
    return K.windAmp * Math.sin(this.t / 55);
  };

  Game.prototype.die = function () {
    this.stats.deaths++;
    this.events.push(['die', this.x, this.y]);
    const cp = this.iron ? { x: this.start.x, y: this.start.y } : this.cp;
    const keepT = this.t, stats = this.stats;
    this.reset(cp);
    this.t = keepT; this.stats = stats; this.cp = cp;
  };

  Game.prototype.step = function (inp) {
    if (this.won) return;
    this.t++; this.stats.frames++;
    const W = this.W;
    if (this.t % K.clockP === 0) { this.ghostFor(this.clock() === 0 ? 'O' : 'o'); this.events.push(['tick', this.clock()]); }
    // tidtakere for smuldrestein og krystaller
    if (this.active.length) {
      const keep = [];
      for (const i of this.active) {
        const s = this.state[i];
        const c = i % W, r = (i / W) | 0, ch = this.grid[r][c];
        if (s > 0) {
          if (s - 1 === 0) { this.state[i] = ch === '=' ? -K.crumbleGone : 0; if (ch === '=') this.events.push(['break', c, r]); }
          else this.state[i] = s - 1;
        } else if (s < 0) {
          this.state[i] = s + 1;
          if (s + 1 === 0 && ch === '=' && this.overlapsTile(c, r)) this.state[i] = -1;
          if (this.state[i] === 0) this.events.push(['regrow', c, r, ch]);
        }
        if (this.state[i] !== 0) keep.push(i);
      }
      this.active = keep;
    }
    // spøkelsesblokker forsvinner når spilleren har gått ut av dem
    if (this.ghost.length) this.ghost = this.ghost.filter(g => this.overlapsTile(g[0], g[1]));

    if (inp.jp) this.jumpBuf = K.buf; else if (this.jumpBuf > 0) this.jumpBuf--;
    if (this.grounded) this.coyote = K.coyote; else if (this.coyote > 0) this.coyote--;

    if (this.jumpBuf > 0 && this.coyote > 0 && this.dashT === 0) {
      this.vy = -K.jump; this.coyote = 0; this.jumpBuf = 0; this.grounded = false; this.jumping = true;
      this.stats.jumps++; this.lastGroundY = this.y; this.flip(); this.events.push(['jump']);
    } else if (this.jumpBuf > 0 && this.wallT > 0 && this.kickAvail && this.dashT === 0 && !this.grounded) {
      this.vy = -K.kick; this.kickAvail = false; this.wallT = 0; this.jumpBuf = 0; this.jumping = true;
      this.stats.jumps++; this.flip(); this.events.push(['kick', this.x, this.y, this.dir]);
    }
    if (this.jumping && !inp.jh && this.vy < K.cut) { this.vy = K.cut; this.jumping = false; }
    if (this.vy >= 0) this.jumping = false;

    if (inp.dp && this.dashAvail && this.dashT === 0) {
      this.dashT = K.dashF; this.dashAvail = false; this.dashUp = !!inp.up; this.jumping = false;
      this.events.push(['dash', this.dashUp]);
    }
    if (this.dashT > 0) {
      this.dashT--;
      if (this.dashUp) { this.vx = this.dir * K.dashUpX; this.vy = -K.dashUpY; }
      else { this.vx = this.dir * K.dashV; this.vy = 0; }
      if (this.dashT === 0) this.vy = this.dashUp ? -3 : 0;
    } else {
      this.vx = this.dir * K.run + this.boost;
      this.vy = Math.min(this.vy + K.g, K.maxFall);
    }
    const row = Math.floor((this.y + PH / 2) / T);
    let vx = this.vx;
    if (!this.grounded && this.wind[Math.max(0, Math.min(this.H - 1, row))]) vx += this.windX();

    if (this.moveX(vx)) {
      this.dir = -this.dir; this.boost = 0;
      if (!this.grounded) this.wallT = K.wallT;
      this.events.push(['bonk', this.grounded]);
    } else if (this.wallT > 0) this.wallT--;

    const wasGrounded = this.grounded;
    const res = this.moveY(this.vy);
    if (res === 1) {
      if (!wasGrounded) {
        const drop = this.y - this.lastGroundY;
        this.events.push(['land', this.vy]);
        if (drop > T * 7) { this.stats.falls++; this.events.push(['fall', Math.round(drop / T)]); }
        this.lastGroundY = this.y;
      }
      this.grounded = true; this.vy = 0;
      { // rullebånd under føttene
        const fr = Math.floor((this.y + PH + 1) / T);
        const a = this.ch(Math.floor((this.x + 2) / T), fr), b = this.ch(Math.floor((this.x + PW - 2) / T), fr);
        this.boost = (a === '>' || b === '>') ? K.belt : (a === '<' || b === '<') ? -K.belt : 0;
      }
      if (this.dashT === 0) this.dashAvail = true;
      this.kickAvail = true;
    } else {
      if (res === -1) { this.vy = 0; this.jumping = false; }
      this.grounded = false;
    }
    if (this.grounded) this.lastGroundY = this.y;

    // utløsere
    const c0 = Math.floor(this.x / T), c1 = Math.floor((this.x + PW - 0.01) / T);
    const r0 = Math.floor(this.y / T), r1 = Math.floor((this.y + PH - 0.01) / T);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      const ch = this.ch(c, r);
      if (ch === '^') {
        if (this.overlap(c * T + 4, r * T + T - 10, T - 8, 10)) { this.die(); return; }
      } else if (ch === 'S') {
        if (this.vy >= 0 && this.overlap(c * T + 2, r * T + T - 10, T - 4, 10)) {
          this.vy = -K.spring; this.jumping = false; this.dashT = 0; this.grounded = false; this.coyote = 0;
          this.dashAvail = true; this.kickAvail = true; this.lastGroundY = this.y;

function drawSigns(scr, camY) {

    const y = (s.s * 24 + s.r) * T - camY + 12;
    const w = ctx.measureText(s.t).width;

}

let fireT = 0;

let animT = 0, squash = 0, lastGrounded = false;

}

// ---------- løkke ----------
const $ = id => document.getElementById(id);
let acc = 0, last = performance.now(), hudTick = 0;
function update() {
  if (mode === 'play') {
    const wasG = game.grounded;
    game.step({ jp: inp.jpQ, jh: inp.jh, dp: inp.dpQ, up: inp.up });
    inp.jpQ = false; inp.dpQ = false;
    if (game.dashT > 0 && game.t % 2 === 0) ghosts.push({ x: game.x, y: game.y, life: 14 });
    // klem og strekk
    if (!wasG && game.grounded) squash = 1;
    else if (wasG && !game.grounded && game.vy < 0) squash = -1;
    squash *= 0.82; if (Math.abs(squash) < 0.02) squash = 0;
    handleEvents();
    const scr = Math.floor((game.y + PH / 2) / SH);
    if (game.stats.frames % 2 === 0) rec.push(Math.round(game.x), Math.round(game.y));
    if (scr < seenScreen && scr >= 0) {
      seenScreen = scr; banner(SCREENS[scr].name); SFX.screen();
      const floor = NS - 1 - scr; // 1 = andre etasje
      splits[floor - 1] = game.stats.frames;
      bannerM.split = game.stats.frames;
      const bs = best && best.splits && best.splits[floor - 1];
      bannerM.cmp = bs ? game.stats.frames - bs : null;
    }
  } else if (mode === 'title') game.t++;
  else if (mode === 'win') { game.t++; fireworks(); }
  animT++;
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life--; }
  parts = parts.filter(p => p.life > 0);
  for (const g of ghosts) g.life--;
  ghosts = ghosts.filter(g => g.life > 0);
  if (shake > 0) shake *= 0.85, shake < 0.3 && (shake = 0);
  if (flash > 0) flash--;
  if (bannerM) bannerM.t--;
  if (msg) msg.t--;
}
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  render();
  if (++hudTick % 6 === 0) {
    const hM = Math.max(0, Math.round((game.start.y - game.y) / T / 2));
    $('sH').textContent = hM + ' m';
    $('sT').textContent = fmt(game.stats.frames).replace(/\.\d$/, '');
    $('sJ').textContent = game.stats.jumps;
    $('sF').textContent = game.stats.falls;
    $('sD').textContent = game.stats.deaths;
    $('sG').textContent = game.gems.length + '/' + game.gemTotal;
  }
  requestAnimationFrame(frame);
}

function fit() {
  const stage = $('stage');
  const aw = stage.clientWidth, ah = stage.clientHeight;
  let w = Math.min(aw, ah * VW / VH);
  w = Math.max(200, Math.floor(w));
  cv.style.width = w + 'px'; cv.style.height = Math.floor(w * VH / VW) + 'px';
}
addEventListener('resize', fit);
fit();
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load('40px "Jacquard 12"'), document.fonts.load('600 14px "Pixelify Sans"')]).catch(() => {});
}
requestAnimationFrame(frame);
window.__jk = { get game() { return game; }, setMode(m) { mode = m; } };
})();
</script>
