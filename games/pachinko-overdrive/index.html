<style>
/* Layout: one arcade cabinet. Machine glass on the left, shop rail on the right.
   The Ascension tree is a separate full-width screen. Committed single dark neon look. */
:root{
  --bg:#0a0517; --panel:#140a2b; --panel-2:#1d1142; --line:#3b2a70; --fg:#f1ebff; --dim:#9d92c9;
  --pink:#ff3d9a; --cyan:#27e8ff; --gold:#ffc93c; --lime:#7dff6a; --violet:#b9a3ff;
  --display:'Bungee','Impact','Arial Black',sans-serif;
  --body:'Chakra Petch',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.35;padding-inline:16px;padding-block:12px;background:var(--bg);margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:24px;letter-spacing:.03em;line-height:1;display:flex;flex-direction:column;gap:4px}
.brand b{background:linear-gradient(90deg,var(--pink),var(--gold),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:400}
.brand span{font-size:11px;letter-spacing:.46em;color:var(--dim)}
.nav{display:flex;gap:8px}
.nav button{background:var(--panel);border:1px solid var(--line);padding:9px 16px;border-radius:6px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.nav button.on{background:var(--pink);border-color:var(--pink);color:#1a0210}
.nav button em{font-style:normal;font-family:var(--mono);margin-left:6px;color:var(--gold)}
.nav button.on em{color:#1a0210}
.nav button.ready{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,61,154,.35)}}
.machine-view{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media(min-width:900px){.machine-view{grid-template-columns:minmax(300px,520px) minmax(0,1fr)}}
.cabinet{display:flex;flex-direction:column;gap:10px;min-width:0}
.hud{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:end}
.coins{font-family:var(--mono);font-size:clamp(28px,7vw,40px);color:var(--gold);line-height:1;text-shadow:0 0 18px rgba(255,201,60,.45);font-variant-numeric:tabular-nums}
.lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);font-weight:700}
.sub{font-family:var(--mono);font-size:13px;color:var(--cyan);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-direction:column;gap:2px;text-align:right}
.tokchip{background:none;border:0;padding:0;text-align:right}
.tokchip .sub{color:var(--violet)}
.fever{grid-column:1/-1;position:relative;height:18px;border-radius:4px;background:#0c0620;border:1px solid var(--line);overflow:hidden}
.fever i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--pink),var(--gold),var(--lime),var(--cyan),var(--violet));transition:width .12s linear}
.fever span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.3em;font-weight:700;text-transform:uppercase;color:#fff;mix-blend-mode:difference}
.stage{width:min(100%,520px,calc((100vh - 240px)*.6316));min-width:min(100%,300px);margin-inline:auto;border-radius:14px;overflow:hidden;border:2px solid var(--line);box-shadow:0 0 40px rgba(255,61,154,.25),inset 0 0 0 1px #000;background:#0d0522;line-height:0}
.stage canvas{width:100%;height:auto;display:block;touch-action:manipulation;cursor:crosshair;user-select:none}
.feed{min-height:64px;font-family:var(--mono);font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:2px;padding-inline:4px}
.feed div{animation:fin .4s}
.feed .big{color:var(--gold)}.feed .hot{color:var(--pink)}
@keyframes fin{from{opacity:0;transform:translateX(-8px)}}
.rail{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0;display:flex;flex-direction:column}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{flex:1 1 auto;background:none;border:0;padding:11px 10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--dim);border-bottom:2px solid transparent}
.tabs button.on{color:var(--cyan);border-bottom-color:var(--cyan);background:var(--panel-2)}
.panel{padding:12px;display:flex;flex-direction:column;gap:8px;max-height:min(820px,80vh);overflow:auto}
.sec{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-top:6px}
.note{font-size:12px;color:var(--dim)}
.card{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;opacity:.62;transition:transform .08s,border-color .15s}
.card.can{opacity:1;border-color:var(--cyan)}
.card.can:hover{transform:translateY(-1px);background:#26175a}
.card.done{opacity:.8;border-color:var(--lime);cursor:default}
.card.lock{opacity:.4;cursor:not-allowed}
.ct{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nm{font-weight:700;font-size:14px}
.own{font-style:normal;font-family:var(--mono);color:var(--violet);font-size:13px}
.ds{font-size:12px;color:var(--dim)}
.cs{font-family:var(--mono);font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums}
.row{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:6px 10px;font-size:12px;font-weight:700}
.pill.on{background:var(--cyan);color:#041418;border-color:var(--cyan)}
.stats{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-family:var(--mono);font-size:12px}
.stats span:nth-child(odd){color:var(--dim)}
textarea{width:100%;min-height:64px;background:#0c0620;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font-family:var(--mono);font-size:11px}
input[type=range]{width:100%;accent-color:var(--pink)}
.danger{border-color:#7a2346}
.asc-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.big-n{font-family:var(--mono);font-size:30px;color:var(--violet);line-height:1}
.btn{background:var(--pink);color:#1a0210;border:0;border-radius:6px;padding:11px 16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.btn:disabled{background:var(--panel-2);color:var(--dim);cursor:not-allowed}
.btn.alt{background:var(--cyan);color:#041418}
.tree-wrap{position:relative;height:min(68vh,700px);min-height:380px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:radial-gradient(circle at 50% 50%,#1b0f3d,#0a0517 70%);touch-action:none;cursor:grab}
.tree-wrap.drag{cursor:grabbing}
.tree-wrap svg{width:100%;height:100%;display:block}
.tree-tools{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.tree-tools button{background:var(--panel);border:1px solid var(--line);border-radius:5px;width:34px;height:34px;font-weight:700}
.edge{stroke:var(--line);stroke-width:3;fill:none}
.edge.on{stroke-width:4;opacity:.9}
.node circle{fill:var(--panel);stroke-width:3}
.node{cursor:pointer}
.node.locked{opacity:.35}
.node.sel circle{stroke-width:6}
.node.can circle{fill:#2a1a60}
.node.owned circle{fill:var(--panel-2)}
.node.maxed circle{fill:var(--node-c)}
.node .lv{font-family:var(--mono);font-size:13px;fill:var(--fg);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node.maxed .lv{fill:#0a0517;font-weight:700}
.node .nl{font-family:var(--body);font-weight:600;font-size:11px;fill:var(--fg);text-anchor:middle;pointer-events:none}
.blabel{font-family:var(--display);font-size:30px;text-anchor:middle;dominant-baseline:central;opacity:.55;pointer-events:none;letter-spacing:.1em}
.info{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center}
.modal{position:fixed;inset:0;background:rgba(5,2,14,.78);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal .box{max-width:420px;width:100%;border-color:var(--pink);box-shadow:0 0 50px rgba(255,61,154,.4)}
@media(prefers-reduced-motion:reduce){.nav button.ready,.feed div{animation:none}}
</style>

  <main id="viewT" hidden>

        <div class="note" id="ascInfo"></div>
        <button class="btn" id="ascBtn" type="button">Ascend</button>
      </div>
    </div>
    <div class="tree-wrap" id="treeWrap">
      <svg id="treeSvg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ascension skill tree"></svg>
      <div class="tree-tools"><button id="zIn" type="button" aria-label="Zoom in">+</button><button id="zOut" type="button" aria-label="Zoom out">&minus;</button><button id="zFit" type="button" aria-label="Fit tree">&#9678;</button></div>
    </div>
    <div class="box info" id="treeInfo" style="margin-top:12px"></div>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="box"><div id="modalBody"></div><button class="btn alt" id="modalOk" type="button">Back to the machine</button></div>
</div>

var S=freshState(),M=null,D={};
function loadObj(o){
  var f=freshState();if(!o||typeof o!=='object')return f;
  for(var k in f){ if(o[k]===undefined)continue;
    if(f[k]&&typeof f[k]==='object'&&!Array.isArray(f[k])) f[k]=Object.assign(f[k],o[k]); else f[k]=o[k]; }
  if(!Array.isArray(f.ev.bins)||f.ev.bins.length!==9) f.ev.bins=[1,3,8,16,24,16,8,3,1];
  return f;
}

function visCount(){var n=0;for(var i=0;i<VIS.length;i++)if(S.vis[VIS[i].id])n++;return n;}
function recalc(){
  var m={coin:1,rate:1,ballVal:1,click:1,bin:1,cost:1,costGrow:0,luck:0,gate:1,jack:1,pityStep:0,feverLen:0,feverMul:0,feverCoin:0,feverCoinMul:1,feverLenMul:1,refever:0,startCoins:0,startHand:0,startTier:0,offEff:.2,offCap:2,autobuy:false,tierCost:1,charge:0,show:0,showMul:1,keepVis:0,tokenGain:1,tesla:false,roller:0,rollerMult:10,blackhole:false,bhPower:0,bhRate:1,twin:0,unlock:{}};
  for(var i=0;i<TREE.length;i++){var l=S.tree[TREE[i].id]||0;if(l>0)TREE[i].fx(l,m);}
  M=m;
  var upCoin=1,upRate=1,upClick=1;
  UPS.forEach(function(u){if(S.up[u.id]){if(u.type==='coin')upCoin*=u.v;else if(u.type==='rate')upRate*=u.v;else upClick*=u.v;}});
  var show=(1+visCount()*(VISB+m.show))*m.showMul;
  var aura=1+.005*S.tokensEarned;
  D.coinMult=m.coin*upCoin*show*aura;
  D.show=show;D.aura=aura;
  D.ballValue=Math.pow(TIERMUL,S.tier)*m.ballVal;
  D.unitBase=D.ballValue*D.coinMult;
  D.click=m.click*upClick;
  var r=0;BUILD.forEach(function(b){r+=(S.b[b.id]||0)*b.rate;});
  D.rateMul=m.rate*upRate;
  D.baseRate=r*D.rateMul;
  D.binBoost=m.bin*(1+.18*(S.lvl.bins||0));
  D.luck=m.luck+.004*(S.lvl.luck||0);
  D.gateMul=m.gate*(1+.1*(S.lvl.gate||0));
  D.feverLen=(10+m.feverLen+1.5*(S.lvl.fev||0))*m.feverLenMul;
  D.feverRate=2+m.feverMul;
  D.feverCoin=(2+m.feverCoin)*m.feverCoinMul;
  D.teslaOn=!!(S.vis.tesla||m.tesla);
}
function unit(){return D.unitBase*(S.fever>0?D.feverCoin:1);}
function rateNow(){return D.baseRate*(S.fever>0?D.feverRate:1);}
function gGrow(){return Math.max(1.09,1.16+M.costGrow);}
function inf(){return Math.pow(BINF,S.tier);}
function bCost(def,n,k){var g=gGrow();return def.base*Math.pow(g,n)*(Math.pow(g,k)-1)/(g-1)*M.cost*inf();}
function maxBuy(def,n){var g=gGrow(),u=def.base*Math.pow(g,n)*M.cost*inf();if(S.coins<u)return 0;return Math.floor(Math.log(S.coins*(g-1)/u+1)/Math.log(g));}
function qtyFor(def){var n=S.b[def.id]||0;if(S.set.buy===0)return Math.max(1,maxBuy(def,n));return S.set.buy;}
function gain(x){S.coins+=x;S.runEarned+=x;S.totalEarned+=x;incAcc+=x;}
function tokensOnAscend(){return Math.floor(Math.pow(S.runEarned/2e8,.4)*M.tokenGain);}

/* ---------------- AUDIO ---------------- */
var Snd=(function(){
  var ctx=null,master=null,nbuf=null,budget=0,tAcc=0;
  var PENT=[0,3,5,7,10];
  function nf(i,base){return (base||220)*Math.pow(2,(PENT[((i%5)+5)%5]+12*Math.floor(i/5))/12);}
  function init(){
    if(ctx){if(ctx.state==='suspended')ctx.resume();return;}
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      var comp=ctx.createDynamicsCompressor();master=ctx.createGain();master.gain.value=S.set.vol;
      master.connect(comp);comp.connect(ctx.destination);
      nbuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);var d=nbuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }catch(e){ctx=null;}
  }
  function ok(){return ctx&&S.set.sound&&ctx.state==='running';}
  function tone(f,dur,type,g,when,slide){
    if(!ok())return;var t=ctx.currentTime+(when||0);
    var o=ctx.createOscillator(),gn=ctx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);
    gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(g||.1,t+.006);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(gn);gn.connect(master);o.start(t);o.stop(t+dur+.03);
  }
  function noise(dur,g,f0,f1,when){
    if(!ok())return;var t=ctx.currentTime+(when||0);
    var s=ctx.createBufferSource();s.buffer=nbuf;s.loop=true;
    var bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=.8;bp.frequency.setValueAtTime(f0,t);bp.frequency.exponentialRampToValueAtTime(f1,t+dur);
    var gn=ctx.createGain();gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(g,t+dur*.25);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(bp);bp.connect(gn);gn.connect(master);s.start(t);s.stop(t+dur+.05);
  }
  return{
    init:init,
    tick:function(dt){tAcc+=dt;if(tAcc>.1){tAcc=0;budget=0;}},
    setVol:function(v){if(master)master.gain.value=v;},
    peg:function(note,sp){if(budget++>7)return;tone(nf(note,523),.11,'triangle',clamp(sp/4000,.012,.06));},
    bin:function(mult){if(budget++>10)return;var b=mult>=3?1.5:1;tone(1320*b,.09,'square',.035);tone(1760*b,.14,'square',.03,.06);if(mult>=3){tone(2349,.2,'square',.03,.12);}},
    gate:function(){tone(660,.08,'square',.06);tone(990,.12,'square',.05,.05);},
    reel:function(i){tone(440+i*110,.05,'square',.04);},
    win:function(kind){
      if(kind==='pair'){tone(nf(5,392),.12,'square',.05);tone(nf(7,392),.16,'square',.05,.08);}
      else{for(var i=0;i<6;i++)tone(nf(i*2,392),.16,'square',.05,i*.06);}
    },
    jackpot:function(){
      noise(1.4,.25,300,6000);
      for(var i=0;i<12;i++)tone(nf(i,330),.22,'sawtooth',.055,i*.055);
      tone(110,1.6,'sawtooth',.11,0,.5);tone(165,1.6,'square',.05,.65);tone(220,1.6,'square',.045,.65);
    },
    feverStep:function(n){var pat=[0,2,4,7,4,2,5,7];var i=pat[n%8];tone(nf(i,330),.11,'square',.045);if(n%4===0)tone(nf(0,110),.3,'sawtooth',.08);if(n%2===1)noise(.04,.04,6000,9000);},
    feverEnd:function(){tone(440,.5,'sawtooth',.06,0,.25);},
    buy:function(){tone(880,.07,'square',.05);tone(1320,.12,'square',.05,.06);},
    deny:function(){tone(150,.12,'square',.05);},
    boom:function(){noise(.5,.18,2500,300);tone(90,.4,'sine',.15,0,.4);},
    bh:function(){tone(70,.6,'sine',.12,0,3);noise(.5,.1,200,1500);},
    ascend:function(){noise(2,.25,200,9000);for(var i=0;i<14;i++)tone(nf(i,220),.4,'sawtooth',.05,i*.1);tone(55,2.4,'sine',.2,0,2);}
  };
})();

var PEGS=[],BUMPERS=[[240,150],[70,262],[410,262],[130,545],[350,545],[240,610]];

var RX0=150,RY0=232,RX1=330,RY1=320,GY=478,GCX=240,JM=120,TM=20,PM=3;
(function(){
  for(var r=0;r<18;r++){
    var y=70+r*34,off=r%2?20:0;
    for(var x=32+off;x<=448;x+=40){
      if(x>95&&x<385&&y>200&&y<345)continue;
      if(Math.abs(x-GCX)<74&&y>GY-36&&y<GY+46)continue;
      var bad=false,i;
      for(i=0;i<PW.length;i++){var dx=x-PW[i].x,dy=y-PW[i].y;if(dx*dx+dy*dy<52*52)bad=true;}
      for(i=0;i<BUMPERS.length;i++){var ex=x-BUMPERS[i][0],ey=y-BUMPERS[i][1];if(ex*ex+ey*ey<30*30)bad=true;}
      if(bad)continue;
      PEGS.push({x:x,y:y,f:0,r:3.5,note:(r*2+Math.floor(x/40))%10,nb:[]});
    }
  }
  for(var i=0;i<=9;i++){var dx=12+i*BW;PEGS.push({x:dx,y:696,f:0,r:4,note:i,nb:[]});PEGS.push({x:dx,y:708,f:0,r:4,note:i+2,nb:[]});}
  for(var a=0;a<PEGS.length;a++){
    for(var b=0;b<PEGS.length;b++){if(a===b)continue;var ddx=PEGS[a].x-PEGS[b].x,ddy=PEGS[a].y-PEGS[b].y;if(ddx*ddx+ddy*ddy<64*64&&PEGS[a].nb.length<4)PEGS[a].nb.push(b);}
  }
})();

/* ---------------- GAME LOGIC ---------------- */
function spawnBall(x,vx,vy,cm,isClick){
  balls.push({x:x,y:16,vx:vx,vy:vy,age:0,charge:0,cm:cm||1,tier:S.tier,tr:[],slow:0,click:!!isClick,hue:Math.random()*360});
}
function launchOne(){
  var x=240+Math.sin(time*1.3)*170;
  spawnBall(x+rnd(-6,6),rnd(-70,70),rnd(60,160),1,false);
}
function dropAt(x){
  if(balls.length<330) spawnBall(clamp(x,20,460),rnd(-30,30),rnd(40,120),D.click,true); else ghostBall(D.click);
}
function evReel(){var pj=.03+D.luck;return pj*JM*M.jack+.10*TM+.28*PM;}
function evBall(){
  var ev=S.ev,tot=ev.gate,num=0,i;
  for(i=0;i<9;i++){tot+=ev.bins[i];num+=ev.bins[i]*BINS[i]*D.binBoost;}
  var roller=1+M.roller*(M.rollerMult-1);
  return (num/tot)*roller+(ev.gate/tot)*(1+evReel());
}
function ghostBatch(n){
  var m=Math.min(n,30),i;for(i=0;i<m;i++)ghostBall(1);
  var rest=n-m;if(rest>0){gain(rest*unit()*evBall());S.stats.balls+=rest;}
}
function ghostBall(cm){
  var ev=S.ev,tb=0,i;for(i=0;i<9;i++)tb+=ev.bins[i];
  var tot=tb+ev.gate,r=Math.random()*tot;
  if(r<ev.gate){gateEvent(null);return;}
  r-=ev.gate;i=0;while(i<8&&r>=ev.bins[i]){r-=ev.bins[i];i++;}
  payBin(i,null,cm);
}
function sample(p){var u=unit();if(u>0){S.avgMult+=(Math.min(40,p/u)-S.avgMult)*.003;}}
function payBin(i,b,cm){
  var u=unit(),mult=BINS[i]*D.binBoost,p=u*mult*(b?(1+b.charge):1)*(b?b.cm:(cm||1));
  var roll=false;
  if(M.roller>0&&Math.random()<M.roller){p*=M.rollerMult;roll=true;}
  gain(p);sample(p);S.stats.balls++;if(p>S.stats.best)S.stats.best=p;
  if(b){
    S.ev.bins[i]++;
    var tot=0,k;for(k=0;k<9;k++)tot+=S.ev.bins[k];tot+=S.ev.gate;if(tot>6000){for(k=0;k<9;k++)S.ev.bins[k]/=2;S.ev.gate/=2;}
    binFlash[i]=1;Snd.bin(mult);
    var x=12+BW*(i+.5);
    if(mult>=3||roll||Math.random()<.22)popup(x,700,'+'+fmt(p),roll?'#ff3d9a':(mult>=3?'#7dff6a':'#ffc93c'),roll?20:14);
    sparks(x,712,'#ffc93c',mult>=3?14:5,160,.5);
    if(roll){sparks(x,712,'#ff3d9a',24,260,.7);shake=Math.max(shake,.4);}
  }
}
function gateEvent(b){
  var u=unit(),base=u*(b?b.cm:1)*(b?(1+b.charge):1),r=null,rp;
  if(rollBucket>=1){rollBucket-=1;r=roll();rp=u*r.mult;}
  else rp=u*evReel();
  var total=base+rp;
  if(b)S.ev.gate++;
  gain(total);sample(total);S.stats.balls++;if(total>S.stats.best)S.stats.best=total;
  if(b){gateFlash=1;Snd.gate();}
  if(!r)return;
  setReel(r);
  if(r.kind!=='miss'){
    popup(GCX,RY0-10,'+'+fmt(total),r.kind==='jack'?'#ffc93c':(r.kind==='triple'?'#7dff6a':'#27e8ff'),r.kind==='jack'?26:(r.kind==='triple'?20:15));
    if(r.kind!=='jack'){Snd.win(r.kind);if(r.kind==='triple'){sparks(GCX,RY0+44,'#7dff6a',30,300,.8);if(S.vis.confetti)confetti(GCX,RY1,30);if(S.vis.shake)shake=Math.max(shake,.45);}}
  }
  if(r.kind==='jack')onJackpot(total);
}
function roll(){
  S.stats.rolls++;
  var pj=Math.min(.6,.03+D.luck+S.pity),x=Math.random(),kind,mult,res;
  if(x<pj){kind='jack';mult=JM*M.jack;res=[0,0,0];S.pity=0;}
  else{
    S.pity=Math.min(.3,S.pity+.004+M.pityStep);
    var y=x-pj;
    if(y<.10){kind='triple';mult=TM;var s=1+Math.floor(Math.random()*5);res=[s,s,s];}
    else if(y<.38){kind='pair';mult=PM;var a=Math.floor(Math.random()*6),o=(a+1+Math.floor(Math.random()*5))%6;res=[a,a,o];var sh=Math.floor(Math.random()*3);res=[res[sh%3],res[(sh+1)%3],res[(sh+2)%3]];}
    else{kind='miss';mult=0;var pool=[0,1,2,3,4,5];for(var i=5;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=pool[i];pool[i]=pool[j];pool[j]=t;}res=[pool[0],pool[1],pool[2]];}
  }
  return{kind:kind,mult:mult,res:res};
}

    g.appendChild(c);g.appendChild(lv);g.appendChild(nl);root.appendChild(g);
    g.addEventListener('click',function(){if(dragMoved>6)return;sel=n.id;updateTree();});
    svgRefs[n.id].g=g;svgRefs[n.id].lv=lv;
  });
  applyView();
}
function applyView(){var w=$('#treeWrap'),r=$('#treeRoot');if(!r)return;var b=w.getBoundingClientRect();if(!b.width||!b.height)return;$('#treeSvg').setAttribute('viewBox','0 0 '+b.width+' '+b.height);r.setAttribute('transform','translate('+(b.width/2+tv.x)+','+(b.height/2+tv.y)+') scale('+tv.k+')');}
function fitTree(full){var b=$('#treeWrap').getBoundingClientRect();tv.k=Math.max(.2,Math.min(b.width,b.height)/(2*(full?6.6:4.4)*RING));tv.x=0;tv.y=0;applyView();}
function updateTree(){
  TREE.forEach(function(n){
    var r=svgRefs[n.id];if(!r)return;var l=S.tree[n.id]||0,can=canNode(n),afford=S.tokens>=nodeCost(n);
    var cls='node';if(l>=n.max)cls+=' maxed owned';else if(l>0)cls+=' owned';
    if(!can&&l===0)cls+=' locked';else if(can&&afford)cls+=' can';
    if(sel===n.id)cls+=' sel';r.g.setAttribute('class',cls);
    r.lv.textContent=n.max>1?l+'/'+n.max:(l?'✓':'');
    r.edges.forEach(function(e){var on=e.p==='origin'||(S.tree[e.p]||0)>0;e.el.setAttribute('class','edge'+(on?' on':''));e.el.style.stroke=on?n.c:'';});
  });
  renderInfo();updateAscPanel();
}
function renderInfo(){
  var i=$('#treeInfo');
  if(!sel){i.innerHTML='<div><div class="nm">Pick a node</div><div class="note">Drag to pan, scroll or pinch to zoom, tap a node to read it. Nodes unlock outward from START.</div></div><div></div>';return;}
  var n=NODE[sel],l=S.tree[n.id]||0,cost=nodeCost(n),can=canNode(n);
  var status=l>=n.max?'Maxed':(!can?'Locked: buy the node before it first':(S.tokens>=cost?'Ready':'Need '+(cost-S.tokens)+' more tokens'));
  i.innerHTML='<div><div class="nm" style="color:'+n.c+'">'+n.name+' <span class="own">'+(n.max>1?l+'/'+n.max:(l?'owned':''))+'</span></div><div class="ds">'+n.desc+'</div><div class="cs">'+(l>=n.max?'':cost+' tokens · ')+status+'</div></div><button class="btn" id="nodeBuy" type="button" '+((!can||S.tokens<cost)?'disabled':'')+'>'+(l>=n.max?'Maxed':'Buy')+'</button>';
  var bb=$('#nodeBuy');if(bb)bb.addEventListener('click',function(){buyNode(n.id);});
}
function buyNode(id){var n=NODE[id];if(!canNode(n)||S.tokens<nodeCost(n)){Snd.deny();return;}S.tokens-=nodeCost(n);S.tree[id]=(S.tree[id]||0)+1;recalc();Snd.buy();updateTree();renderPanel();save();}
var ascArmed=false;
function updateAscPanel(){
  var g=tokensOnAscend();$('#ascTok').textContent=fmt(S.tokens);
  $('#ascInfo').textContent='Coins earned this run: '+fmt(S.runEarned)+'. Ascending now gives '+fmt(g)+' Lucky Tokens'+(g<1?' (earn 200M coins this run for your first).':'.')+' It resets coins, launchers, balls, upgrades and visuals.';
  var b=$('#ascBtn');b.disabled=g<1;b.textContent=g<1?'Earn 200M coins to ascend':(ascArmed?'Confirm: reset and gain '+fmt(g):'Ascend for '+fmt(g)+' tokens');
}
function setView(v){
  view=v;$('#viewM').hidden=v!=='M';$('#viewT').hidden=v!=='T';
  $('#navM').classList.toggle('on',v==='M');$('#navT').classList.toggle('on',v==='T');
  if(v==='T'){requestAnimationFrame(function(){if(!svgRefs.g1)buildTree();fitTree(false);updateTree();});}
  else resize();
}
var dragMoved=0;
function initTreeInput(){
  var w=$('#treeWrap'),pts={},lastD=0;
  w.addEventListener('pointerdown',function(e){pts[e.pointerId]={x:e.clientX,y:e.clientY};dragMoved=0;w.classList.add('drag');lastD=0;});
  window.addEventListener('pointermove',function(e){
    var p=pts[e.pointerId];if(!p)return;var ids=Object.keys(pts);
    if(ids.length===1){var dx=e.clientX-p.x,dy=e.clientY-p.y;dragMoved+=Math.abs(dx)+Math.abs(dy);tv.x+=dx;tv.y+=dy;}
    else if(ids.length===2){var o=pts[ids[0]==e.pointerId?ids[1]:ids[0]];var nd=Math.hypot(e.clientX-o.x,e.clientY-o.y),od=Math.hypot(p.x-o.x,p.y-o.y);if(od>0){tv.k=clamp(tv.k*nd/od,.15,2);}dragMoved+=10;}
    p.x=e.clientX;p.y=e.clientY;applyView();
  });
  function up(e){delete pts[e.pointerId];if(!Object.keys(pts).length)w.classList.remove('drag');}
  window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  w.addEventListener('wheel',function(e){e.preventDefault();tv.k=clamp(tv.k*(e.deltaY<0?1.12:.89),.15,2);applyView();},{passive:false});
  $('#zIn').addEventListener('click',function(){tv.k=clamp(tv.k*1.25,.15,2);applyView();});
  $('#zOut').addEventListener('click',function(){tv.k=clamp(tv.k/1.25,.15,2);applyView();});
  $('#zFit').addEventListener('click',function(){fitTree(true);});
  window.addEventListener('resize',applyView);
}

/* ---------------- OFFLINE / MODAL ---------------- */
function showModal(html){$('#modalBody').innerHTML=html;$('#modal').hidden=false;}
function applyOffline(sec){
  var t=Math.min(sec,M.offCap*3600),coins=D.baseRate*D.unitBase*evBall()*t*M.offEff;
  if(coins>0){gain(coins);showModal('<div class="lbl">Welcome back</div><div class="big-n" style="color:var(--gold);margin:6px 0">+'+fmt(coins)+'</div><div class="note">The machine kept rolling for '+fmtT(t)+' at '+Math.round(M.offEff*100)+'% efficiency'+(sec>t?' (capped at '+M.offCap+'h of offline time)':'')+'.</div>');}
}

/* ---------------- INPUT / BOOT ---------------- */
function resize(){
  var r=cv.getBoundingClientRect();if(!r.width)return;
  var dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.width*dpr*H/W);SX=cv.width/W;
  bc.width=Math.max(60,Math.round(cv.width/5));bc.height=Math.round(bc.width*H/W);
}
function ptrX(e){var r=cv.getBoundingClientRect();return (e.clientX-r.left)/r.width*W;}
function initUI(){
  $('#navM').addEventListener('click',function(){setView('M');});
  $('#navT').addEventListener('click',function(){setView('T');});
  $('#tokChip').addEventListener('click',function(){setView('T');});
  [].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.addEventListener('click',function(){tab=b.dataset.t;renderPanel();});});
  cv.addEventListener('pointerdown',function(e){Snd.init();ptr.down=true;ptr.x=ptrX(e);ptr.acc=0;dropAt(ptr.x);});
  cv.addEventListener('pointermove',function(e){ptr.x=ptrX(e);});
  window.addEventListener('pointerup',function(){ptr.down=false;});
  window.addEventListener('pointercancel',function(){ptr.down=false;});
  document.addEventListener('pointerdown',function(){Snd.init();},{once:true});
  window.addEventListener('keydown',function(e){if(e.code==='Space'&&view==='M'&&document.activeElement.tagName!=='BUTTON'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();Snd.init();dropAt(240+rnd(-120,120));}});
  $('#ascBtn').addEventListener('click',function(){
    if(tokensOnAscend()<1)return;
    if(!ascArmed){ascArmed=true;updateAscPanel();setTimeout(function(){ascArmed=false;updateAscPanel();},3500);return;}
    ascArmed=false;ascend();
  });
  $('#modalOk').addEventListener('click',function(){$('#modal').hidden=true;});
  document.addEventListener('visibilitychange',function(){if(document.hidden)save();else{lastHidden=0;}});
  window.addEventListener('resize',resize);
  if(window.ResizeObserver)new ResizeObserver(resize).observe($('#stage'));
  initTreeInput();buildTree();renderPanel();updateTree();resize();updateHUD();
}
var last=0,lastHidden=0;
function frame(now){
  var dt=(now-last)/1000;last=now;
  if(dt>5){applyOffline(dt);dt=.016;}
  dt=Math.min(.05,dt);
  if(view==='M'||true){update(dt);if(view==='M')draw();}
  requestAnimationFrame(frame);
}
function start(data){
  var o=null;
  if(data&&data.save)o=data.save;
  else{try{var t=localStorage.getItem(KEY);if(t)o=JSON.parse(t);}catch(e){}}
  S=loadObj(o);recalc();
  initUI();
  if(o){var away=(Date.now()-(S.saved||Date.now()))/1000;if(away>45)applyOffline(away);}
  else say('Tap or hold the glass to drop balls. Buy a launcher to keep them coming.');
  last=performance.now();requestAnimationFrame(frame);
}
window.__pachinko={get S(){return S;},BUILD:BUILD,bCost:bCost,tierNow:function(){return tierCost(S.tier+1)*M.tierCost;},UPS:UPS,VIS:VIS,LVLS:LVLS,evBall:evBall,recalc:recalc,ascend:ascend,buyBuilding:buyBuilding,buyTier:buyTier,buyUp:buyUp,buyVis:buyVis,buyLvl:buyLvl,buyNode:buyNode,update:update,draw:draw,dropAt:dropAt,fmt:fmt,gain:gain,tokensOnAscend:tokensOnAscend,get D(){return D;},get M(){return M;},onJackpot:onJackpot,setView:setView,renderPanel:renderPanel,setTab:function(t){tab=t;renderPanel();},ghostBall:ghostBall,stats:function(){return{balls:balls.length,particles:P.length};}};
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return{save:S};});
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>
